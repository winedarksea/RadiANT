# SPDX-License-Identifier: Apache-2.0
#
# Build arm 3 of the CC26xx coexistence A/B: the arbiter (RFCC26XX_scheduler
# Policy's submit/execute hooks, RF_scheduleCmd instead of RF_postCmd), with
# NO second RF core client. See docs/testing.md for the four-arm table.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_gate.conf"
#
# THE B OF THIS PARTICULAR A/B IS ti_coex.conf (arm 4), which now exists: same
# arbiter, same patch, plus a real second RF core client (the forked 802.15.4
# driver in radiant/coex154_ti/, which re-posts cmd_ieee_rx on
# preemption). It builds but has never run against an 802.15.4 peer - read its
# header before recording anything off the pair.
#
# Read THIS arm against ti_patch.conf (arm 2), NOT against a plain cc26xx build
# (arm 1) - tools/ab_gates.toml's
# arbiter_only_max_delta_pp must be measured against arm 2, or the arbiter
# gets charged for the patch swap ti_patch.conf isolates.
#
# ARM 3 IS GENUINELY MEANINGFUL HERE, more so than the nRF equivalent
# (gate.conf): with only one client, pCmdBg in the submit hook is our OWN
# previous command, so RF_verifyGap can refuse us where RF_postCmd
# structurally never could. A non-zero delta here is not automatically a
# bug - it is the scheduler doing more work even with nothing to arbitrate
# against.
#
# CHECK THE GENERATED .config, NOT THE BUILD LOG:
#
#   Select-String build\<dir>\<app>\zephyr\.config -Pattern "^CONFIG_RADIANT_BACKEND_"
#
# Expect BACKEND_CC26XX=y, BACKEND_CC26XX_COEX=y (which selects
# ..._MULTI_PATCH=y in turn - both should read y).

CONFIG_RADIANT_BACKEND_CC26XX_COEX=y
