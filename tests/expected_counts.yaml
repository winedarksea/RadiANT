# SPDX-License-Identifier: Apache-2.0
#
# Floors for the ztest job. A number in a file that only moves by a
# deliberate, reviewable edit - the same pattern as README.md's line cap,
# archive/'s 10 MB budget and the measured text/bss ceilings.
#
# WHY A FLOOR AND NOT AN EXACT COUNT: tests are added far more often than
# removed, so an exact count would fail on every honest addition and get
# relaxed reflexively until it meant nothing. A floor only fails when
# coverage goes DOWN - the event actually worth a red check. What it catches
# is not hypothetical: `twister -T app/radiant/tests` walks subdirectories,
# so a renamed or broken testcase.yaml drops a whole scenario and twister
# still exits 0, just quietly running fewer tests.
#
# HOW TO CHANGE THESE: raise a floor when coverage genuinely grows, in the
# same commit that grows it. Lowering one is a claim that coverage should
# shrink and needs a reason in the commit message.

# Twister scenarios across radiant/tests, radiant/tests/api,
# radiant/tests/gate, apps/hrm_ble/tests/sim_sched, apps/treadmill/tests/pages,
# apps/treadmill/tests/hr_rx and apps/trainer/tests/model. Counted from the
# seven testcase.yaml files: radiant.unit, radiant.unit.sec_modes,
# radiant.unit.no_pairing, radiant.unit.ack_faults, radiant.api,
# radiant.api.sec, radiant.api.sec_host, radiant.api.crc_repair, radiant.gate,
# hrm_ble.sim_sched, treadmill.pages, treadmill.hr_rx, trainer.model - the 13
# that min_scenarios below asserts. (2026-10-31 review:
# radiant.api.crc_repair - the first scenario that compiles the CRC-repair path
# at all; treadmill.hr_rx - the HR slave against a stub antr_*; and
# radiant.unit.pairing renamed no_pairing, now the build of the shipped
# default-n pairing configuration rather than a duplicate of radiant.unit.)
# A scenario counts only if it executed at least one case (or failed to
# build): a filtered/skipped one is not coverage.
#
# The eighth is the heart-rate node's beat scheduler and the ninth is the
# treadmill's state module and unit conversions. Both are reached only because
# the ztest job passes additional `-T app/apps/.../tests` arguments. If either
# is ever dropped, THIS number is what says so - which is the point, since the
# suites they cover are the ones that would have caught bugs that escaped
# everything else (a strap notifying 67 times a minute while claiming 72; a
# cadence reported in strides where a client expects steps).
#
# 2026-11-04: 13. radiant.unit.ack_faults (the suites with
# CONFIG_RADIANT_ACK_FAULTS compiled in - the only build where the reply_plan
# cases exist) and trainer.model (apps/trainer's physics and fault model,
# reached through the ztest job's `-T app/apps/trainer/tests`).
#
# 2026-11-10: 14. radiant.backend, the nRF backend completion path against
# register models.
min_scenarios: 14

# Total ztest cases twister executes, summed over every scenario. It equals the
# sum of the per-scenario floors below, so the backstop and the floors cannot
# disagree; the per-scenario floors are the real check. Raise it in the same
# commit that adds coverage; the reasoning behind each past raise is in
# `git log` on this file.
#
# 2026-11-09: RAISED FROM 3762 TO THE FIRST OBSERVED TWISTER TOTAL, 4167 on
# 7df6ada. Measured with the ztest job's own twister command and
# check_test_counts.py on a Linux machine, on the versions west.yml pins
# (docs/testing.md), rather than on a GitHub runner. 4168 since C5-1 added one
# gate test.
min_testcases: 4327

# Per-scenario floors (review 2026-10-31, E3-1). One floor per scenario,
# because the global count above sums them - three run the whole
# radiant/tests set each - and a whole suite, or every #if-guarded security
# suite (E3-3), could vanish under its slack. scripts/check_test_counts.py
# prints the executed count for each.
#
# 2026-11-09: +13 per unit scenario (coverage counter, the 0xF6 reply's
# coverage field, schedule-shape helpers for ADR 0018 and R1).
#
# 2026-11-09: each floor is that scenario's executed count from the run named
# above. The earlier values were nRF5340 DK counts minus about 1%, plus static
# counts. A floor equal to the observed count still fails only when coverage
# goes down, which is the event it exists to catch.
min_cases.radiant.unit: 993
min_cases.radiant.unit.sec_modes: 993
min_cases.radiant.unit.no_pairing: 941
min_cases.radiant.api: 65
min_cases.radiant.api.sec: 68
min_cases.radiant.api.sec_host: 81
min_cases.radiant.api.crc_repair: 66
# 32 since C5-1 (inline BLOCKED backs off the class that was refused). 38 with
# the extension skip (ADR 0021).
min_cases.radiant.gate: 72
# radiant.backend (ADR 0021): the backend completion path against register models.
min_cases.radiant.backend: 8
min_cases.hrm_ble.sim_sched: 4
min_cases.treadmill.pages: 20
min_cases.treadmill.hr_rx: 3
min_cases.radiant.unit.ack_faults: 1000
min_cases.trainer.model: 14
