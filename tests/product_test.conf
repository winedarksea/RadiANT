# SPDX-License-Identifier: Apache-2.0
#
# A TEST product identity, for the dual-preset success rows in
# scripts/build_all.ps1 (hrm_dual_*, tread_dual_*). It exists so that
# CONFIG_RADIANT_PRODUCT_STRICT has something to accept in CI; nothing built
# with it is a product.
#
# 65534 is an UNASSIGNED ANT+ manufacturer id, used here for test images
# only - never ship it. The ANT+ manufacturer list reserves no test value
# other than 255 (the development id, which strict mode refuses), so an
# unassigned number is the honest choice for a CI identity: it claims nobody's
# products.
#
# Each application's product.conf.example is the template a manufacturer
# copies; this file is the same shape with obviously-test values.
CONFIG_RADIANT_PRODUCT_MANUFACTURER_ID=65534
CONFIG_RADIANT_PRODUCT_MANUFACTURER_NAME="RadiANT CI test"
CONFIG_RADIANT_PRODUCT_MODEL_NUMBER=2
CONFIG_RADIANT_PRODUCT_MODEL_NAME="CI test unit"
CONFIG_RADIANT_PRODUCT_HW_REV=2
CONFIG_BT_DEVICE_NAME="RadiANT Test"
