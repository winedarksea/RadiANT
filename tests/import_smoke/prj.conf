# The module. On native_sim, the only board this is built for, the backend
# defaults to null, which needs no radio and no board-specific devicetree node.
# That is exactly right for a build meant to prove the module's SOURCE is
# self-contained, not its radio.
CONFIG_RADIANT=y
# The sample bus and the heart-rate decoder.
CONFIG_RADIANT_BRIDGE=y

CONFIG_LOG=y
