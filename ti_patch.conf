#
# Build arm 2 of the CC26xx coexistence A/B: the multi-protocol CPE patch
# alone, still RF_postCmd(). Isolates the patch's PHY cost from the
# scheduler's cost (arm 3, ti_gate.conf) - see docs/testing.md.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_patch.conf"
#
# WHY THIS ARM EXISTS SEPARATELY FROM ti_gate.conf. RF_applyRfCorePatch
# applies cpePatchFxn only at RF_PHY_BOOTUP_MODE and never re-applies it on a
# client switch, so whichever patch is resident at power-up is what BOTH RF
# core clients run under for the whole power cycle - matching Zephyr's
# 802.15.4 driver (rf_patch_cpe_multi_protocol) is mandatory once a second
# client exists. But every PHY constant in radiant_radio_cc26xx.c was
# measured under rf_patch_cpe_prop, so the patch swap is itself a real,
# separately measurable cost. Arm 3 (ti_gate.conf) selects this symbol too
# (RADIANT_CORE_BACKEND_CC26XX_COEX selects ..._MULTI_PATCH in Kconfig) - the
# arbiter_only_max_delta_pp gate in tools/ab_gates.toml is measured arm 3
# against THIS arm, not against arm 1 (today's build), so the arbiter is not
# charged for the patch swap.
#
# CHECK THE GENERATED .config, NOT THE BUILD LOG:
#
#   Select-String build\<dir>\<app>\zephyr\.config -Pattern "^CONFIG_RADIANT_CORE_BACKEND_"
#
# Expect BACKEND_CC26XX=y, BACKEND_CC26XX_MULTI_PATCH=y, and
# BACKEND_CC26XX_COEX unset (not =y) - this arm must NOT link the scheduler
# hooks, or it stops isolating what it is meant to isolate.

CONFIG_RADIANT_CORE_BACKEND_CC26XX_MULTI_PATCH=y
