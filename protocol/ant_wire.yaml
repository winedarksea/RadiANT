# ---------------------------------------------------------------------------
# RadiANT extension messages - NOT ANT protocol
# ---------------------------------------------------------------------------
#
# These are ours. They are not in Rev 5.1, no ANT device answers them, and no
# ANT host sends them. They are recorded here now, before anything implements
# them, so the id space is reserved rather than argued about later - and they
# are kept in their own section so that "an ANT message" and "a RadiANT
# message" can never be confused by a tool walking this file. The Python module
# exposes them as RADIANT_MESSAGES, deliberately not in MESSAGES.
#
# Semantics belong to docs/radiant-security.md. Only the numbering is decided
# here.
#
# ---------------------------------------------------------------------------
# WARNING: lib config 0xE0 (channel id + RSSI + RX timestamp,
# LIB_CONFIG_ALL_EXT_FIELDS above) is a completely different namespace from a
# message id, and it has not moved. The RadiANT message ids have: they were
# 0xE0-0xE4 and are now 0xF1-0xF5, for the reason below. So the two are no
# longer even numerically confusable - but the namespaces were never related in
# the first place, one being the ID field of a frame and the other a payload
# byte of message 0x6E, and that is the part worth remembering.
# ---------------------------------------------------------------------------
#
# WHY NOT 0xE0-0xE4, WHICH IS WHAT WAS FIRST PROPOSED
#
# sdk-ant defines MESG_EXT_ID_0 .. MESG_EXT_ID_4 as exactly 0xE0 .. 0xE4:
# an extended-message-id block selected by MSG_EXT_ID_MASK (0xE0) and reserved
# for ANT response and request messages that use extended message ids. Taking
# 0xE0-0xE4 would have collided head-on with the protocol we claim
# compatibility with. Do not re-propose it.
#
# The original argument for 0xE0 was that nothing at or above 0xC0 appears in
# src/ant_serial_bridge.c's dispatch, in any tools/ definition, or in the
# capabilities reply. Every one of those checks was correct, and the conclusion
# was still wrong, because **this repository is not the whole protocol**. The
# witnesses below enumerate what this repo knows; a message id is a claim about
# ANT, and ANT is larger than any of them. That is the generalisable lesson and
# it applies to every future id allocation, not just this one.
#
# Collision check, run against every witness available in this repository:
#
#   - src/ant_serial_bridge.c dispatch() and handle_request(): highest id 0x8C
#   - every MESG_* definition in tools/ant_wire.py: highest 0xAE, the
#     serial-layer error the dongle emits
#   - archive/host-api/ant_dll_exports.json, the real PE export directory of
#     ANT_DLL.dll: 36 distinct message ids, highest 0x7B. The entire
#     host-callable ANT API tops out there.
#   - the capabilities reply: no id space at all
#   - Rev 5.1's message table: the highest ids are the encryption block
#     0x7D-0x7F, active search sharing 0x81, the NVM crypto key ops around
#     0x83, the serial-layer 0xAE-0xAF and port-IO 0xB4-0xB5 messages, and an
#     AP2-era extension block around 0xC0-0xC7 (RSSI search threshold, sleep,
#     Garmin ESN, USB info).
#   - sdk-ant itself, read by the Wave 2 shim agent: the extended-id block
#     0xE0-0xE4 above, and MESG_DEBUG_ID at 0xF0. Nothing else at or above
#     0xC8, and nothing at all in 0xF1-0xFA.
#
# 0xF1-0xF5 is therefore chosen: one clear of sdk-ant's 0xF0, 0x11 clear of the
# top of the extended-id block, and 0x2A clear of the top of the AP2-era block.
# Honest limit on the Rev 5.1 bullet: it is recall of the public message table,
# not a citation - which is why 0xC0-0xC7 is left as a *range* claim and why
# MESG_RSSI_SEARCH_THRESHOLD_ID and MESG_SLEEP_ID carry `value: null` rather
# than a number. The sdk-ant bullet is a direct reading and is the one that
# moved these ids. 0xF1-0xF5 is also not confusable with SYNC (0xA4/0xA5) by a
# resynchronising parser, which 0xA4 itself would be.

radiant_messages:
  reserved_range: "0xF6-0xFA"
  reserved_desc: "Held for the rest of the RadiANT family. Claim by PR against
                  docs/profile-registry.md, same process as a device type."
  values:
    - name: MESG_RADIANT_SEC_CONFIG_ID
      id: 0xF1
      direction: h2d
      payload_len: var
      desc: "Select which of X_PRIV, X_CONF and X_AUTH are on for a channel.
             The three switches are independent, not a ladder."
      source: "K4 (docs/radiant-security.md sec 9)"
    - name: MESG_RADIANT_SET_KEY_ID
      id: 0xF2
      direction: h2d
      payload_len: var
      desc: "Install key material for a channel."
      source: "K4 (docs/radiant-security.md sec 9)"
    - name: MESG_RADIANT_EPOCH_ID
      id: 0xF3
      direction: both
      payload_len: var
      desc: "Read or set the current 128 s epoch counter that X_PRIV's device
             number rotation is derived from."
      source: "K4 (docs/radiant-security.md sec 9)"
    - name: MESG_RADIANT_SEC_STATUS_ID
      id: 0xF4
      direction: d2h
      payload_len: var
      desc: "Per-channel security state: which switches are active, replay
             counter high-water mark, spread-MAC verification result."
      source: "K4 (docs/radiant-security.md sec 9)"
    - name: MESG_RADIANT_PAIRING_ID
      id: 0xF5
      direction: both
      payload_len: var
      desc: "Drive the in-the-clear pairing exchange. An X_PRIV node pairs with
             rotation off and the pairing bit set, then switches to rotating -
             pairing in the clear is structural, not an oversight."
      source: "K4 (docs/radiant-security.md sec 9)"

# ---------------------------------------------------------------------------
# ANT_DLL exports with no message id recorded anywhere
# ---------------------------------------------------------------------------
#
# From archive/host-api/ant_dll_exports.json. These are host-library entry
# points that must correspond to *some* serial message, but neither this
# repository nor Rev 5.1 names the id, so nothing is invented for them. Listed
# so the gap is visible and so ant_dll_exports.json's null mesg_id fields are
# understood as researched rather than unfinished. `_RTO` variants are the same
# call with a response timeout and are not listed separately.

host_api_unmapped:
  - name: ANT_NVM_Clear
    desc: "User NVM. sdk-ant exposes no API for any of these six, so none can
           be bridged whatever their ids turn out to be."
  - name: ANT_NVM_Dump
    desc: "User NVM."
  - name: ANT_NVM_EndSector
    desc: "User NVM."
  - name: ANT_NVM_Lock
    desc: "User NVM."
  - name: ANT_NVM_SetDefaultSector
    desc: "User NVM."
  - name: ANT_NVM_Write
    desc: "User NVM."
