#
# The P4 gate's OTHER role: sleepy end device. Layered ON TOP of thread.conf.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=thread.conf;thread_sed.conf"
#
# Not a standalone fragment, and the semicolon list above is not a style choice:
# everything that makes this a Thread build at all lives in thread.conf, and
# duplicating it here would be a second copy to drift. This file is the ONE
# difference between the two arms, which is exactly what a reader comparing two
# loss numbers needs to see.
#
# ---------------------------------------------------------------------------
# WHY THIS IS THE INTENDED ROLE AND THE MED ARM IS STILL REQUIRED
# ---------------------------------------------------------------------------
#
# docs/radiant-bridge.md section 7.3b selects the sleepy role for blast-radius
# reasons, and the plan's P4 notes it is "the largest lever of all" - a SED
# schedules its own receive windows, so most of the time it is not asking for the
# radio at all.
#
# That is precisely why section 7.4 refuses to accept it alone: "a gate measured
# only in the role that schedules its own windows would be measuring the
# mitigation rather than the problem". If this arm passes and the MED arm fails,
# the honest statement is "coexistence works in the role we chose, and the choice
# is load-bearing" - which is a different, and much more fragile, claim than
# "coexistence works".
#
# ---------------------------------------------------------------------------
# THE TRAP THIS ARM CARRIES
# ---------------------------------------------------------------------------
#
# A SED that is doing its job is nearly silent, so `sent` from
# src/thread_coex_load.c matters MORE here than in the MED arm, not less. A run
# whose ANT+ loss is beautiful and whose `sent` is 3 has measured a board with no
# second stack traffic on it. The poll period below is what keeps the node
# attached and its parent's queue drained; the load's own datagrams are what
# actually contend.

CONFIG_OPENTHREAD_MTD_SED=y

# Milliseconds between data polls to the parent. Fast-poll rather than a
# power-realistic several seconds: the plan names "CSL child, then fast-poll SED"
# as the sequence, and a poll period longer than the load's own 100 ms interval
# would make the parent's queue, not the arbiter, the thing being measured.
CONFIG_OPENTHREAD_POLL_PERIOD=100
