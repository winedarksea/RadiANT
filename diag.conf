# Diagnostic overlay: send the log to flash instead of RTT, at DBG level.
#
#   west build ... -- "-DEXTRA_CONF_FILE=diag.conf"
#   (or "-DEXTRA_CONF_FILE=stub.conf;diag.conf" to also drop the radio)
#
# Read the result back after a double-tap of RESET with
#   .\scripts\read_flash_log.ps1
#
# This exists because the board has no debugger: RTT compiles but nothing can
# read it. Not for releases - it costs RAM, flash erase cycles and boot time.
# CONFIG_ANT_DONGLE_FLASH_LOG depends on FLASH rather than selecting it: FLASH
# is reachable from LOG through the coredump backend choice, and selecting it
# makes Kconfig report a dependency loop.
CONFIG_FLASH=y
CONFIG_ANT_DONGLE_FLASH_LOG=y

# RTT would just be dead weight without a probe attached.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n

# Deferred logging drops whatever is still queued when execution stops, which
# is precisely the interesting case. Immediate mode formats in the caller's
# context, so the last line before a hang is already in the buffer.
CONFIG_LOG_MODE_IMMEDIATE=y

# The failure being chased is inside usb_enable(), and its own DBG output names
# the step that failed - "Failed to fixup USB descriptor", endpoint validation,
# the nrfx driver's attach path.
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
CONFIG_USB_DRIVER_LOG_LEVEL_DBG=y

# Immediate mode formats every message on the stack of whichever thread logged
# it, and main() is what drives USB bring-up at DBG level. 2 KB (prj.conf) is
# not enough for that, and the overflow would look like the hang being chased.
CONFIG_MAIN_STACK_SIZE=4096
