#
# The A of the coexistence A/B: the arbiter, with NO second stack.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=gate.conf"
#
# The B is coex.conf, which is this plus a SoftDevice Controller that actually
# advertises. Read the two together; a number from either alone says nothing,
# because the question is what the other stack's demand costs us and that is a
# difference between two images.
#
# WHY THIS FILE EXISTS AT ALL, rather than "just leave coex.conf off". Turning
# on the gate is one line, and getting it wrong is silent both ways:
#
#   - RADIANT_CORE_BACKEND_NRF_GATE_MPSL was once `depends on MPSL` rather than
#     `select MPSL`, and nothing else in this tree enables MPSL. So asking for
#     the arbitrated build without a second stack - i.e. THIS measurement -
#     quietly compiled the DIRECT backend, and the A of the A/B measured the
#     thing the A/B was trying to isolate. It is `select` now; this fragment
#     names it anyway, so the intent survives another refactor of that line.
#   - A build with neither this nor coex.conf is the DIRECT backend, which is a
#     legitimate third measurement (the floor) and NOT the A. Three builds,
#     three fragments' worth of intent: direct = neither file, arbiter-only =
#     this file, contended = coex.conf.
#
# CHECK THE GENERATED .config, NOT THE BUILD LOG:
#
#   Select-String build\<dir>\<app>\zephyr\.config -Pattern "^CONFIG_RADIANT_CORE_BACKEND_"
#
# Expect BACKEND_NRF=y AND BACKEND_NRF_GATE_MPSL=y. BACKEND_NULL=y here is the
# failure that reports EXIT=0 and puts nothing on the air.

CONFIG_RADIANT_CORE_BACKEND_NRF_GATE_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
