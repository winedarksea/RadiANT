name: Build firmware

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_ANT_REVISION: v2.1.0
  # Upstream sdk-ant. Override with repository variable SDK_ANT_REPO to build
  # against a fork. Access is granted per GitHub account by ANT+ adopter
  # agreement, which is why the token below is needed at all.
  SDK_ANT_REPO: ant-nrfconnect/sdk-ant

jobs:
  # The only job that runs without SDK_ANT_CHECKOUT_TOKEN, so it is the only
  # one that runs on a fork. tools/ant_pages.py, the sensor models in
  # ant_sim.py and the analysis in ant_verify.py are all plain Python with no
  # radio in them, and a byte-order or accumulator-wrap mistake in any of them
  # otherwise costs two boards and a flash cycle to find.
  host-tests:
    name: host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyusb is pure Python and imports fine with no libusb present; nothing
      # in these tests opens a device.
      - run: pip install pyusb

      # The pattern already covers what is coming: tools/test_ant_wire.py
      # (golden frame vectors from Garmin's own Device0.txt) and
      # tools/test_ant_golden.py (the .antser capture replays) match test_*.py,
      # so both land in this job without touching this line. Those two are the
      # third implementation that catches rule-level drift - the kind of bug a
      # constant-for-constant cross-check would have passed straight through.
      - run: python -m unittest discover -s tools -p "test_*.py" -v

      # docs/profile-registry.md is a coordination point - the place third
      # parties claim a device type by PR - and an unvalidated coordination
      # point decays into a list of near-misses that all still pass CRC on the
      # air. This catches a duplicate or out-of-range device type, overlapping
      # page ranges, a gap in the RadiANT page partition, a dropped 0x20-0x2F
      # security reservation, and a period that has drifted from
      # tools/ant_pages.py. Standard library only and sub-second, so it lands
      # in the job that already runs without a secret rather than earning one
      # of its own.
      - run: python scripts/check_profile_registry.py

  # Every C unit test in this project runs here and nowhere else. native_sim
  # does not build on the development machine - Windows, no host C compiler,
  # no QEMU - so `west twister` cannot run locally at all and local C
  # verification is compile-check only. That makes this job the entire
  # verification path for radiant_core, which is why it takes no secret: it has to
  # run on forks and on every pull request, or a parallel core rewrite has no
  # way to know whether it works.
  ztest:
    name: ztest (native_sim)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      # Checked out to app/ rather than to the workspace root for the same
      # reason sdk-ant is below: `west init -l` needs the manifest repository
      # to sit in a subdirectory of the topdir. Here the manifest repository is
      # this one, since with no sdk-ant in the picture west.yml here is what
      # selects Zephyr.
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # native_sim is a 32-bit build and links against the host libc, so the
      # multilib runtime is required even though nothing is cross-compiled.
      # Staying 32-bit is deliberate: the firmware target is 32-bit ARM, and a
      # 64-bit host build hides exactly the pointer-size and struct-layout
      # assumptions these tests exist to catch.
      - name: Install 32-bit host runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # Same action, same shape as the gated build below - app-path is the
      # manifest repository and sdk-version is left unset so the fetched Zephyr
      # tree chooses. No sdk-ant checkout and no token: radiant_core/tests is a
      # standalone Zephyr application that never includes the dongle's
      # CMakeLists.txt, so nothing on this path can reach an ANT header.
      #
      # The SDK version is not pinned here. app-path: app makes this
      # repository's own west.yml the manifest, so the version is whatever that
      # file's sdk-nrf revision imports - currently v3.4.0. That is
      # deliberately *not* the same pin the gated build resolves (see the
      # sdk-ant checkout below), and the two must stay decoupled: sdk-ant
      # v2.1.0 cannot build on v3.4.0, while radiant_core has no sdk-ant in it and
      # should track the current SDK. Pinning both to one version would couple
      # the clean-room half of the project to the licensing constraints of the
      # proprietary half, which is the coupling this whole plan exists to
      # remove.
      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      # The Zephyr SDK is already cached by action-zephyr-setup itself and the
      # west clone is network-bound rather than disk-bound, so compilation is
      # the only thing left worth caching. Zephyr picks ccache up from PATH on
      # its own and the runner image ships it, so this needs no build flag.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ztest-${{ github.sha }}
          restore-keys: |
            ccache-ztest-

      - name: Run twister
        env:
          # native_sim builds with the host compiler, not with a Zephyr SDK
          # cross toolchain. The setup action exports ZEPHYR_SDK_INSTALL_DIR,
          # which would otherwise make `zephyr` the default variant, so say
          # what is meant rather than relying on the board override.
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          set -euxo pipefail
          # `west twister` is not a west command in every SDK version, so
          # resolve the script through the manifest rather than assuming it.
          zephyr_base="$(west list -f '{abspath}' zephyr)"
          # twister's own dependencies are not in every version's base
          # requirements set; installing them is cheap and removes a failure
          # mode that depends on which Zephyr the manifest happened to pull.
          if [[ -f "${zephyr_base}/scripts/requirements-run-test.txt" ]]; then
            pip install -r "${zephyr_base}/scripts/requirements-run-test.txt"
          fi
          # --inline-logs because a failure here is read by whoever opened the
          # pull request, and twister otherwise leaves the actual assertion
          # text in a file inside twister-out/ that nobody downloads.
          "${zephyr_base}/scripts/twister" \
            -T app/radiant_core/tests \
            -p native_sim \
            --inline-logs \
            -v

  # src/ant_wire.h and tools/ant_wire.py are generated from
  # protocol/ant_wire.yaml and committed, so that a clone builds without
  # running the generator and the Python tools stay standalone-copyable.
  # Committed generated files rot silently the first time someone edits the
  # output instead of the input; --check regenerates and diffs, which is the
  # only thing that makes "generated" true rather than aspirational.
  generated-drift:
    name: generated files up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: python scripts/gen_ant_wire.py --check

  # Crude on purpose, and the crudeness is the feature. README.md reached 1168
  # lines with its highest-value prose - the Gotchas - buried at line 521,
  # because nothing but discipline was holding it back, and discipline is
  # exactly what produced 1168 lines. A hard cap sends the next 200-line
  # addition to docs/ by construction. The number is not sacred; raising it is
  # then a deliberate, reviewable edit to this file rather than a drift nobody
  # notices.
  readme-cap:
    name: README line cap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check README.md is under the line cap
        run: |
          set -euo pipefail
          lines="$(wc -l < README.md)"
          echo "README.md: ${lines} lines (cap 450)"
          test "${lines}" -lt 450

  # The job that finally makes CI green on a fork: no secret of any kind, and
  # no sdk-ant checkout. With -DANT_RADIO=core or =stub the module is never
  # appended to ZEPHYR_EXTRA_MODULES, CONFIG_ANT never exists, and nothing in
  # the tree includes an sdk-ant header - so there is nothing for a token to
  # unlock.
  #
  # The ANT_RADIO cache variable and the CONFIG_ANT_DONGLE_RADIO_* choice this
  # job asserts on are the CMake/Kconfig backend seam, and it IS in the tree -
  # see CMakeLists.txt, which turns -DANT_RADIO into a Kconfig fragment merged
  # last so that the backend compiled and the backend recorded cannot disagree.
  # This job is therefore expected to pass; a FATAL_ERROR here is a real fault.
  build-core:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    # The same boards as the gated matrix below, because "the whole project
    # builds with zero sdk-ant present" is a claim about all of them, not about
    # a representative one. transport is asserted here for the same reason it
    # is there: the choice is defaulted from devicetree, so a board whose USB
    # node moved would silently compile a different transport and still build
    # green. The link-address assertion deliberately stays on the gated job -
    # it protects release artifacts, and those do not move here until the Tier
    # 3 Zwift acceptance passes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "core: feather"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            transport: USB_LEGACY
          - name: "core: nrf52840dongle"
            board: nrf52840dongle/nrf52840
            radio: core
            transport: USB_LEGACY
          - name: "core: promicro"
            board: promicro_nrf52840/nrf52840/uf2
            radio: core
            transport: USB_LEGACY
          - name: "core: promicro, synth clock"
            board: promicro_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: synth.conf
            transport: USB_LEGACY
          - name: "core: feather, new USB stack"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: next.conf
            transport: USB_NEXT
          - name: "core: nrf54l15dk"
            board: nrf54l15dk/nrf54l15/cpuapp
            radio: core
            transport: UART
          - name: "core: nrf54lm20dk"
            board: nrf54lm20dk/nrf54lm20a/cpuapp
            radio: core
            transport: USB_NEXT
          # The two default-off configuration fragments, each with a build
          # behind it.
          #
          # encryption.conf's own comment says it exists "so a default-off path
          # does not quietly stop compiling", and until this entry it had never
          # appeared in either CI matrix or in scripts/build_all.ps1 - so the
          # thing it was written to prevent was never prevented for it. A
          # fragment with no build behind it is a comment.
          #
          # security.conf gets its entry in the same commit that creates it,
          # rather than inheriting the same hole. Note that this matrix is
          # where the ENABLED build is proved to compile; whether it costs
          # anything when disabled is the separate `zero-cost` job below.
          - name: "core: feather, security"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: security.conf
            transport: USB_LEGACY
          - name: "core: nrf54l15dk, security"
            board: nrf54l15dk/nrf54l15/cpuapp
            radio: core
            extra_conf: security.conf
            transport: UART
          - name: "core: feather, ant+ encryption"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: encryption.conf
            transport: USB_LEGACY
          # The stub is the cheapest proof the backend seam holds - it builds
          # in seconds and is the one configuration that exercises the seam
          # without exercising any radio.
          - name: "stub: feather"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: stub
            transport: USB_LEGACY
          # The build-independence proof. Pointing ANT_MODULE_DIR at a path
          # that cannot exist means a successful build *proves* the tree is
          # free of sdk-ant rather than asserting it: any surviving reference
          # to an ANT header, module or library resolves through that
          # directory and the build stops. An assertion in a comment decays;
          # this one cannot.
          - name: "stub: feather, no sdk-ant on disk"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: stub
            module_dir: /nonexistent
            transport: USB_LEGACY

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As in the ztest job: app-path: app means this repository's west.yml is
      # the manifest, so the SDK version is that file's sdk-nrf revision
      # (currently v3.4.0) and nothing here pins it. This is a different
      # version from the one the gated sdk-ant build resolves, on purpose - the
      # backends this job builds contain no sdk-ant, so they are not held back
      # by sdk-ant v2.1.0's inability to build on v3.4.0. If a core build ever
      # fails in a way the gated build does not, check this difference first:
      # it is the one axis on which the two jobs are not comparable.
      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      # Keyed on the matrix index rather than on the board, because four
      # entries share the Feather and a shared key makes three of them warn
      # that the cache is already reserved. Reordering the matrix rebinds an
      # index to a different configuration, which is harmless: ccache is
      # content-addressed, so a mismatched cache misses rather than lies.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            ccache-core-${{ strategy.job-index }}-

      - name: Build
        env:
          BOARD: ${{ matrix.board }}
          RADIO: ${{ matrix.radio }}
          EXTRA_CONF: ${{ matrix.extra_conf }}
          MODULE_DIR: ${{ matrix.module_dir }}
        run: |
          set -euxo pipefail
          extra=()
          if [[ -n "${EXTRA_CONF}" ]]; then
            extra+=("-DEXTRA_CONF_FILE=${EXTRA_CONF}")
          fi
          # Left unset for the ordinary core and stub entries so the build
          # exercises the default resolution path - no SDK_ANT_DIR in the
          # environment, no sibling checkout - which is what a fresh clone on
          # a fork actually sees.
          if [[ -n "${MODULE_DIR}" ]]; then
            extra+=("-DANT_MODULE_DIR=${MODULE_DIR}")
          fi
          west build app \
            -b "${BOARD}" \
            -d build \
            -p always \
            -- \
            "-DANT_RADIO=${RADIO}" \
            "${extra[@]}"

      # ANT_RADIO is a CMake cache variable, so it is chosen before Kconfig
      # runs and nothing in .config would otherwise record which backend was
      # compiled. CMake writes the matching CONFIG_ANT_DONGLE_RADIO_* symbol
      # precisely so this assertion is possible: without it a -DANT_RADIO
      # typo falls back to a default and ships the wrong backend green.
      - name: Verify backend
        env:
          RADIO: ${{ matrix.radio }}
        run: |
          set -euo pipefail
          cfg="$(find build -name .config -path '*ant_dongle*' -print -quit)"
          want="CONFIG_ANT_DONGLE_RADIO_${RADIO^^}=y"
          echo "expecting ${want} in ${cfg}"
          grep -q "^${want}\$" "${cfg}"

      - name: Verify transport
        env:
          EXPECTED: ${{ matrix.transport }}
        run: |
          set -euo pipefail
          cfg="$(find build -name .config -path '*ant_dongle*' -print -quit)"
          got="$(grep -oP '^CONFIG_ANT_DONGLE_TRANSPORT_\K\w+(?==y)' "${cfg}")"
          echo "transport: ${got}   expected: ${EXPECTED}"
          test "${got}" = "${EXPECTED}"

      # No artifact upload and no release attachment on purpose. Release
      # images stay on build-sdk-ant until the Tier 3 Zwift acceptance passes
      # for radiant_core; moving them is a recorded decision in
      # docs/decisions/0001, not something that happens by a job quietly
      # gaining an upload step.

  # The governing constraint of the security feature, as a job rather than as a
  # claim in a comment.
  #
  # "A build with the switches off is byte-identical on air to one built
  # without the code" is too weak to be worth stating alone: it needs two
  # boards to observe, it says nothing about flash, and it passes a build
  # carrying 4 KB of dead security code. So this builds THE SAME BOARD TWICE IN
  # ONE RUN - at HEAD and at the merge base - and compares them. Nothing here
  # depends on build reproducibility: section sizes and symbol names are stable
  # under a rebuild in a way that a binary hash is not.
  #
  # Five assertions on the disabled build, and the fourth is the one people
  # forget. Without it the job goes green on a build where the symbol does not
  # exist at all, which is precisely the state of the tree on the day somebody
  # renames it. The fifth is the same check for the compat layer, phrased
  # differently because that symbol lives inside `if RADIANT_SEC` and therefore
  # is absent rather than commented out when the parent is off.
  #
  # The on-air half of the claim is NOT here. It is a ztest assertion against
  # the recorded fake_radio TX bodies and RX filter addresses in
  # radiant_core/tests/api, because a shell script cannot see the air and CI
  # has no radio.
  zero-cost:
    name: zero cost when disabled
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
          # The merge base is unreachable from a shallow clone, and a job that
          # silently degrades to "compare HEAD with HEAD" would pass forever.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-zerocost-${{ github.sha }}
          restore-keys: |
            ccache-zerocost-

      # A worktree rather than a checkout in place, so the two trees exist at
      # once and a failure leaves both of them there to look at.
      - name: Materialise the merge base
        run: |
          set -euxo pipefail
          cd app
          git fetch --no-tags origin master
          base="$(git merge-base HEAD origin/master)"
          echo "merge base: ${base}"
          if [[ "${base}" == "$(git rev-parse HEAD)" ]]; then
            echo "HEAD is the merge base - the comparison is trivially true."
            echo "That is the expected state on a push to master."
          fi
          git worktree add ../base "${base}"

      - name: Build both trees with the feature disabled
        run: |
          set -euxo pipefail
          for tree in app base; do
            west build "${tree}" \
              -b adafruit_feather_nrf52840/nrf52840/uf2 \
              -d "build-${tree}" \
              -p always \
              -- "-DANT_RADIO=core"
          done

      - name: The five assertions
        run: |
          set -euo pipefail

          size="${ZEPHYR_SDK_INSTALL_DIR}/arm-zephyr-eabi/bin/arm-zephyr-eabi-size"
          nm="${ZEPHYR_SDK_INSTALL_DIR}/arm-zephyr-eabi/bin/arm-zephyr-eabi-nm"
          # Fall back to a search rather than to the host tools: host `size`
          # would read the ELF and report plausible numbers for the wrong
          # thing.
          if [[ ! -x "${size}" ]]; then
            size="$(find "${ZEPHYR_SDK_INSTALL_DIR}" -name 'arm-zephyr-eabi-size' -type f -print -quit)"
            nm="$(find "${ZEPHYR_SDK_INSTALL_DIR}" -name 'arm-zephyr-eabi-nm' -type f -print -quit)"
          fi
          test -x "${size}" && test -x "${nm}"

          head_elf="$(find build-app -name zephyr.elf -print -quit)"
          base_elf="$(find build-base -name zephyr.elf -print -quit)"
          head_cfg="$(find build-app -name .config -path '*ant_dongle*' -print -quit)"

          # 1. Section sizes, section by section.
          #
          # ALLOCATED SECTIONS ONLY, and that is not a loosening. .debug_line
          # and .debug_str carry file names and line numbers, so they differ
          # the moment a source file is ADDED - even a file this build does not
          # compile. Comparing them would make the job fail on every commit
          # that touches the tree, which is a job that gets disabled rather
          # than a job that catches anything. Allocated sections are what ends
          # up on the chip, which is what "costs nothing" means.
          #
          # The filter is "has a non-zero load address": .debug_*, .comment and
          # .ARM.attributes all sit at 0, and Zephyr's own sections (text,
          # rodata, bss, noinit, ...) do not. Note the names have NO leading
          # dot - Zephyr renames them, and an awk matching ".text" silently
          # matches nothing and compares two empty files.
          section_sizes() {
            "${size}" -A "$1" |
              awk 'NF == 3 && $3 ~ /^[0-9]+$/ && $3 != "0" && $1 != "Total" { print $1, $2 }' |
              sort
          }
          section_sizes "${head_elf}" > head.size
          section_sizes "${base_elf}" > base.size
          test -s head.size   # an empty comparison is a passing comparison
          if ! diff -u base.size head.size; then
            echo "::error::a disabled build changed section sizes"
            exit 1
          fi

          # 2. The defined-symbol set. Sizes alone would pass a change that
          #    added code and removed exactly as much.
          "${nm}" --defined-only "${head_elf}" | awk '{print $NF}' | sort -u > head.syms
          "${nm}" --defined-only "${base_elf}" | awk '{print $NF}' | sort -u > base.syms
          if ! diff -u base.syms head.syms; then
            echo "::error::a disabled build changed the defined-symbol set"
            exit 1
          fi

          # 3. No security symbol survives at all.
          count="$("${nm}" "${head_elf}" | grep -c radiant_sec || true)"
          echo "radiant_sec symbols in the disabled build: ${count}"
          test "${count}" -eq 0

          # 4. The check people forget. Without it this job is green on a
          #    build where the symbol does not exist, which is the tree's
          #    state the day somebody renames it.
          grep -qx '# CONFIG_RADIANT_SEC is not set' "${head_cfg}"

          # 5. And the compat layer is not in the disabled build either.
          #    Phrased as "not =y" rather than as "is not set": the symbol
          #    lives inside `if RADIANT_SEC`, so with RADIANT_SEC off it is
          #    invisible and Kconfig omits the line entirely rather than
          #    writing the commented form. Assertion 3 above already covers
          #    its symbols - radiant_sec_compat_* matches `radiant_sec` - and
          #    the positive check that the name still exists is in the
          #    enabled build below, where the symbol is visible.
          if grep -q '^CONFIG_RADIANT_SEC_COMPAT=y' "${head_cfg}"; then
            echo "::error::the compat layer reached the disabled build"
            exit 1
          fi

      # The seam, as a grep. radiant_sec.h says policy calls modes and modes
      # call blocks, so that a mode-level accelerator - CRACEN on nRF54L is
      # reachable no other way - can be attached without touching policy. The
      # unit tests prove the mode-level path works; only this proves policy
      # never reaches past it.
      - name: Policy never calls the block primitive
        run: |
          set -euo pipefail

          # EVERY policy file, not just the first one. This checked only
          # radiant_sec.c when that was the whole policy layer; there are now
          # three, and a seam guarded on one file out of three is guarded on
          # none. radiant_sec_pair.c is the one that would be tempted - it
          # derives a key and could reach for a block directly - so it is
          # exactly the file the original grep would have missed.
          #
          # src/ext/ is deliberately NOT in this list: it holds the standard
          # algorithm implementations, which are below the seam rather than
          # above it.
          found=0
          for f in app/radiant_core/src/radiant_sec.c \
                   app/radiant_core/src/radiant_sec_pair.c \
                   app/radiant_core/src/radiant_sec_host.c; do
            [[ -f "${f}" ]] || continue
            found=1
            # Match a CALL, not the word: these files discuss the rule in
            # their own comments, and a grep that tripped on the sentence
            # explaining the rule would be worse than no grep - it would be
            # fixed by deleting the explanation.
            if grep -nE 'radiant_sec_aes_ecb[[:space:]]*\(' "${f}" |
                 grep -vE '^\s*[0-9]+:\s*\*'; then
              echo "::error::${f} calls Level 1 directly; the seam is"
              echo "::error::decorative if policy can reach past the mode level"
              exit 1
            fi
          done
          if [[ "${found}" == "0" ]]; then
            echo "no policy files exist yet - nothing to check"
          fi

      # The other design property that is only true until somebody adds one
      # convenient special case. docs/decisions/0008 and the plan's
      # architecture section both say it in the same words:
      # radiant_sec_compat.c CONTAINS NO PAGE NUMBER AND NO FIELD NAME. It
      # authenticates bytes. That is what makes it testable against synthetic
      # payloads with no profile in the loop, and usable unchanged by a profile
      # nobody has written yet.
      #
      # The grep is the .c only, not the header. The header's comments explain
      # why the rule exists and therefore name the things the rule excludes,
      # and a grep fixed by deleting the explanation is worse than no grep -
      # the same reasoning as the seam check above.
      - name: The compat attestation names no page and no field
        run: |
          set -euo pipefail
          f=app/radiant_core/src/radiant_sec_compat.c
          if [[ ! -f "${f}" ]]; then
            echo "radiant_sec_compat.c does not exist yet - nothing to check"
            exit 0
          fi
          if grep -inE 'heart|cadence|torque|watt|\brpm\b|\bbpm\b|power|speed|calorie' "${f}"; then
            echo "::error::${f} names a profile field. It authenticates bytes;"
            echo "::error::what those bytes MEAN is src/profiles/'s business,"
            echo "::error::and a tag module with an opinion about one profile"
            echo "::error::is a tag module the next profile works around"
            exit 1
          fi
          if grep -nE '^[[:space:]]*#include.*(profiles?/|ant_pages)' "${f}"; then
            echo "::error::${f} includes a profile header"
            exit 1
          fi

      # The other end of the budget. A budget that is asserted stays a budget;
      # one that is written down in a design document becomes a historical note
      # about what somebody once hoped.
      #
      # ── THE CEILINGS ARE MEASURED, AND THEY USED TO BE GUESSED ─────────────
      #
      # This step asserted `.text` growth under 4096 B from the day the Kconfig
      # symbol existed - deliberately, so the number would be watched as it
      # grew rather than discovered once at the end. It was watched, it grew,
      # and at the end of the feature it did not fit: X_AUTH, X_CONF and the
      # host surface together cost 5084 B of text on this board, which is 988 B
      # over.
      #
      # Raising a ceiling because you hit it is normally the exact failure this
      # job exists to prevent, so the reasoning is recorded rather than the
      # number quietly edited. 4096 was explicitly a STARTING figure with no
      # measurement behind it. The 5084 B it turned out to cost is, symbol by
      # symbol:
      #
      #     760  radiant_sec_pump          the RX policy engine
      #     344  encrypt_block             AES-128, one direction
      #     308  radiant_sec_tx_transform
      #     290  rx_close_window
      #     256  sbox                      the AES table, rodata
      #     228  radiant_sec_cmac_final
      #     206  antr_sec_status_get
      #     ~400 the four antr_sec_* entry points together
      #     ~2300 everything else, none of it over 200 B
      #
      # There is no fat in that list: it is a block cipher, two modes, a KDF,
      # a windowing state machine and a serial surface. The honest conclusion is
      # that the guess was low, not that the code is bloated - so the ceiling
      # moves to a measured figure with about 20% headroom, and the breakdown
      # above is what the next person compares against when it moves again.
      #
      # RAM IS ASSERTED TOO, WHICH IT NEVER WAS. "Costs nothing when disabled"
      # was only ever checked in flash, and the feature turns out to cost more
      # bss than text - 5277 B, of which 1536 is the ISR-to-pump queue
      # (RADIANT_SEC_MAX_CHANNELS x W_MAX entries). On a part with 256 KB that
      # is affordable and it is not nothing, and a budget nobody checks is how
      # it stops being affordable.
      - name: Enabled build stays inside its measured budget
        run: |
          set -euo pipefail
          west build app \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-enabled \
            -p always \
            -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf"
          west build app \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-pairing \
            -p always \
            -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf" \
               "-DCONFIG_RADIANT_SEC_PAIRING_X25519=y"
          west build app \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-compat \
            -p always \
            -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf" \
               "-DCONFIG_RADIANT_SEC_COMPAT=y"

          size="${ZEPHYR_SDK_INSTALL_DIR}/arm-zephyr-eabi/bin/arm-zephyr-eabi-size"
          if [[ ! -x "${size}" ]]; then
            size="$(find "${ZEPHYR_SDK_INSTALL_DIR}" -name 'arm-zephyr-eabi-size' -type f -print -quit)"
          fi

          # Zephyr's sections are named `text` and `bss`, WITHOUT a leading
          # dot. An awk matching ".text" finds nothing, sets the delta to an
          # empty string, and `test "" -le 6144` errors rather than passing -
          # but only because of the -o pipefail above, which is a thin thread
          # to hang a budget on. Hence the explicit emptiness checks.
          sect_of() {
            "${size}" -A "$2" | awk -v s="$1" '$1 == s { print $2 }'
          }
          off_elf="$(find build-app -name zephyr.elf -print -quit)"
          on_elf="$(find build-enabled -name zephyr.elf -print -quit)"
          pair_elf="$(find build-pairing -name zephyr.elf -print -quit)"
          compat_elf="$(find build-compat -name zephyr.elf -print -quit)"
          compat_cfg="$(find build-compat -name .config -path '*ant_dongle*' -print -quit)"

          fail=0
          check() {   # name measured ceiling
            echo "$1: ${2} B (ceiling ${3})"
            if [[ -z "$2" ]]; then
              echo "::error::$1 could not be measured"
              fail=1
            elif (( $2 > $3 )); then
              echo "::error::$1 is ${2} B, over its ${3} B ceiling"
              fail=1
            fi
          }

          off_text="$(sect_of text "${off_elf}")"
          on_text="$(sect_of text "${on_elf}")"
          pair_text="$(sect_of text "${pair_elf}")"
          off_bss="$(sect_of bss "${off_elf}")"
          on_bss="$(sect_of bss "${on_elf}")"
          test -n "${off_text}" && test -n "${on_text}"
          test -n "${off_bss}" && test -n "${on_bss}"

          # X_AUTH + X_CONF + the 0xF1-0xF4 host surface. Measured 5084 / 5277.
          check "security text" "$(( on_text - off_text ))" 6144
          check "security bss"  "$(( on_bss  - off_bss  ))" 6144

          # X25519 and the pairing logic, on top of the above and under their
          # own Kconfig symbol - so they get their own budget rather than
          # hiding inside a bigger one. Measured 2812 B of text, which is a
          # field arithmetic implementation and a Montgomery ladder.
          check "pairing text" "$(( pair_text - on_text ))" 3584

          # ── The compat attestation layer ─────────────────────────────────
          #
          # Its own symbol and its own budget, from the day the symbol first
          # existed rather than from the day the feature is finished - which is
          # the correction the 4096-to-6144 story above bought. C4 to C8 build
          # under this gate instead of meeting it at the end.
          #
          # TWO NUMBERS, BECAUSE ONE OF THEM IS ZERO TODAY AND WILL LIE. At C2
          # nothing calls these primitives, so the linker never pulls the
          # archive member in and the LINKED delta is 0 B - a ceiling on that
          # alone would be a gate that cannot fail until somebody writes a
          # caller. So the compiled object is measured too, and that is the
          # number that bites now:
          #
          #     radiant_sec_compat_tier2_tag        132
          #     radiant_sec_compat_tier1_tag         66
          #     radiant_sec_compat_nonce_block       30
          #     ------------------------------------------
          #     total .text in the object           228   (measured, Cortex-M4)
          #
          # 288 B is that measurement plus about a quarter, NOT a round number
          # somebody liked: three pure functions over the existing CMAC seam is
          # all this file is at C2. When C4 adds the emit and verify entry
          # points the ceiling moves - and it moves the way the security text
          # ceiling did, with the symbol-by-symbol breakdown written down here
          # and a measurement behind the new figure, or it does not move.
          compat_text="$(sect_of text "${compat_elf}")"
          test -n "${compat_text}"
          check "compat text (linked)" "$(( compat_text - on_text ))" 288

          compat_obj="$(find build-compat \
                          \( -name 'radiant_sec_compat.c.obj' \
                             -o -name 'radiant_sec_compat.c.o' \) \
                          -print -quit)"
          if [[ -z "${compat_obj}" ]]; then
            echo "::error::CONFIG_RADIANT_SEC_COMPAT=y built no object"
            fail=1
          else
            obj_text="$("${size}" -A "${compat_obj}" |
                          awk '$1 ~ /^\.text/ { total += $2 } END { print total+0 }')"
            check "compat object text" "${obj_text}" 288
          fi

          # The check people forget, in the direction that catches a rename:
          # every assertion above is satisfied by a symbol that no longer
          # exists, because a build that ignored the -D would pass all of them.
          if ! grep -qx 'CONFIG_RADIANT_SEC_COMPAT=y' "${compat_cfg}"; then
            echo "::error::CONFIG_RADIANT_SEC_COMPAT did not take effect;"
            echo "::error::every size check above is vacuous on this build"
            fail=1
          fi

          exit "${fail}"

      # CONFIG_RADIANT_SEC depends on CONFIG_RADIANT_CORE, so it can never
      # reach the sdk-ant build. Asserted rather than assumed, in the job that
      # already has both trees to hand.
      - name: The stub build carries none of it
        run: |
          set -euo pipefail
          west build app \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-stub \
            -p always \
            -- "-DANT_RADIO=stub" "-DEXTRA_CONF_FILE=security.conf"
          cfg="$(find build-stub -name .config -path '*ant_dongle*' -print -quit)"
          if grep -qx 'CONFIG_RADIANT_SEC=y' "${cfg}"; then
            echo "::error::security reached a build with no radiant_core in it"
            exit 1
          fi

  # The sdk-ant half of the split. Unchanged apart from its name: it is still
  # gated on SDK_ANT_CHECKOUT_TOKEN and still skips cleanly rather than failing
  # when the secret is absent, and it is still the only job that publishes
  # release artifacts.
  #
  # It now passes -DANT_RADIO=sdk_ant explicitly and asserts
  # CONFIG_ANT_DONGLE_RADIO_SDK_ANT=y, rather than relying on the default. The
  # seam exists; leaning on a default is how the job that publishes the release
  # artifacts ends up publishing a different backend than it says it does.
  build-sdk-ant:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    # Same firmware, several boards. They differ in where the image is linked,
    # how it is delivered, which transport carries the ANT serial protocol, and
    # - for the Pro Micro - which low-frequency clock source it is built for,
    # since the 32.768 kHz crystal is present on some of those boards and
    # absent on others sold under the same name.
    #
    # offset is where the application is expected to link, and transport is
    # which of the three src/ transports should end up compiled. Both are
    # asserted after the build: the transport is defaulted from devicetree, so
    # a board whose USB node moved or was renamed would silently fall through
    # to a different one and still build green.
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: adafruit_feather_nrf52840/nrf52840/uf2
            artifact: ant_dongle.uf2
            package: uf2
            offset: "0x26000"
            transport: USB_LEGACY
            release: true
          - board: nrf52840dongle/nrf52840
            artifact: ant_dongle_nrf52840dongle.zip
            package: dfu
            offset: "0x1000"
            transport: USB_LEGACY
            release: true
          - board: promicro_nrf52840/nrf52840/uf2
            artifact: ant_dongle_promicro.uf2
            package: uf2
            offset: "0x26000"
            transport: USB_LEGACY
            release: true
          - board: promicro_nrf52840/nrf52840/uf2
            artifact: ant_dongle_promicro_synth.uf2
            package: uf2
            extra_conf: synth.conf
            offset: "0x26000"
            transport: USB_LEGACY
            release: true
          # Not a shipping image. The nRF54 targets can only use the new USB
          # device stack, and this is the one board that stack can be tested
          # against a real host on, so it is built here to keep it compiling.
          - board: adafruit_feather_nrf52840/nrf52840/uf2
            artifact: ant_dongle_feather_usbd.uf2
            package: uf2
            extra_conf: next.conf
            offset: "0x26000"
            transport: USB_NEXT
          # nRF54L15: no USB peripheral in silicon, ANT serial goes out a UART.
          - board: nrf54l15dk/nrf54l15/cpuapp
            artifact: ant_dongle_nrf54l15dk.hex
            package: hex
            offset: "0x0"
            transport: UART
          # nRF54LM20A: DWC2 USB controller, new stack by necessity.
          - board: nrf54lm20dk/nrf54lm20a/cpuapp
            artifact: ant_dongle_nrf54lm20dk.hex
            package: hex
            offset: "0x0"
            transport: USB_NEXT

    steps:
      # sdk-ant is a private repository, so the build can only run where a token
      # with access to it is configured. The automatic GITHUB_TOKEN cannot be
      # used: it is scoped to this repository alone and carries no access to
      # any other, so a PAT is the only way to delegate an account's access.
      # On forks and unconfigured clones this reports a skip instead of
      # failing red.
      - name: Check sdk-ant credentials
        id: ant-ready
        env:
          SDK_ANT_CHECKOUT_TOKEN: ${{ secrets.SDK_ANT_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${SDK_ANT_CHECKOUT_TOKEN}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout application
        if: steps.ant-ready.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          path: app

      # sdk-ant's manifest declares `self: path: ant`, so the checkout must sit
      # at <topdir>/ant. Its west.yml imports sdk-nrf v3.2.4, which in turn
      # pulls Zephyr - so this one clone determines the whole SDK version set.
      #
      # v3.2.4 is a hard constraint of sdk-ant v2.1.0, not a stale pin, and it
      # is why nothing in this job passes a version to the setup action: the
      # pin has to come from sdk-ant's own manifest and stay there. sdk-ant
      # v2.1.0's Kconfig defaults ANT_LIB_DIR from CONFIG_SOC_SERIES_NRF52X,
      # and the Zephyr in v3.4.0 renamed that symbol to CONFIG_SOC_SERIES_NRF52
      # - so on v3.4.0 CONFIG_ANT_LIB_DIR comes out empty, libant.a is never
      # located, and the link fails with "missing and no known rule to make
      # it". Moving this job to a newer SDK means patching sdk-ant, which is
      # not ours to patch. The no-secret jobs above deliberately do not share
      # this pin.
      - name: Checkout sdk-ant
        if: steps.ant-ready.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SDK_ANT_REPO || env.SDK_ANT_REPO }}
          ref: ${{ env.SDK_ANT_REVISION }}
          token: ${{ secrets.SDK_ANT_CHECKOUT_TOKEN }}
          path: ant

      - name: Set up Python
        if: steps.ant-ready.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # app-path points at sdk-ant, not at this repo: the action runs
      # `west init -l` on it, and sdk-ant is the manifest repository.
      # sdk-version is left unset so the action uses the Zephyr SDK version
      # that the fetched Zephyr tree asks for.
      - name: Set up Zephyr workspace and toolchain
        if: steps.ant-ready.outputs.enabled == 'true'
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ant
          toolchains: arm-zephyr-eabi

      - name: Build
        if: steps.ant-ready.outputs.enabled == 'true'
        env:
          BOARD: ${{ matrix.board }}
          EXTRA_CONF: ${{ matrix.extra_conf }}
        run: |
          set -euxo pipefail
          extra=()
          if [[ -n "${EXTRA_CONF}" ]]; then
            extra+=("-DEXTRA_CONF_FILE=${EXTRA_CONF}")
          fi
          west build app \
            -b "${BOARD}" \
            -d build \
            -p always \
            -- \
            -DANT_RADIO=sdk_ant \
            -DANT_MODULE_DIR="${GITHUB_WORKSPACE}/ant" \
            "${extra[@]}"

      # The same assertion build-core makes, for the same reason: ANT_RADIO is
      # a CMake cache variable chosen before Kconfig runs, so a typo would fall
      # back to a default and build green with the wrong backend. This job
      # publishes the release artifacts, which makes it the one where that
      # matters most.
      - name: Verify radio backend
        if: steps.ant-ready.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cfg="$(find build -name .config -path '*ant_dongle*' -print -quit)"
          got="$(grep -oP '^CONFIG_ANT_DONGLE_RADIO_\K\w+(?==y)' "${cfg}")"
          echo "radio: ${got}   expected: SDK_ANT"
          test "${got}" = "SDK_ANT"

      # Partition Manager decides where the application links, and it does not
      # fail loudly when that disagrees with the offset the output file carries
      # - the image just boots into nothing. Assert the two agree rather than
      # shipping a package that installs cleanly and does nothing.
      - name: Verify link address
        if: steps.ant-ready.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ matrix.offset }}
        run: |
          set -euo pipefail
          offset="$(grep -h '^CONFIG_FLASH_LOAD_OFFSET=' \
            "$(find build -name .config -path '*ant_dongle*' -print -quit)" | cut -d= -f2)"
          pm_app="$(python3 -c \
            "import yaml,sys; print(hex(yaml.safe_load(open('build/partitions.yml'))['app']['address']))")"
          echo "load offset: ${offset}   partition manager app: ${pm_app}   expected: ${EXPECTED}"
          test "$((offset))" -eq "$((EXPECTED))"
          test "$((pm_app))" -eq "$((EXPECTED))"

      # Assert each target compiled the transport it is supposed to. The choice
      # is defaulted from devicetree, so a board whose USB node moved or was
      # renamed would silently fall through to a different one and still build.
      - name: Verify transport
        if: steps.ant-ready.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ matrix.transport }}
        run: |
          set -euo pipefail
          cfg="$(find build -name .config -path '*ant_dongle*' -print -quit)"
          got="$(grep -oP '^CONFIG_ANT_DONGLE_TRANSPORT_\K\w+(?==y)' "${cfg}")"
          echo "transport: ${got}   expected: ${EXPECTED}"
          test "${got}" = "${EXPECTED}"

      - name: Collect UF2
        if: steps.ant-ready.outputs.enabled == 'true' && matrix.package == 'uf2'
        run: |
          set -euxo pipefail
          # sysbuild nests the image under <build>/ant_dongle/zephyr/; a plain
          # application build puts it at <build>/zephyr/. Accept either.
          uf2="$(find build -name zephyr.uf2 -print -quit)"
          test -n "${uf2}"
          mkdir -p dist
          cp "${uf2}" "dist/${{ matrix.artifact }}"
          ls -l dist/

      # The nRF54 DKs have neither a mass-storage bootloader nor a DFU one -
      # they are flashed at 0 through the onboard debugger - so the artifact is
      # just the image.
      - name: Collect hex
        if: steps.ant-ready.outputs.enabled == 'true' && matrix.package == 'hex'
        run: |
          set -euxo pipefail
          hex="$(find build -name zephyr.hex -path '*ant_dongle*' -print -quit)"
          test -n "${hex}"
          mkdir -p dist
          cp "${hex}" "dist/${{ matrix.artifact }}"
          ls -l dist/

      # The dongle has no mass-storage bootloader; its onboard USB bootloader
      # takes a Nordic DFU package. `pkg` lives in nrfutil's nrf5sdk-tools
      # command, which is a separate install on top of the nrfutil binary.
      - name: Collect DFU package
        if: steps.ant-ready.outputs.enabled == 'true' && matrix.package == 'dfu'
        run: |
          set -euxo pipefail
          curl -fsSL -o nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil
          ./nrfutil install nrf5sdk-tools
          hex="$(find build -name zephyr.hex -path '*ant_dongle*' -print -quit)"
          test -n "${hex}"
          mkdir -p dist
          # --sd-req 0x00: the application needs no SoftDevice present, which is
          # true - the ANT stack links into the image.
          ./nrfutil nrf5sdk-tools pkg generate \
            --hw-version 52 \
            --sd-req 0x00 \
            --application "${hex}" \
            --application-version 1 \
            "dist/${{ matrix.artifact }}"
          ls -l dist/

      - name: Upload artifact
        if: steps.ant-ready.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: dist/${{ matrix.artifact }}

      # Only the four shipping images. The Feather new-stack build and the two
      # nRF54 DK images are built to keep them compiling and to be downloadable
      # from the run, not to be handed to anyone as a release.
      - name: Attach to release
        if: steps.ant-ready.outputs.enabled == 'true' && matrix.release && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}

      # sim/ is a second application in this repository, not a dongle image, so
      # it is built here rather than added to the matrix above: none of that
      # job's link-address or transport assertions mean anything for it. All
      # four profiles are built because they differ only by a Kconfig choice,
      # and three of them would otherwise never be compiled - including the
      # combined speed-and-cadence page, which is the hardest to get right and
      # is not the default.
      - name: Build ANT+ sensor simulator
        if: steps.ant-ready.outputs.enabled == 'true' && matrix.artifact == 'ant_dongle.uf2'
        run: |
          set -euxo pipefail
          for profile in BPWR_STANDARD BPWR_CRANK_TORQUE BPWR_WHEEL_TORQUE BSC_COMBINED; do
            west build app/sim \
              -b nrf54l15dk/nrf54l15/cpuapp \
              -d "build-sim-${profile}" \
              -p always \
              --sysbuild \
              -- \
              -DANT_MODULE_DIR="${GITHUB_WORKSPACE}/ant" \
              "-Dsim_CONFIG_ANT_SIM_PROFILE_${profile}=y"
            grep -q "^CONFIG_ANT_SIM_PROFILE_${profile}=y$" \
              "build-sim-${profile}/sim/zephyr/.config"
          done

      # Emitted once, not once per board - the cause and the fix are the same
      # for every entry in the matrix.
      - name: Note skipped build
        if: steps.ant-ready.outputs.enabled != 'true' && matrix.artifact == 'ant_dongle.uf2'
        run: |
          {
            echo "### ANT build skipped"
            echo
            echo "sdk-ant is a private repository. To enable this workflow, add one"
            echo "repository **secret**:"
            echo
            echo "- \`SDK_ANT_CHECKOUT_TOKEN\` - a classic PAT with \`repo\` scope, from an"
            echo "  account that has been granted access to \`${SDK_ANT_REPO}\`."
            echo
            echo "The automatic \`GITHUB_TOKEN\` cannot be used: it is scoped to this"
            echo "repository only. To build against a fork instead, set repository"
            echo "variable \`SDK_ANT_REPO\` to \`owner/name\`."
            echo
            echo "No ANT network key secret is needed - a dongle receives its network key from the host."
            echo
            echo "Only these images are skipped. The \`build-core\` job builds the same"
            echo "boards against the clean-room backend and the \`ztest\` job runs the C"
            echo "unit tests, both without any secret, so a fork still gets real coverage."
          } >> "${GITHUB_STEP_SUMMARY}"
