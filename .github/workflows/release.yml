# SPDX-License-Identifier: Apache-2.0
#
# THE RELEASE LANE: the full firmware matrix, and every artifact this project
# publishes.
#
# TAGS AND MANUAL DISPATCH ONLY. This used to run on every pull request and
# every push to master as part of `build.yml`, which meant ~40 firmware builds
# per push to prove something that only matters when an image ships.
#
# THE COST OF THAT, STATED RATHER THAN DISCOVERED: a board-specific build break
# is now invisible until somebody cuts a tag or runs this by hand. That is the
# chosen trade, and `workflow_dispatch` is the escape hatch - run this lane
# before cutting a release, not after.
#
# Everything cheap lives in ci.yml and still runs on every pull request.
name: Release build matrix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed by softprops/action-gh-release in build-core. ci.yml is narrowed to
# read for exactly this reason: only the lane that publishes gets to write.
permissions:
  contents: write

# NO SECRET IS USED ANYWHERE IN THIS FILE, and that is new. Until the
# 2026-08-20 switchover in
# docs/decisions/0001-backend-selection-and-release-default.md, every release
# artifact was cut by a `build-sdk-ant` job gated on SDK_ANT_CHECKOUT_TOKEN,
# because the shipping radio was Nordic's proprietary libant.a. It is now the
# clean-room radiant stack, so this whole lane - including the jobs that
# publish - runs to completion on a fork with nothing configured.
#
# sdk-ant is NOT gone from the project: it is still a selectable backend
# (-DANT_RADIO=sdk_ant) and still the other half of every A/B in
# tools/ab_gates.toml. It is gone from CI, deliberately, and is built by hand
# on a bench when a comparison is being run. apps/sim, which cannot build
# without it at all, goes the same way.

# NOT cancel-in-progress. A tag run produces release artifacts, and cancelling
# one half way through leaves a release with some of its images attached - the
# one state worse than no release at all. Superseding is right for a pull
# request and wrong here.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # THE JOB THAT SHIPS. No secret of any kind and no sdk-ant checkout: with
  # -DANT_RADIO=core or =stub the module is never appended to
  # ZEPHYR_EXTRA_MODULES, CONFIG_ANT never exists, and nothing in the tree
  # includes an sdk-ant header - so there is nothing for a token to unlock.
  #
  # This job used to build the same boards and deliberately upload NOTHING,
  # because release images stayed on the proprietary backend until the Tier 3
  # Zwift acceptance passed for radiant. It passed (a 30-minute ride, recorded
  # in docs/decisions/0001-backend-selection-and-release-default.md), so the
  # four shipping images are cut here now, and the `build-sdk-ant` job that
  # used to cut them is gone from this file entirely.
  #
  # WHAT THAT MOVED IN WITH IT: the rows carrying `artifact` also carry
  # `offset`, and the link-address assertion that used to live only on the
  # publishing job came along with them. It is not decoration. Partition
  # Manager decides where the application links and does NOT fail when that
  # disagrees with CONFIG_FLASH_LOAD_OFFSET - the image installs cleanly and
  # boots into nothing.
  #
  # The ANT_RADIO cache variable and the CONFIG_ANT_DONGLE_RADIO_* choice this
  # job asserts on are the CMake/Kconfig backend seam, and it IS in the tree -
  # see apps/dongle/CMakeLists.txt, which turns -DANT_RADIO into a Kconfig
  # fragment merged last so that the backend compiled and the backend recorded
  # cannot disagree. This job is therefore expected to pass; a FATAL_ERROR here
  # is a real fault.
  build-core:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    # Every board, because "the whole project builds with zero sdk-ant present"
    # is a claim about all of them, not about a representative one. transport
    # is asserted on all of them: the choice is defaulted from devicetree, so a
    # board whose USB node moved would silently compile a different transport
    # and still build green.
    #
    # FOUR ROWS CARRY `release: true` and they are the shipping images. A row
    # with `artifact` is packaged and uploaded from the run; a row that ALSO
    # has `release: true` is attached to a `v*` tag with its SHA-256. Every
    # other row exists to keep something compiling and is downloadable from the
    # run at most.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── THE FOUR SHIPPING IMAGES ─────────────────────────────────────
          #
          # THE FEATHER IMAGE CARRIES THE RGB INDICATOR, and this row is the
          # merge of what used to be two: a plain "core: feather" that shipped,
          # and a separate "core: feather, rgb activity led" that was built and
          # thrown away. Two Feather images of shipping shape, one of which
          # nobody was ever handed, is one image too many - so the activity
          # NeoPixel is now simply part of the product and the extra row is
          # gone.
          #
          # The assertions are the reason that row existed and they are kept
          # verbatim. CONFIG_WS2812_STRIP_SPI is `default y` gated purely on a
          # devicetree compatible, so it is exactly the kind of symbol that can
          # silently stop being selected when an overlay or a board file moves -
          # and the module would then fail to LINK rather than fail to work,
          # which is only obvious if something builds it. They matter more now
          # that this is the image users get, not less.
          - name: "core: feather, rgb activity led"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: rgb.conf
            extra_overlay: rgb_feather.overlay
            transport: USB_LEGACY
            artifact: radiant_dongle.uf2
            package: uf2
            offset: "0x26000"
            release: true
            assert_config: |
              CONFIG_ANT_DONGLE_RGB_LED=y
              # The driver the no-cost-to-the-radio argument depends on. If
              # this is absent the LED is being driven some other way - the
              # GPIO bit-bang holds irq_lock() for ~30 us per pixel against a
              # maskable priority-0 radio ISR - and the row must fail.
              CONFIG_WS2812_STRIP_SPI=y
              CONFIG_LED_STRIP=y
          - name: "core: nrf52840dongle"
            board: nrf52840dongle/nrf52840
            radio: core
            transport: USB_LEGACY
            artifact: radiant_dongle_nrf52840dongle.zip
            package: dfu
            offset: "0x1000"
            release: true
          - name: "core: promicro"
            board: promicro_nrf52840/nrf52840/uf2
            radio: core
            transport: USB_LEGACY
            artifact: radiant_dongle_promicro.uf2
            package: uf2
            offset: "0x26000"
            release: true
          # The Pro Micro sold without the 32.768 kHz crystal. Same image, a
          # synthesized low-frequency clock.
          - name: "core: promicro, synth clock"
            board: promicro_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: synth.conf
            transport: USB_LEGACY
            artifact: radiant_dongle_promicro_synth.uf2
            package: uf2
            offset: "0x26000"
            release: true
          # ── Everything below is built to keep it compiling ────────────────
          #
          # Not a shipping image. The nRF54 targets can only use the new USB
          # device stack, and the Feather is the one board that stack can be
          # tested against a real host on - so it is built here, and it is NOT
          # one of the two Feather images that were consolidated above.
          - name: "core: feather, new USB stack"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: next.conf
            transport: USB_NEXT
          - name: "core: nrf54l15dk"
            board: nrf54l15dk/nrf54l15/cpuapp
            radio: core
            transport: UART
          - name: "core: nrf54lm20dk"
            board: nrf54lm20dk/nrf54lm20a/cpuapp
            radio: core
            transport: USB_NEXT
          # The two default-off configuration fragments, each with a build
          # behind it.
          #
          # encryption.conf's own comment says it exists "so a default-off path
          # does not quietly stop compiling", and until this entry it had never
          # appeared in either CI matrix or in scripts/build_all.ps1 - so the
          # thing it was written to prevent was never prevented for it. A
          # fragment with no build behind it is a comment.
          #
          # security.conf gets its entry in the same commit that creates it,
          # rather than inheriting the same hole. Note that this matrix is
          # where the ENABLED build is proved to compile; whether it costs
          # anything when disabled is the separate `zero-cost` job below.
          - name: "core: feather, security"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: security.conf
            transport: USB_LEGACY
          - name: "core: nrf54l15dk, security"
            board: nrf54l15dk/nrf54l15/cpuapp
            radio: core
            extra_conf: security.conf
            transport: UART
          - name: "core: feather, ant+ encryption"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: encryption.conf
            transport: USB_LEGACY
          # The health counters had exactly the hole encryption.conf had: the
          # comment above says this matrix is where an ENABLED fragment is
          # proved to compile, and CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y had
          # never been compiled by any CI arm at all. Both transports get a
          # row because the counters are transport-specific - tx_drops,
          # tx_high_water and rx_backpressure are counted in the transport
          # file, so a legacy-only arm would leave the USB_NEXT half of them
          # unbuilt, which is how they came to be missing there in the first
          # place.
          # C2. crc_repair.conf is the B leg of the S3 sensitivity A/B, and
          # until this row it was a fragment with no build behind it - the
          # exact hole the comment above records for encryption.conf.
          - name: "core: feather, crc repair"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: crc_repair.conf
            transport: USB_LEGACY
            assert_config: |
              CONFIG_RADIANT_CRC_REPAIR=y
              # PROFILE_SANITY is the third refutation for a repaired frame;
              # an A/B with repair on and sanity off cannot tell a caught
              # mis-repair from an uncaught one, so the fragment sets both
              # and this row is what keeps them together.
              CONFIG_RADIANT_PROFILE_SANITY=y
          - name: "core: feather, health counters"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: health.conf
            transport: USB_LEGACY
            assert_config: |
              CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y
          - name: "core: feather, new USB stack, health counters"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: core
            extra_conf: next.conf;health.conf
            transport: USB_NEXT
            assert_config: |
              CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y
          # The activity-rate NeoPixel indicator does NOT have a row of its own
          # here any more. It is not that it stopped being built - it is that it
          # became the shipping Feather image, so its build is the first entry
          # in this matrix and its assertions went with it.
          #
          # The stub is the cheapest proof the backend seam holds - it builds
          # in seconds and is the one configuration that exercises the seam
          # without exercising any radio.
          - name: "stub: feather"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: stub
            transport: USB_LEGACY
          # The build-independence proof. Pointing ANT_MODULE_DIR at a path
          # that cannot exist means a successful build *proves* the tree is
          # free of sdk-ant rather than asserting it: any surviving reference
          # to an ANT header, module or library resolves through that
          # directory and the build stops. An assertion in a comment decays;
          # this one cannot.
          - name: "stub: feather, no sdk-ant on disk"
            board: adafruit_feather_nrf52840/nrf52840/uf2
            radio: stub
            module_dir: /nonexistent
            transport: USB_LEGACY

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As in the ztest job: app-path: app means this repository's west.yml is
      # the manifest, so the SDK version is that file's sdk-nrf revision
      # (currently v3.4.0) and nothing here pins it. That freedom is the point:
      # sdk-ant v2.1.0 cannot build on v3.4.0 at all (its Kconfig keys
      # ANT_LIB_DIR off a SoC symbol Zephyr renamed), and this lane no longer
      # contains a single sdk-ant build to be held back by it. A local
      # comparison build still needs NCS v3.2.4 - see scripts/build_all.ps1's
      # -NcsVersion - and nothing in CI has to care.
      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      # Keyed on the matrix index rather than on the board, because four
      # entries share the Feather and a shared key makes three of them warn
      # that the cache is already reserved. Reordering the matrix rebinds an
      # index to a different configuration, which is harmless: ccache is
      # content-addressed, so a mismatched cache misses rather than lies.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            ccache-core-${{ strategy.job-index }}-

      - name: Build
        env:
          BOARD: ${{ matrix.board }}
          RADIO: ${{ matrix.radio }}
          EXTRA_CONF: ${{ matrix.extra_conf }}
          EXTRA_OVERLAY: ${{ matrix.extra_overlay }}
          MODULE_DIR: ${{ matrix.module_dir }}
        run: |
          set -euxo pipefail
          extra=()
          if [[ -n "${EXTRA_CONF}" ]]; then
            extra+=("-DEXTRA_CONF_FILE=${EXTRA_CONF}")
          fi
          # A devicetree overlay applied on top of the board's own, for a
          # fragment whose feature needs hardware named that not every build of
          # the board has. The shipping Feather image now applies one - see
          # apps/dongle/rgb_feather.overlay for why the node still cannot
          # simply live in boards/ even though it does ship.
          if [[ -n "${EXTRA_OVERLAY}" ]]; then
            extra+=("-DEXTRA_DTC_OVERLAY_FILE=${EXTRA_OVERLAY}")
          fi
          # Left unset for the ordinary core and stub entries so the build
          # exercises the default resolution path - no SDK_ANT_DIR in the
          # environment, no sibling checkout - which is what a fresh clone on
          # a fork actually sees.
          if [[ -n "${MODULE_DIR}" ]]; then
            extra+=("-DANT_MODULE_DIR=${MODULE_DIR}")
          fi
          west build app/apps/dongle \
            -b "${BOARD}" \
            -d build \
            -p always \
            -- \
            "-DANT_RADIO=${RADIO}" \
            "${extra[@]}"

      # ANT_RADIO is a CMake cache variable, so it is chosen before Kconfig
      # runs and nothing in .config would otherwise record which backend was
      # compiled. CMake writes the matching CONFIG_ANT_DONGLE_RADIO_* symbol
      # precisely so this assertion is possible: without it a -DANT_RADIO
      # typo falls back to a default and ships the wrong backend green.
      - name: Verify backend
        env:
          RADIO: ${{ matrix.radio }}
        run: |
          set -euo pipefail
          cfg="$(find build -name .config -path '*/dongle/*' -print -quit)"
          want="CONFIG_ANT_DONGLE_RADIO_${RADIO^^}=y"
          echo "expecting ${want} in ${cfg}"
          grep -q "^${want}\$" "${cfg}"

      - name: Verify transport
        env:
          EXPECTED: ${{ matrix.transport }}
        run: |
          set -euo pipefail
          cfg="$(find build -name .config -path '*/dongle/*' -print -quit)"
          got="$(grep -oP '^CONFIG_ANT_DONGLE_TRANSPORT_\K\w+(?==y)' "${cfg}")"
          echo "transport: ${got}   expected: ${EXPECTED}"
          test "${got}" = "${EXPECTED}"

      # A fragment row that only proves "it still compiles" does not prove the
      # fragment did anything: a renamed symbol, a dropped file or a
      # ;-separated list the plumbing quietly ate all build green and set
      # nothing. Read the symbol back out of the .config that was actually
      # produced. This is the same read-back shape the node job uses, and it
      # is what makes `next.conf;health.conf` above a real test of the
      # separator rather than an assumption about it.
      #
      # This used to be a copy of the loop with an anchored REGEX rather than a
      # whole-line fixed-string compare, and with no `absent:` support - the
      # weakest of the four copies. It is now the same implementation as the
      # other three, which is a strengthening: `CONFIG_X=y` as a regex also
      # matches `CONFIG_X=yes`, and `.` in a symbol name matched anything.
      #
      # `./app/...` and not `./.github/...`: local action paths resolve against
      # the workspace root, and every job in this file checks this repository
      # out into app/.
      - name: Verify fragment symbols
        if: matrix.assert_config != ''
        uses: ./app/.github/actions/assert-kconfig
        with:
          path-filter: "*/dongle/*"
          expect: ${{ matrix.assert_config }}

      # ── PACKAGING AND PUBLISHING ─────────────────────────────────────────
      #
      # These steps moved here from the deleted `build-sdk-ant` job when the
      # release default switched to the clean-room backend
      # (docs/decisions/0001, 2026-08-20). They are unchanged from that job
      # apart from being gated on `matrix.artifact` instead of on a secret.
      #
      # Partition Manager decides where the application links, and it does not
      # fail loudly when that disagrees with the offset the output file carries
      # - the image just boots into nothing. Assert the two agree rather than
      # shipping a package that installs cleanly and does nothing.
      - name: Verify link address
        if: matrix.offset != ''
        env:
          EXPECTED: ${{ matrix.offset }}
        run: |
          set -euo pipefail
          offset="$(grep -h '^CONFIG_FLASH_LOAD_OFFSET=' \
            "$(find build -name .config -path '*/dongle/*' -print -quit)" | cut -d= -f2)"
          pm_app="$(python3 -c \
            "import yaml,sys; print(hex(yaml.safe_load(open('build/partitions.yml'))['app']['address']))")"
          echo "load offset: ${offset}   partition manager app: ${pm_app}   expected: ${EXPECTED}"
          test "$((offset))" -eq "$((EXPECTED))"
          test "$((pm_app))" -eq "$((EXPECTED))"

      - name: Collect UF2
        if: matrix.package == 'uf2'
        run: |
          set -euxo pipefail
          # sysbuild nests the image under <build>/dongle/zephyr/ (the sysbuild
          # image name, taken from apps/dongle's own directory basename); a
          # plain application build puts it at <build>/zephyr/. Accept either.
          uf2="$(find build -name zephyr.uf2 -print -quit)"
          test -n "${uf2}"
          mkdir -p dist
          cp "${uf2}" "dist/${{ matrix.artifact }}"
          ls -l dist/

      # The nRF54 DKs have neither a mass-storage bootloader nor a DFU one -
      # they are flashed at 0 through the onboard debugger - so the artifact is
      # just the image.
      - name: Collect hex
        if: matrix.package == 'hex'
        run: |
          set -euxo pipefail
          hex="$(find build -name zephyr.hex -path '*/dongle/*' -print -quit)"
          test -n "${hex}"
          mkdir -p dist
          cp "${hex}" "dist/${{ matrix.artifact }}"
          ls -l dist/

      # The dongle has no mass-storage bootloader; its onboard USB bootloader
      # takes a Nordic DFU package. `pkg` lives in nrfutil's nrf5sdk-tools
      # command, which is a separate install on top of the nrfutil binary.
      - name: Collect DFU package
        if: matrix.package == 'dfu'
        run: |
          set -euxo pipefail
          curl -fsSL -o nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil
          ./nrfutil install nrf5sdk-tools
          hex="$(find build -name zephyr.hex -path '*/dongle/*' -print -quit)"
          test -n "${hex}"
          mkdir -p dist
          # The application version comes from the root VERSION file, and this
          # step FAILS if it cannot be read. It used to be the literal 1, which
          # meant every published package declared the same version and the
          # bootloader's downgrade check compared 1 against 1 forever - inert,
          # and silently so. scripts/package_dfu.ps1 derives it identically
          # (0.1.0 -> 100); the two encodings must not drift apart.
          #
          # `app/scripts/...`, not `scripts/...`. Every job in this file checks
          # this repository out into app/, and the cwd is the workspace root -
          # so the bare path names nothing. It read `scripts/version_int.py`
          # while it lived on the gated job, where the only way to reach it was
          # a tag build with the secret configured; here it runs on every tag.
          # The script resolves VERSION from its own __file__, so only the path
          # to the script itself matters.
          appver="$(python app/scripts/version_int.py)"
          test -n "${appver}"
          echo "DFU application version: ${appver}"
          # --sd-req 0x00: the application needs no SoftDevice present. That was
          # true when the ANT stack linked into the image and is true now that
          # the radio is radiant - there has never been a SoftDevice here.
          ./nrfutil nrf5sdk-tools pkg generate \
            --hw-version 52 \
            --sd-req 0x00 \
            --application "${hex}" \
            --application-version "${appver}" \
            "dist/${{ matrix.artifact }}"
          ls -l dist/

      - name: Upload artifact
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: dist/${{ matrix.artifact }}

      # A tag that disagrees with VERSION produces a DFU package whose declared
      # version does not match the release it hangs off. Checked here rather
      # than in host-tests because only here is there a tag to check.
      - name: Tag agrees with VERSION
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        run: python app/scripts/version_int.py --check-tag "${GITHUB_REF_NAME}"

      # UF2 targets cannot be signed at all - the bootloader takes any image on
      # the drive - and the nRF52840 Dongle's DFU cannot USEFULLY be signed
      # either, because the stock Nordic bootloader validates against a key
      # compiled into itself. Replacing that bootloader would cost the
      # works-out-of-the-box property, so the posture is published sums rather
      # than a signature that would not be checked. SECURITY.md states this
      # plainly rather than leaving it implied; these are the sums it promises.
      - name: Publish SHA-256 of the artifact
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          sha256sum "dist/${{ matrix.artifact }}" | tee "dist/${{ matrix.artifact }}.sha256"
          {
            echo "### ${{ matrix.artifact }}"
            echo ''
            echo '```'
            cat "dist/${{ matrix.artifact }}.sha256"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Only the four shipping images. Every other row in this matrix is built
      # to keep it compiling and is downloadable from the run, not handed to
      # anyone as a release.
      - name: Attach to release
        if: matrix.release && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  # apps/dongle_thread and apps/dongle_ti - the two products Stage 6 of the
  # reorg plan adds. Neither needs sdk-ant (both build -DANT_RADIO=core), so
  # like build-core this runs on forks with no secret.
  #
  # apps/dongle_thread's gate.conf row mirrors what scripts/build_p4.ps1 runs
  # for real on a bench: the MPSL-arbitrated backend, on the board the P4 gate
  # actually uses. A plain row with no EXTRA_CONF_FILE is also here, because a
  # build with neither BLE nor Thread coex-load selected is this application's
  # OTHER normal configuration (see apps/dongle_thread/prj.conf's own header)
  # and both shapes have to stay green.
  #
  # apps/dongle_ti fetches hal_ti itself, the same way
  # scripts/fetch_hal_ti.ps1 does for a local build: NCS's manifest filters
  # the module out (it is not on nrf/west.yml's name-allowlist), so it is
  # never present unless something fetches it deliberately. The revision comes
  # from this job's own zephyr/west.yml, the same source of truth the script
  # reads, so the two cannot silently pin different commits.
  build-new-apps:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # The Matter rows are the long pole here: CHIP is a large C++ tree and a
    # cold-cache build of it is tens of minutes.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "dongle_thread: plain"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: "null"
          - name: "dongle_thread: P4 gate (nrf, MPSL)"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: nrf
            extra_conf: gate.conf
            assert_symbol: CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
            assert_core: "true"
          - name: "dongle_thread: Thread MED"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: nrf
            extra_conf: thread.conf
            assert_symbol: CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
            assert_core: "true"
          - name: "dongle_thread: Thread SED"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: nrf
            extra_conf: thread.conf;thread_sed.conf
            assert_symbol: CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
            assert_core: "true"
          # THE ARM THAT EARNS THIS JOB ITS PLACE. radiant/Kconfig's nrf
          # backend carries `depends on !BT || RADIANT_BACKEND_NRF_GATE_MPSL`,
          # so a build that turns CONFIG_BT on WITHOUT the gate does not fail -
          # the dependency goes unmet, the assignment becomes a no-op, and the
          # backend silently falls back to NULL. A NULL-radio image links,
          # enumerates, answers every host command with OK and puts nothing on
          # the air; this project has shipped one three times.
          #
          # This is the only arm in the matrix where CONFIG_BT is on, so it is
          # the only one that exercises that branch of the interlock at all.
          # Its presence is what turns a comment in Kconfig into a tested
          # property - which is also why it is checked for the ABSENCE of
          # CONFIG_RADIANT_BACKEND_NULL below and not only for the presence of
          # the gate.
          #
          # It is additionally Matter risk 1 (docs/matter-flash-spike.md): bug
          # 22's elastic_skew_us removal has only ever been measured against
          # OpenThread, and this is the BLE-advertiser arm that has to be
          # re-measured before the advertiser case is treated as settled.
          # Compiling it is not measuring it; that is a bench sitting.
          - name: "dongle_thread: BLE coexistence load"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: nrf
            extra_conf: coex.conf
            assert_symbol: CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
            assert_core: "true"
          # The rebroadcast bridge. Deliberately its own arm and NOT folded
          # into the thread rows: bridge.conf turns CONFIG_NET_TCP on, which
          # thread.conf leaves off, and docs/radiant-bridge.md section 7.4's
          # coexistence numbers were taken on a TCP-free image and do not
          # transfer to one with a TCP stack and a broker connection in it.
          - name: "dongle_thread: MQTT bridge"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: nrf
            extra_conf: thread.conf;bridge.conf
            assert_symbol: CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
            assert_core: "true"
            assert_sinks: "true"
          # ── THE MATTER ARM (plan package E8) ─────────────────────────────
          #
          # In one sentence: this catches an image that asked for CONFIG_CHIP=y,
          # built clean, exited 0, and contains no Matter and/or no ANT radio.
          # Three separate silent failures live here, and a green build sees
          # none of them.
          #
          # 1. SYSBUILD SILENTLY FORCES CONFIG_CHIP=n.
          #    nrf/sysbuild/CMakeLists.txt writes CONFIG_CHIP into every image
          #    from SB_CONFIG_MATTER, and it does so AFTER the application's own
          #    fragments have been read - so matter.conf's CONFIG_CHIP=y does
          #    not CONFLICT with an unset SB_CONFIG_MATTER, it is discarded by
          #    it. Clean build, exit 0, old image. That override is live for
          #    this repository specifically because connectedhomeip is in the
          #    workspace: nrf/west.yml puts the `matter` project in no group at
          #    all, so `west update` fetches it for every job in this file
          #    whether or not the job wants it. sysbuild_conf below is the
          #    prevention; assert_config is the proof, and it is a read-back of
          #    the GENERATED .config rather than of the build log, because the
          #    log says nothing either way.
          #
          # 2. THE BACKEND FALLS TO NULL - the coex.conf row's interlock,
          #    arriving through a different door and therefore not covered by
          #    it. Nothing in matter.conf, thread.conf or prj.conf writes
          #    CONFIG_BT=y; it arrives as `config BT / default y` inside
          #    `if CHIP` in connectedhomeip's Kconfig.defaults. radiant/Kconfig's
          #    nrf arm is `depends on !BT || RADIANT_BACKEND_NRF_GATE_MPSL`, so
          #    that default alone is enough to unmeet the dependency and drop
          #    the image to the inert radio. assert_symbol, assert_core and the
          #    CONFIG_RADIANT_BACKEND_NULL check below are the same three checks
          #    the coex row uses; CONFIG_BT=y is asserted in assert_config as
          #    well, because if BT ever STOPPED arriving by default those three
          #    would still pass while testing nothing.
          #
          # 3. THE WHOLE RADIANT MODULE IS GARBAGE-COLLECTED, and this is the
          #    one that has already happened. docs/matter-flash-spike.md's
          #    headline "+596 bytes for radiant" was not a small module: it was
          #    the ENTIRE radiant archive being discarded by --gc-sections
          #    because nothing in that image called it. A Matter image with no
          #    ANT radio in it compiles, links, boots and enumerates. Nothing in
          #    a .config can see a linker decision, so assert_elf_symbols is an
          #    nm check on the final ELF. radiant_radio_init is the plan's named
          #    canary; the rest are there because a regression in any one of
          #    them is equally invisible and the marginal cost of an extra line
          #    is nil (docs/matter-e3-vendoring.md verified the same set by
          #    hand, once, which is exactly the kind of check that decays).
          #
          # assert_sinks and assert_sink_names are the fourth thing, and see the
          # step itself for why the count alone would not have caught it.
          - name: "dongle_thread: Matter (CHIP + bridge core)"
            app: apps/dongle_thread
            board: nrf54l15dk/nrf54l15/cpuapp
            radiant_backend: nrf
            extra_conf: thread.conf;matter.conf
            sysbuild_conf: matter_sysbuild.conf
            assert_symbol: CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
            assert_core: "true"
            assert_sinks: "true"
            # Deliberately short. Every line here is a symbol whose WRONG value
            # still produces a working build - CONFIG_CHIP is trap 1, CONFIG_BT
            # is trap 3's arrival, and the two ANT_DONGLE_MATTER symbols are
            # what decide whether radiant_matter.c is compiled at all. The
            # mandatory-but-noisy lines (STD_CPP17, EVENTFD,
            # CHIP_FACTORY_DATA_NONE, MPSL_TIMESLOT_SESSION_COUNT) are NOT here:
            # each of those fails the build or a BUILD_ASSERT when wrong, so
            # asserting them would only couple this file to matter.conf's exact
            # contents without catching anything the build does not already.
            assert_config: |
              CONFIG_CHIP=y
              CONFIG_BT=y
              CONFIG_ANT_DONGLE_MATTER=y
              CONFIG_ANT_DONGLE_MATTER_MAP=y
            assert_elf_symbols: |
              radiant_radio_init
              radiant_sched_tick
              radiant_matter_row
              radiant_matter_convert
              radiant_matter_endpoint_for
              radiant_matter_sink
            # FOUR, not three, and the fourth is the one that is easy to lose.
            # radiant_matter.c's sink carries the VALUES; src/matter/ant/
            # ant_matter_sink.c carries the BINDINGS and RADIANT_SAMPLE_STALE,
            # because radiant_matter.c passes NULL for binding_changed and its
            # want() is filtered to mapped field types. An image that linked
            # the first and dropped the second would publish measurements to
            # endpoints that never got created and would never mark a sensor
            # unreachable - and every other check in this row would stay green.
            assert_sink_names: |
              radiant_liveness_sink
              radiant_matter_glue_sink
              radiant_rules_sink
              radiant_matter_sink
          # ── THE nRF5340 MATTER ROW IS DELIBERATELY ABSENT ────────────────
          #
          # The plan asks for "one build-new-apps row per DK". There is no
          # nRF5340 row here, and the reason is not that it fails to build - it
          # is that the only nRF5340 build that CAN exist today would be green
          # and would prove the opposite of what it appears to prove.
          #
          # apps/dongle_thread cannot be CONFIGURED for nrf5340/cpuapp at all
          # while any of its fragments names the MPSL gate. Measured, in
          # docs/matter-e1-readback.md: RADIANT_BACKEND_NRF_GATE_MPSL
          # (radiant/Kconfig) does an unconditional `select MPSL`, and MPSL's
          # own `depends on` list has no SOC_NRF5340_CPUAPP in it - the
          # nRF5340's radio and its arbiter are both on cpunet. Kconfig stops
          # with "MPSL has direct dependencies ... with value n, but is
          # currently being y-selected". That is fatal for thread.conf,
          # gate.conf, coex.conf, bridge.conf and matter.conf alike, i.e. for
          # every arm this application has.
          #
          # The build that would go green is the one E1 had to use to get its
          # nRF5340 numbers: -DRADIANT_BACKEND=null, with every MPSL and backend
          # line stripped out. A row like that would sit in this matrix under a
          # name containing "Matter" and "nRF5340" and would assert nothing
          # about RadiANT on that part, while the NULL-backend check three
          # steps below - the check this whole job exists for - would have to be
          # switched OFF for it to pass. A row that has to disable the interlock
          # to stay green is worse than no row.
          #
          # PACKAGE F IS THE PREREQUISITE, and specifically these three things,
          # after which this row can be written and this comment deleted:
          #   - radiant/Kconfig's nrf arm admits the nRF5340 (F1), and
          #     radiant_radio_nrf.c gains its NRF53 address-arithmetic branch;
          #   - the MPSL gate MOVES to cpunet with the backend (F2), so that
          #     `select MPSL` is made from an image where MPSL exists - this is
          #     the half the plan does not mention and it is the blocking one;
          #   - apps/dongle_thread's own nRF5340 board hygiene is fixed: E1
          #     found boards/nrf5340dk_nrf5340_cpuapp.conf turns RTT off without
          #     unsetting prj.conf's SEGGER_RTT_MODE_NO_BLOCK_SKIP and
          #     LOG_BACKEND_RTT_MODE_DROP, leaving two orphaned choice
          #     selections, which are Kconfig-warning-level and therefore fatal.
          #     This application has never been configured for that board.
          # The row will also need its own SB_CONFIG_NETCORE_IPC_RADIO* flags,
          # which cannot live in matter_sysbuild.conf because those symbols do
          # not exist on the nRF54L15 (SUPPORT_NETCORE is nRF53/nRF54H only).
          - name: "dongle_ti: cc26xx"
            app: apps/dongle_ti
            board: cc26x2r1_launchxl
            radiant_backend: cc26xx
            fetch_hal_ti: "true"
            assert_symbol: CONFIG_RADIANT_BACKEND_CC26XX=y

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-new-apps-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            ccache-new-apps-${{ strategy.job-index }}-

      # See scripts/fetch_hal_ti.ps1's own header for the full mechanism this
      # mirrors: hal_ti is a project the resolved manifest has never heard of,
      # not one west chose to skip, so a single-revision fetch straight from
      # upstream is the only route in. Read from THIS job's own
      # zephyr/west.yml so the pin can never drift from what the rest of the
      # build resolves.
      - name: Fetch hal_ti
        if: matrix.fetch_hal_ti == 'true'
        run: |
          set -euo pipefail
          zephyr_base="$(west list -f '{abspath}' zephyr)"
          manifest="${zephyr_base}/west.yml"
          revision="$(awk '
            /^\s*- name: hal_ti\s*$/ { infound=1; next }
            infound && /^\s*revision:/ { print $2; exit }
            infound && /^\s*- name:/ { exit }
          ' "${manifest}")"
          if [[ -z "${revision}" ]]; then
            echo "::error::no hal_ti revision found in ${manifest}"
            exit 1
          fi
          echo "hal_ti revision ${revision} (from ${manifest})"
          dest="$(dirname "${zephyr_base}")/modules/hal/ti"
          mkdir -p "${dest}"
          git -C "${dest}" init --quiet
          git -C "${dest}" remote add origin https://github.com/zephyrproject-rtos/hal_ti
          git -C "${dest}" fetch --depth 1 origin "${revision}"
          git -C "${dest}" checkout --quiet --detach "${revision}"
          test -f "${dest}/zephyr/module.yml"
          echo "HAL_TI_DIR=${dest}" >> "$GITHUB_ENV"

      # THE TWO HOST TOOLS NORDIC SHIPS IN THE TOOLCHAIN BUNDLE AND A RUNNER
      # DOES NOT HAVE. action-zephyr-setup installs the Zephyr SDK, which is
      # compilers; a CHIP build needs two more things and neither degrades
      # gracefully.
      #
      # gn: modules/lib/matter/config/common/cmake/chip_gn.cmake does
      # `find_program(GN_EXECUTABLE gn REQUIRED)` - connectedhomeip is a GN
      # project that NCS drives from CMake, so this is a hard configure-time
      # stop, not a fallback to something slower.
      #
      # The Python packages: BYPASS_IDL stops `chip_zapgen` from running, which
      # is why the committed zap-generated/ is the build-critical artefact
      # (docs/matter-e3-vendoring.md) - but it does NOT stop `chip_codegen`,
      # which runs modules/lib/matter/scripts/codegen.py over the committed
      # bridge.matter on every build. That is read off a real build's generated
      # build.ninja, not assumed. codegen.py imports click and python_path, and
      # reaches py_matter_idl straight out of the source tree, which parses with
      # lark and renders with jinja2.
      #
      # nrf/scripts/requirements-extra.txt names jinja2, python-path and
      # matter_idl for exactly this reason and is deliberately NOT what is
      # installed here: its first line is an `--index-url` pointing at Nordic's
      # artifactory mirror, which REPLACES PyPI for the whole install rather
      # than adding to it, and it drags in pygit2, Pillow, PyGithub and
      # nrfcloud-utils on the way past.
      #
      # Gated on sysbuild_conf because matter_sysbuild.conf is the only sysbuild
      # fragment this application has and turning CHIP on is the only thing it
      # does. If a second one ever appears, this needs a key of its own.
      - name: Install gn and the Matter code generator's Python dependencies
        if: matrix.sysbuild_conf != ''
        run: |
          set -euxo pipefail
          pip install jinja2 lark click python-path coloredlogs
          # The upstream distribution channel for a gn binary; there is no
          # apt package and connectedhomeip's own bootstrap pulls it from the
          # same place, along with a whole pigweed environment this build does
          # not need.
          curl -fsSL -o /tmp/gn.zip \
            "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          mkdir -p "${HOME}/.local/bin"
          unzip -o /tmp/gn.zip gn -d "${HOME}/.local/bin"
          chmod +x "${HOME}/.local/bin/gn"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/gn" --version

      - name: Build
        env:
          APP: ${{ matrix.app }}
          BOARD: ${{ matrix.board }}
          RADIANT_BACKEND: ${{ matrix.radiant_backend }}
          EXTRA_CONF: ${{ matrix.extra_conf }}
          SYSBUILD_CONF: ${{ matrix.sysbuild_conf }}
        run: |
          set -euxo pipefail
          extra=("-DANT_RADIO=core" "-DRADIANT_BACKEND=${RADIANT_BACKEND}")
          if [[ -n "${EXTRA_CONF}" ]]; then
            extra+=("-DEXTRA_CONF_FILE=${EXTRA_CONF}")
          fi
          # SYSBUILD-SCOPED, and that is the whole point of it: SB_EXTRA_CONF_FILE
          # is read by sysbuild itself, before it decides what to write into the
          # image's CONFIG_CHIP. An image-scoped fragment cannot prevent trap 1
          # no matter what it contains.
          #
          # Quoted like everything else here. On bash the quoting is
          # redundant; it is kept because the local reproduce path is
          # PowerShell 5.1, which splits an unquoted
          # -DSB_EXTRA_CONF_FILE=matter_sysbuild.conf at the DOT and passes
          # CMake `-DSB_EXTRA_CONF_FILE=matter_sysbuild` plus a stray `.conf`,
          # failing with "File not found" on a name nobody wrote
          # (docs/matter-e3-vendoring.md measured this). Two commands that
          # differ in quoting are two commands.
          if [[ -n "${SYSBUILD_CONF}" ]]; then
            extra+=("-DSB_EXTRA_CONF_FILE=${SYSBUILD_CONF}")
          fi
          if [[ -n "${HAL_TI_DIR:-}" ]]; then
            extra+=("-DEXTRA_ZEPHYR_MODULES=${HAL_TI_DIR}")
          fi
          west build "app/${APP}" \
            -b "${BOARD}" \
            -d build \
            -p always \
            -- "${extra[@]}"

      # Same silent-fallback trap every other RADIANT_BACKEND row in this
      # file guards against: the symbol has a `depends on`, and an unmet one
      # makes the assignment a no-op rather than an error. A row with no
      # assert_symbol (the plain dongle_thread build) has nothing to check
      # beyond "it linked".
      - name: Verify backend
        if: matrix.assert_symbol != ''
        env:
          WANT: ${{ matrix.assert_symbol }}
          ASSERT_CORE: ${{ matrix.assert_core }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # A SYSBUILD BUILD HAS TWO .config FILES and only one of them holds
          # CONFIG_*. build/<image>/zephyr/.config is the image; build/zephyr/.config
          # is sysbuild's own and contains SB_CONFIG_* exclusively, so every
          # assertion below would fail against it - with an error message about
          # the backend rather than about the file. Prefer the image directory,
          # which is named for the application directory, and fall back to the
          # first .config found for a board where sysbuild is not in play. Same
          # prefer-then-fall-back shape as the build-node job's step, and the
          # same reason build-core path-qualifies with '*/dongle/*'.
          cfg="$(find build -name .config -path "*/$(basename "${APP}")/*" -print -quit)"
          if [[ -z "${cfg}" ]]; then
            cfg="$(find build -name .config -print -quit)"
          fi
          echo "expecting ${WANT} in ${cfg}"
          grep -qx "${WANT}" "${cfg}"

          # THE NEGATIVE CHECK IS THE IMPORTANT ONE and it is not implied by
          # the positive one above. RADIANT_BACKEND is a CMake cache variable
          # resolved before Kconfig exists, so a -D that fails to take does not
          # error - it leaves the default, and the default is the inert radio.
          # An image with CONFIG_RADIANT_BACKEND_NULL=y links, enumerates,
          # answers every host command with OK and transmits nothing, which
          # reads at a bench as a dead antenna rather than as a build fault.
          if grep -qx 'CONFIG_RADIANT_BACKEND_NULL=y' "${cfg}"; then
            echo "::error::CONFIG_RADIANT_BACKEND_NULL=y - this image has no radio"
            exit 1
          fi
          if [[ "${ASSERT_CORE}" == "true" ]]; then
            # ANT_RADIO is the other cache variable decided before Kconfig, and
            # it fails the same silent way. CMake writes this symbol out on
            # purpose so that there is something to check.
            grep -qx 'CONFIG_ANT_DONGLE_RADIO_CORE=y' "${cfg}"
            grep -qx 'CONFIG_RADIANT_BACKEND_NRF=y' "${cfg}"
          fi

      # TRAP 1, AS A READ-BACK. Separate from the backend step above because it
      # is a different kind of claim: that one asks whether a -D took effect,
      # this one asks whether something ELSE overwrote a symbol the application
      # set for itself. nrf/sysbuild/CMakeLists.txt writes CONFIG_CHIP into the
      # image from SB_CONFIG_MATTER after the application's fragments have been
      # merged, so an unset SB_CONFIG_MATTER does not conflict with
      # matter.conf's CONFIG_CHIP=y - it silently replaces it, and the build
      # log is identical either way. Reading the GENERATED .config is the only
      # thing that can tell the two apart, which is why the plan says so twice.
      #
      # `absent:CONFIG_X` is supported for the same reason the build-node job
      # supports it: Kconfig omits a symbol entirely when its `depends on` is
      # unmet and only writes the "# ... is not set" form for a symbol that is
      # visible and merely off, so the two cases need different assertions.
      - name: Verify the configuration survived sysbuild
        if: matrix.assert_config != ''
        uses: ./app/.github/actions/assert-kconfig
        with:
          # The application's own image, not sysbuild's: the action takes the
          # basename of this and uses it as the path filter, which is what
          # separates apps/dongle_thread's .config from the mcuboot image
          # sitting beside it.
          app: ${{ matrix.app }}
          expect: ${{ matrix.assert_config }}

      # THE --gc-sections CHECK, AND IT IS NOT A REPEAT OF THE .config CHECKS
      # ABOVE. Kconfig decides what is COMPILED; the linker decides what is
      # KEPT. Zephyr builds with -ffunction-sections -fdata-sections and links
      # with --gc-sections, so a translation unit that nothing calls is
      # discarded after a completely successful compile, and no symbol in any
      # .config changes when that happens.
      #
      # This has already cost this project once. docs/matter-flash-spike.md
      # reported radiant costing 596 bytes on top of a Matter template, which
      # was read as a headline "Matter and RadiANT fit" result; the 596 bytes
      # were what was left after --gc-sections threw the entire radiant archive
      # away, because that spike's application called none of it. E1 hit the
      # same thing pointed at CHIP (zero chip:: symbols in the ELF) and E3 hit
      # it pointed at the vendored bridge core (zero Nrf::Bridge* symbols). The
      # failure mode is consistent and it always looks like a success: a Matter
      # image with no ANT radio in it links, boots, enumerates and answers.
      #
      # Whole-symbol matching, not a substring: `radiant_matter_convert` must
      # not be satisfied by `radiant_matter_convert_with`, and a check that can
      # be satisfied by a near-miss is not a check.
      #
      # THE nm THIS NEEDS IS NOT ON PATH. This step called a bare
      # `arm-zephyr-eabi-nm` and died with `command not found` - and then
      # reported that as a missing linker fragment, which is the wrong fault
      # entirely. The tool is resolved once, by its own action, and passed in.
      - name: Resolve arm-zephyr-eabi binutils
        if: matrix.assert_elf_symbols != '' || matrix.assert_sinks == 'true'
        id: binutils
        uses: ./app/.github/actions/arm-binutils

      - name: Verify the linker kept the symbols that matter
        if: matrix.assert_elf_symbols != ''
        uses: ./app/.github/actions/assert-symbols
        with:
          nm: ${{ steps.binutils.outputs.nm }}
          defined: ${{ matrix.assert_elf_symbols }}

      # RADIANT_SINK_DEFINE() uses STRUCT_SECTION_ITERABLE, and the section it
      # emits into is placed only by radiant_bridge_sections.ld, which the
      # application has to add with zephyr_linker_sources(). Forget it and the
      # final link fails - but if it ever DID link, STRUCT_SECTION_FOREACH()
      # over an unplaced section is not a compile error: it silently iterates
      # zero sinks, and every sample the bridge produces goes nowhere while
      # everything reports success.
      #
      # A silent failure is worth two lines of CI. The firmware also logs
      # "bridge: N sinks" at boot and errors on zero, but that needs a console
      # and a board; this needs neither.
      #
      # WHICH sinks, not just how many, and the Matter arm is why. The plan
      # says to watch for the boot line "bridge: 2 sinks" and treat "1 sink" as
      # radiant_matter.c having been left out. Both numbers are wrong, and the
      # count is the wrong instrument regardless. Measured with nm on real
      # ELFs of both arms:
      #
      #   thread.conf;bridge.conf  ->  radiant_liveness_sink, radiant_mqtt_sink,
      #                                radiant_rules_sink            = 3 sinks
      #   thread.conf;matter.conf  ->  radiant_liveness_sink, radiant_matter_sink,
      #                                radiant_rules_sink            = 3 sinks
      #
      # radiant_liveness.c registers an ordinary RADIANT_SINK_DEFINE() sink of
      # its own and is compiled unconditionally under CONFIG_RADIANT_BRIDGE,
      # which is what the plan's arithmetic misses. So the boot line reads
      # "bridge: 3 sinks" in BOTH arms, and a Matter image that silently
      # dropped radiant_matter.c and kept the MQTT sink would show the expected
      # count while bridging nothing to Matter. The names are the check;
      # the span below stays because it is the one that catches the missing
      # linker fragment, which is a different fault.
      #
      # Entries are enumerated by ADDRESS RANGE rather than by dividing the
      # span by sizeof(struct radiant_sink): the size of that struct is not
      # visible from here, and a check that hardcodes it would start lying the
      # day a field is added. Address filtering gives exactly the set
      # STRUCT_SECTION_FOREACH() will walk, i.e. exactly the number
      # bridge_pump.c will print.
      - name: Verify the bridge sink section was placed
        if: matrix.assert_sinks == 'true'
        uses: ./app/.github/actions/assert-symbols
        with:
          nm: ${{ steps.binutils.outputs.nm }}
          sink-section: "true"
          sink-names: ${{ matrix.assert_sink_names }}

  # apps/hrm_ble - the heart-rate node, and the manufacturer reference design.
  #
  # It had no CI job and was not in scripts/build_all.ps1 either, so nothing
  # anywhere compiled it. That is why this job landed BEFORE the STRAP_* -> HRM_*
  # rename rather than after: a rename that broke the build would otherwise have
  # stayed invisible until somebody next needed the board. The rename has since
  # happened, and the symbol names below are the evidence that the ordering was
  # honoured rather than merely intended.
  #
  # A separate job rather than rows in build-new-apps for two reasons. Its
  # BLE conf is image-scoped (`-Dhrm_ble_EXTRA_CONF_FILE=`, not the sysbuild
  # cache's plain `-DEXTRA_CONF_FILE=`), and its assertion is over several
  # symbols at once rather than one. It cannot join build-core at all, whose
  # steps assert CONFIG_ANT_DONGLE_* symbols that do not exist in a node.
  #
  # No secret and no sdk-ant, so it runs on forks and on every pull request.
  build-node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "hrm_ble: ANT+ node"
            # No BLE: the baseline the others are read against, and the
            # configuration a manufacturer starts from.
            #
            # HRM_BLE_HRS is asserted ABSENT, not "is not set". Kconfig omits
            # a symbol entirely when its `depends on` is unmet - here
            # `depends on BT && BT_PERIPHERAL` - and only writes the
            # "# ... is not set" form for a symbol whose dependencies are met
            # and which is merely off. CONFIG_BT is the second kind, so the two
            # rows below are deliberately different forms. Measured on a real
            # .config, after asserting the wrong form here first.
            board: nrf54l15dk/nrf54l15/cpuapp
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              CONFIG_HRM_SENSOR_SIMULATED=y
              # CONFIG_BT is not set
              absent:CONFIG_HRM_BLE_HRS
          # THE OTHER HALF OF THE nrf BACKEND'S `depends on`.
          #
          # radiant/Kconfig's nrf arm is `SOC_COMPATIBLE_NRF52X ||
          # SOC_COMPATIBLE_NRF54LX`. Until this row existed only the nRF54L half
          # was ever compiled anywhere in CI, so the profile + node combination
          # had never been built on the family most existing ANT+ silicon
          # actually is. It needs boards/nrf52840dk_nrf52840.overlay, whose
          # TIMER4 is forced by the backend's five-CC-channel requirement.
          #
          # BUILD-ONLY, and that limit is real: there is no nRF52 bench slot for
          # this application, and radiant/Kconfig records that the part's on-air
          # behaviour is predicted from nRF54L15 measurements, not confirmed.
          - name: "hrm_ble: ANT+ node (nRF52840)"
            board: nrf52840dk/nrf52840
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              CONFIG_HRM_SENSOR_SIMULATED=y
              # CONFIG_BT is not set
          - name: "hrm_ble: BLE HRS"
            # CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL and
            # CONFIG_MPSL_TIMESLOT_SESSION_COUNT are asserted here even though
            # ble.conf no longer sets either. That is exactly why: they now come
            # from a `select` and a `default` on HRM_BLE_HRS in
            # apps/hrm_ble/Kconfig, and a Kconfig `default` placed after the
            # symbol's own definition is silently dead. These two lines are what
            # tell the difference between the guard working and the guard being
            # a comment.
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: ble.conf
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
              CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
              CONFIG_HRM_BLE_HRS=y
              CONFIG_BT=y
              # Kconfig's negative form carries the leading "# ", and this
              # line did not until it was checked against a real .config: it
              # read `CONFIG_RADIANT_BACKEND_NULL is not set`, which
              # `grep -qxF` can never match, so the assertion was
              # unsatisfiable rather than merely weak.
              #
              # THAT FIX LANDED ON THIS LINE ALONE AND FIVE OTHERS KEPT THE
              # DEFECT - two `CONFIG_BT`, one `CONFIG_HRM_SUPPRESS_...` and two
              # `CONFIG_HRM_SENSOR_SIMULATED` in this same job - which is what
              # made CI red for months. All six are correct now, and
              # .github/actions/assert-kconfig rejects the malformed form BY
              # NAME so the next one cannot be a silent always-fail.
              # CONFIG_RADIANT_BACKEND_NULL is not set
              # The 1 s connection policy, and it is asserted for the same
              # reason the two GATE_MPSL lines above are: these four come from
              # `default`s redeclared in apps/hrm_ble/Kconfig, and a Kconfig
              # default that lands after the symbol's own definition is
              # silently dead. Until they were set, Zephyr's own defaults
              # published a 30-50 ms PPCP *and* self-requested 30-50 ms five
              # seconds into every connection, bypassing le_param_req
              # entirely - so the policy the application believed it was
              # enforcing was never on the air. BT_LL_SOFTDEVICE is here
              # because the arbitrated backend has no meaning under the
              # open-source controller.
              CONFIG_BT_PERIPHERAL_PREF_MIN_INT=800
              CONFIG_BT_PERIPHERAL_PREF_MAX_INT=800
              CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
              CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
              CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
              CONFIG_BT_LL_SOFTDEVICE=y
          - name: "hrm_ble: BLE HRS, no ANT suppression"
            # The row that actually stresses the arbiter: with suppression on
            # (the default) the two stacks never genuinely contend. A layered
            # conf fragment, not a -DCONFIG_ on the command line - see
            # ble_nosuppress.conf for why that would be one more silent no-op.
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: "ble.conf;ble_nosuppress.conf"
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
              CONFIG_HRM_BLE_HRS=y
              # CONFIG_HRM_SUPPRESS_ANT_WHEN_CONNECTED is not set
          # THE SENSOR SEAM'S SECOND IMPLEMENTATION. A seam with one
          # implementation is indistinguishable from a direct call with extra
          # prototypes - the same argument this file already makes about
          # encryption.conf. src/hrm_sensor_example.c is also the arm that
          # reports beats from interrupt context, which is the case the
          # lock-free {seq, event_time} record exists for.
          - name: "hrm_ble: example sensor driver"
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: sensor_example.conf
            assert_symbols: |
              CONFIG_HRM_SENSOR_EXAMPLE=y
              # CONFIG_HRM_SENSOR_SIMULATED is not set
          # THE ARM WITH NO SENSOR IN IT. CONFIG_HRM_SENSOR_CUSTOM compiles no
          # implementation of the seam at all, deliberately - there is no
          # fallback to the simulator. The image must still LINK, because an
          # integrator's first build failing for a reason unrelated to their
          # driver is an expensive way to start.
          - name: "hrm_ble: custom sensor (nothing registered)"
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: sensor_custom.conf
            assert_symbols: |
              CONFIG_HRM_SENSOR_CUSTOM=y
              # CONFIG_HRM_SENSOR_SIMULATED is not set
              absent:CONFIG_HRM_SENSOR_SIM_BPM

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-node-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            ccache-node-${{ strategy.job-index }}-

      - name: Build
        env:
          BOARD: ${{ matrix.board }}
          IMAGE_CONF: ${{ matrix.image_conf }}
          EXTRA_CMAKE: ${{ matrix.extra_cmake }}
        run: |
          set -euxo pipefail
          extra=("-DRADIANT_BACKEND=nrf")
          # IMAGE-SCOPED, and the prefix is the basename of the application
          # directory. This is the whole point of the job: after strap/ was
          # renamed to apps/hrm_ble, `-Dstrap_EXTRA_CONF_FILE=` named an image
          # that no longer existed. CMake said nothing beyond its end-of-run
          # "manually-specified variables were not used" warning, CONFIG_BT
          # stayed unset, radiant/Kconfig's `depends on !BT || ..._GATE_MPSL`
          # was satisfied by its !BT half, and the BLE image built green with
          # no BLE in it. Two builds - one with the flag, one without - produced
          # byte-identical .config files, which is what makes that a measured
          # claim rather than a plausible one.
          #
          # Every configuration axis in this matrix goes through a conf FRAGMENT
          # for the same reason, including the sensor choice: a bare
          # -DCONFIG_HRM_SENSOR_EXAMPLE=y would land in the sysbuild cache and
          # never reach the image, and the build would compile the simulator and
          # pass.
          if [[ -n "${IMAGE_CONF}" ]]; then
            extra+=("-Dhrm_ble_EXTRA_CONF_FILE=${IMAGE_CONF}")
          fi
          if [[ -n "${EXTRA_CMAKE}" ]]; then
            extra+=(${EXTRA_CMAKE})
          fi
          west build app/apps/hrm_ble \
            -b "${BOARD}" \
            -d build \
            -p always \
            -- "${extra[@]}"

      # THE STEP THAT EARNS THE JOB. A build-only check passes the silent-no-op
      # above without noticing; asserting the resulting .config is the only
      # thing that would not have. Every symbol here has a `depends on`
      # somewhere, which is what makes an unmet assignment a no-op rather than
      # an error.
      - name: Verify the configuration that was asked for took effect
        uses: ./app/.github/actions/assert-kconfig
        with:
          path-filter: "*hrm_ble*"
          expect: ${{ matrix.assert_symbols }}

  # apps/treadmill - the fitness-equipment node, and this tree's second
  # manufacturer reference design.
  #
  # A CLONE OF build-node RATHER THAN A PARAMETERISATION OF IT, and the choice
  # is recorded because the alternative was considered. Parameterising would
  # mean an `app` and a `conf_prefix` input on one job, which works right up
  # until the two applications' assertion sets diverge - and they already have:
  # this one has no HRM_SENSOR choice, has a TREADMILL_SOURCE choice instead,
  # and asserts CONFIG_BT_SMP, which apps/hrm_ble has no equivalent of at all.
  # A shared job whose matrix rows assert disjoint symbol sets is a shared job
  # in name only.
  #
  # NOT build-new-apps EITHER, and this is the trap that job would have walked
  # into: its conf flag is the plain non-image-scoped `-DEXTRA_CONF_FILE=`,
  # which for a sysbuild application lands in the sysbuild cache and never
  # reaches the image. Every BLE row here would have built green with no BLE
  # in it - which is exactly the failure apps/hrm_ble already shipped once and
  # measured.
  #
  # NO dist\ ARTIFACT is involved: node-class applications produce none.
  #
  # No secret and no sdk-ant, so it runs on forks and on every pull request.
  build-treadmill:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "treadmill: ANT+ FE-C + SDM"
            # The baseline: both ANT+ masters, no BLE, no arbiter.
            #
            # TREADMILL_BLE is asserted ABSENT, not "is not set", and the
            # difference is the same one the build-node job measured on a real
            # .config: Kconfig omits a symbol entirely when its `depends on` is
            # unmet - here `depends on BT && BT_PERIPHERAL` - and only writes
            # the "# ... is not set" form for a symbol whose dependencies are
            # met and which is merely off. CONFIG_BT is the second kind, so the
            # two lines below are deliberately different forms.
            board: nrf54l15dk/nrf54l15/cpuapp
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              CONFIG_TREADMILL_SOURCE_SIMULATED=y
              CONFIG_TREADMILL_ANT_SDM=y
              # CONFIG_BT is not set
              absent:CONFIG_TREADMILL_BLE
          # THE OTHER HALF OF THE nrf BACKEND'S `depends on`, exactly as in
          # build-node. ANT+ only: the BLE arm on nRF52 would be the first time
          # SDC, MPSL, the gate, two hand-written GATT services and SMP were
          # compiled together on that family, and there is no nRF52 bench slot
          # for this application.
          - name: "treadmill: ANT+ node (nRF52840)"
            board: nrf52840dk/nrf52840
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              CONFIG_TREADMILL_SOURCE_SIMULATED=y
              # CONFIG_BT is not set
          # THE COEXISTENCE FALLBACK, COMPILED SO IT CANNOT ROT. Two ANT+
          # masters at 8192 and 8134 counts beat against each other with a
          # period of about 32 s, and this project has measured one master
          # beside BLE and eight masters beside 802.15.4 but never this mix.
          # A fallback nobody compiles is not a fallback.
          - name: "treadmill: FE-C only (coexistence fallback)"
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: fec_only.conf
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              # CONFIG_TREADMILL_ANT_SDM is not set
          - name: "treadmill: FTMS + RSC"
            # CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL,
            # CONFIG_MPSL_TIMESLOT_SESSION_COUNT, CONFIG_BT_RSCS and
            # CONFIG_BT_SMP are asserted here even though ble.conf sets none of
            # them. That is exactly why: they come from `select`s and a
            # `default` on TREADMILL_BLE in apps/treadmill/Kconfig, and a
            # Kconfig `default` placed after the symbol's own definition is
            # silently dead.
            #
            # BT_SMP IS THE NEW ONE IN THIS TREE. FTMS v1.0 Table 4.1 gives the
            # Fitness Machine Control Point security permission "Encryption",
            # so a build without SMP would advertise a control point no client
            # can ever write - which looks exactly like a machine that ignores
            # commands rather than like a misconfiguration.
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: ble.conf
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF=y
              CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
              CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
              CONFIG_TREADMILL_BLE=y
              CONFIG_BT=y
              CONFIG_BT_RSCS=y
              CONFIG_BT_SMP=y
              CONFIG_BT_SETTINGS=y
              # BT_LL_SOFTDEVICE was the one this row did not assert while the
              # hrm_ble row did. TREADMILL_BLE now `select`s it, as
              # HRM_BLE_HRS always has. Latent rather than live when it was
              # found - the SDC is already the default link layer for
              # CONFIG_BT=y on nRF54L15, verified from the generated .config -
              # and that is the argument for pinning it rather than against:
              # the whole MPSL arbitration this application exists to
              # demonstrate assumes the SDC is what is beside radiant on the
              # radio, and a move to the open-source LL would break it with a
              # green build and no message anywhere.
              CONFIG_BT_LL_SOFTDEVICE=y
              # The arbitration policy is a Kconfig `choice`, so SOME arm is
              # always set. This asserts it is the one every bench and CI
              # result is taken against. TREADMILL_CTRL_POLICY_NONE restores
              # last-writer-wins between an FE-C controller and an FTMS
              # client, which is a legitimate integrator choice and not one to
              # ship from this tree by accident.
              CONFIG_TREADMILL_CTRL_POLICY_EXCLUSIVE=y
              # CONFIG_RADIANT_BACKEND_NULL is not set
              # The same 1 s connection policy the hrm_ble job asserts, for
              # the same reason: both applications redeclare these defaults
              # in their own Kconfig, and a redeclared default that lands
              # after the symbol's definition is silently dead. Keeping the
              # two rows' expectations identical is what makes the two
              # le_param_req() implementations' textual parallelism checkable
              # rather than aspirational.
              CONFIG_BT_PERIPHERAL_PREF_MIN_INT=800
              CONFIG_BT_PERIPHERAL_PREF_MAX_INT=800
              CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
              CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
              CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
          # THE HEAVIEST CONFIGURATION THIS APPLICATION HAS: two ANT+ masters,
          # one ANT+ slave and BLE with SMP and a bonding store. The row that
          # decides whether the RAM budget holds - which the Matter flash spike
          # already established matters more than flash on this part.
          - name: "treadmill: FTMS + RSC + ANT+ HR slave"
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: "ble.conf;hr_rx.conf"
            assert_symbols: |
              CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
              CONFIG_TREADMILL_BLE=y
              CONFIG_TREADMILL_HR_RX=y
              CONFIG_TREADMILL_ANT_SDM=y
          # THE ARM WITH NO SOURCE IN IT. CONFIG_TREADMILL_SOURCE_CUSTOM
          # compiles no implementation of the seam, deliberately - there is no
          # fallback to the simulator. The image must still LINK, because an
          # integrator's first build failing for a reason unrelated to their
          # driver is an expensive way to start.
          - name: "treadmill: custom source (nothing registered)"
            board: nrf54l15dk/nrf54l15/cpuapp
            image_conf: source_custom.conf
            assert_symbols: |
              CONFIG_TREADMILL_SOURCE_CUSTOM=y
              # CONFIG_TREADMILL_SOURCE_SIMULATED is not set

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-treadmill-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            ccache-treadmill-${{ strategy.job-index }}-

      - name: Build
        env:
          BOARD: ${{ matrix.board }}
          IMAGE_CONF: ${{ matrix.image_conf }}
        run: |
          set -euxo pipefail
          extra=("-DRADIANT_BACKEND=nrf")
          # IMAGE-SCOPED, and the prefix is the basename of the application
          # directory because that is how sysbuild names an image. A wrong
          # prefix names an image that does not exist and is accepted in
          # silence: CMake says nothing beyond its end-of-run
          # "manually-specified variables were not used" warning, and the BLE
          # image builds green with no BLE in it. apps/hrm_ble shipped exactly
          # that and measured it - two builds, with the flag and without,
          # produced byte-identical .config files.
          if [[ -n "${IMAGE_CONF}" ]]; then
            extra+=("-Dtreadmill_EXTRA_CONF_FILE=${IMAGE_CONF}")
          fi
          west build app/apps/treadmill \
            -b "${BOARD}" \
            -d build \
            -p always \
            -- "${extra[@]}"

      # THE STEP THAT EARNS THE JOB. A build-only check passes the silent-no-op
      # above without noticing; asserting the resulting .config is the only
      # thing that would not have.
      #
      # THE THREE ASSERTION FORMS ARE NOT INTERCHANGEABLE:
      #   CONFIG_X=y                 the symbol is on
      #   "# CONFIG_X is not set"    dependencies met, symbol off. WRITTEN WITH
      #                              THE LEADING '# ' because that is the
      #                              literal line Kconfig emits, and the matcher
      #                              below is `grep -qxF` - a whole-line,
      #                              fixed-string compare that will not match a
      #                              bare "CONFIG_X is not set" against it.
      #   absent:CONFIG_X            Kconfig omitted the symbol entirely because
      #                              a `depends on` was unmet
      # Using the second where the third is correct passes on a tree where the
      # symbol has been renamed out of existence.
      - name: Verify the configuration that was asked for took effect
        uses: ./app/.github/actions/assert-kconfig
        with:
          path-filter: "*treadmill*"
          expect: ${{ matrix.assert_symbols }}

  # The governing constraint of the security feature, as a job rather than as a
  # claim in a comment.
  #
  # "A build with the switches off is byte-identical on air to one built
  # without the code" is too weak to be worth stating alone: it needs two
  # boards to observe, it says nothing about flash, and it passes a build
  # carrying 4 KB of dead security code. So this builds THE SAME BOARD TWICE IN
  # ONE RUN - at HEAD and at the merge base - and compares them. Nothing here
  # depends on build reproducibility: section sizes and symbol names are stable
  # under a rebuild in a way that a binary hash is not.
  #
  # Five assertions on the disabled build, and the fourth is the one people
  # forget. Without it the job goes green on a build where the symbol does not
  # exist at all, which is precisely the state of the tree on the day somebody
  # renames it. The fifth is the same check for the compat layer, phrased
  # differently because that symbol lives inside `if RADIANT_SEC` and therefore
  # is absent rather than commented out when the parent is off.
  #
  # The on-air half of the claim is NOT here. It is a ztest assertion against
  # the recorded fake_radio TX bodies and RX filter addresses in
  # radiant/tests/api, because a shell script cannot see the air and CI
  # has no radio.
  # THIS JOB DELIBERATELY DOES NOT BUILD THE SHIPPING IMAGE, and that is worth
  # stating now that the two have parted company. It builds a plain
  # `-DANT_RADIO=core` Feather with no rgb.conf and no overlay, while the
  # Feather image build-core ships carries both. That is not an oversight - a
  # comparison of two builds that both have the feature ON measures nothing
  # about what the feature costs when OFF.
  #
  # The invariant it protects is still live: apps/dongle_thread has no RGB
  # (Kconfig.rgb_led is not sourced there at all), so what a disabled build must
  # not gain is the render thread, the ws2812 driver and the SPI subsystem.
  #
  # THE HOOK IS NO LONGER PART OF WHAT THIS MEASURES, and that is deliberate
  # rather than a gap. It moved to ant_activity.h and
  # CONFIG_ANT_DONGLE_ACTIVITY_COUNT, which the mono led0 heartbeat's activity
  # mode turns on in every default image - so it is present in BOTH trees this
  # job compares and cancels out. Its ((void)0) else-branch is intact and is
  # what a _ACTIVITY=n build gets; nothing here proves that any more.
  zero-cost:
    name: zero cost when disabled
    runs-on: ubuntu-24.04
    # Five full images of apps/dongle in one job - HEAD, the merge base and
    # three enabled variants - so it earns a larger ceiling than the matrices.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
          # The merge base is unreachable from a shallow clone, and a job that
          # silently degrades to "compare HEAD with HEAD" would pass forever.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace and toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-zerocost-${{ github.sha }}
          restore-keys: |
            ccache-zerocost-

      # A worktree rather than a checkout in place, so the two trees exist at
      # once and a failure leaves both of them there to look at.
      - name: Materialise the merge base
        run: |
          set -euxo pipefail
          cd app
          git fetch --no-tags origin master
          base="$(git merge-base HEAD origin/master)"
          echo "merge base: ${base}"
          if [[ "${base}" == "$(git rev-parse HEAD)" ]]; then
            echo "HEAD is the merge base - the comparison is trivially true."
            echo "That is the expected state on a push to master."
          fi
          git worktree add ../base "${base}"

      - name: Build both trees with the feature disabled
        run: |
          set -euxo pipefail
          for tree in app base; do
            west build "${tree}/apps/dongle" \
              -b adafruit_feather_nrf52840/nrf52840/uf2 \
              -d "build-${tree}" \
              -p always \
              -- "-DANT_RADIO=core"
          done

      # The SDK's binutils, resolved once for both measuring steps below.
      #
      # THIS STEP EXISTS BECAUSE THE INLINE VERSION DIED ON LINE 1. It read
      # `${ZEPHYR_SDK_INSTALL_DIR}` under `set -u` with nothing exporting it,
      # and aborted with `unbound variable` before any of the five assertions
      # ran. The action uses `:-` and three fallbacks; see its header.
      - name: Resolve arm-zephyr-eabi binutils
        id: binutils
        uses: ./app/.github/actions/arm-binutils

      - name: The five assertions
        env:
          SIZE: ${{ steps.binutils.outputs.size }}
          NM: ${{ steps.binutils.outputs.nm }}
        run: |
          set -euo pipefail

          # Local names, so the body below is unchanged from when it resolved
          # these itself. There is deliberately no host-binutils fallback: host
          # `size` would read the ARM ELF and report plausible numbers for the
          # wrong thing.
          size="${SIZE}"
          nm="${NM}"

          head_elf="$(find build-app -name zephyr.elf -print -quit)"
          base_elf="$(find build-base -name zephyr.elf -print -quit)"
          head_cfg="$(find build-app -name .config -path '*/dongle/*' -print -quit)"

          # 1. Section sizes, section by section.
          #
          # ALLOCATED SECTIONS ONLY, and that is not a loosening. .debug_line
          # and .debug_str carry file names and line numbers, so they differ
          # the moment a source file is ADDED - even a file this build does not
          # compile. Comparing them would make the job fail on every commit
          # that touches the tree, which is a job that gets disabled rather
          # than a job that catches anything. Allocated sections are what ends
          # up on the chip, which is what "costs nothing" means.
          #
          # The filter is "has a non-zero load address": .debug_*, .comment and
          # .ARM.attributes all sit at 0, and Zephyr's own sections (text,
          # rodata, bss, noinit, ...) do not. Note the names have NO leading
          # dot - Zephyr renames them, and an awk matching ".text" silently
          # matches nothing and compares two empty files.
          section_sizes() {
            "${size}" -A "$1" |
              awk 'NF == 3 && $3 ~ /^[0-9]+$/ && $3 != "0" && $1 != "Total" { print $1, $2 }' |
              sort
          }
          section_sizes "${head_elf}" > head.size
          section_sizes "${base_elf}" > base.size
          test -s head.size   # an empty comparison is a passing comparison
          if ! diff -u base.size head.size; then
            echo "::error::a disabled build changed section sizes"
            exit 1
          fi

          # 2. The defined-symbol set. Sizes alone would pass a change that
          #    added code and removed exactly as much.
          "${nm}" --defined-only "${head_elf}" | awk '{print $NF}' | sort -u > head.syms
          "${nm}" --defined-only "${base_elf}" | awk '{print $NF}' | sort -u > base.syms
          if ! diff -u base.syms head.syms; then
            echo "::error::a disabled build changed the defined-symbol set"
            exit 1
          fi

          # 3. No security symbol survives at all.
          count="$("${nm}" "${head_elf}" | grep -c radiant_sec || true)"
          echo "radiant_sec symbols in the disabled build: ${count}"
          test "${count}" -eq 0

          # 4. The check people forget. Without it this job is green on a
          #    build where the symbol does not exist, which is the tree's
          #    state the day somebody renames it.
          grep -qx '# CONFIG_RADIANT_SEC is not set' "${head_cfg}"

          # 5. And the compat layer is not in the disabled build either.
          #    Phrased as "not =y" rather than as "is not set": the symbol
          #    lives inside `if RADIANT_SEC`, so with RADIANT_SEC off it is
          #    invisible and Kconfig omits the line entirely rather than
          #    writing the commented form. Assertion 3 above already covers
          #    its symbols - radiant_sec_compat_* matches `radiant_sec` - and
          #    the positive check that the name still exists is in the
          #    enabled build below, where the symbol is visible.
          if grep -q '^CONFIG_RADIANT_SEC_COMPAT=y' "${head_cfg}"; then
            echo "::error::the compat layer reached the disabled build"
            exit 1
          fi

      # The seam, as a grep. radiant_sec.h says policy calls modes and modes
      # call blocks, so that a mode-level accelerator - CRACEN on nRF54L is
      # reachable no other way - can be attached without touching policy. The
      # unit tests prove the mode-level path works; only this proves policy
      # never reaches past it.
      - name: Policy never calls the block primitive
        run: |
          set -euo pipefail

          # EVERY policy file, not just the first one. This checked only
          # radiant_sec.c when that was the whole policy layer; there are now
          # three, and a seam guarded on one file out of three is guarded on
          # none. radiant_sec_pair.c is the one that would be tempted - it
          # derives a key and could reach for a block directly - so it is
          # exactly the file the original grep would have missed.
          #
          # src/ext/ is deliberately NOT in this list: it holds the standard
          # algorithm implementations, which are below the seam rather than
          # above it.
          found=0
          for f in app/radiant/src/radiant_sec.c \
                   app/radiant/src/radiant_sec_pair.c \
                   app/apps/common/ant_sec_host.c; do
            [[ -f "${f}" ]] || continue
            found=1
            # Match a CALL, not the word: these files discuss the rule in
            # their own comments, and a grep that tripped on the sentence
            # explaining the rule would be worse than no grep - it would be
            # fixed by deleting the explanation.
            if grep -nE 'radiant_sec_aes_ecb[[:space:]]*\(' "${f}" |
                 grep -vE '^\s*[0-9]+:\s*\*'; then
              echo "::error::${f} calls Level 1 directly; the seam is"
              echo "::error::decorative if policy can reach past the mode level"
              exit 1
            fi
          done
          if [[ "${found}" == "0" ]]; then
            echo "no policy files exist yet - nothing to check"
          fi

      # The other design property that is only true until somebody adds one
      # convenient special case. docs/decisions/0008 and the plan's
      # architecture section both say it in the same words:
      # radiant_sec_compat.c CONTAINS NO PAGE NUMBER AND NO FIELD NAME. It
      # authenticates bytes. That is what makes it testable against synthetic
      # payloads with no profile in the loop, and usable unchanged by a profile
      # nobody has written yet.
      #
      # The grep is the .c only, not the header. The header's comments explain
      # why the rule exists and therefore name the things the rule excludes,
      # and a grep fixed by deleting the explanation is worse than no grep -
      # the same reasoning as the seam check above.
      - name: The compat attestation names no page and no field
        run: |
          set -euo pipefail
          f=app/radiant/src/radiant_sec_compat.c
          if [[ ! -f "${f}" ]]; then
            echo "radiant_sec_compat.c does not exist yet - nothing to check"
            exit 0
          fi
          if grep -inE 'heart|cadence|torque|watt|\brpm\b|\bbpm\b|power|speed|calorie' "${f}"; then
            echo "::error::${f} names a profile field. It authenticates bytes;"
            echo "::error::what those bytes MEAN is radiant/src/profiles/'s business,"
            echo "::error::and a tag module with an opinion about one profile"
            echo "::error::is a tag module the next profile works around"
            exit 1
          fi
          if grep -nE '^[[:space:]]*#include.*(profiles?/|ant_pages)' "${f}"; then
            echo "::error::${f} includes a profile header"
            exit 1
          fi

      # The other end of the budget. A budget that is asserted stays a budget;
      # one that is written down in a design document becomes a historical note
      # about what somebody once hoped.
      #
      # ── THE CEILINGS ARE MEASURED, AND THEY USED TO BE GUESSED ─────────────
      #
      # This step asserted `.text` growth under 4096 B from the day the Kconfig
      # symbol existed - deliberately, so the number would be watched as it
      # grew rather than discovered once at the end. It was watched, it grew,
      # and at the end of the feature it did not fit: X_AUTH, X_CONF and the
      # host surface together cost 5084 B of text on this board, which is 988 B
      # over.
      #
      # Raising a ceiling because you hit it is normally the exact failure this
      # job exists to prevent, so the reasoning is recorded rather than the
      # number quietly edited. 4096 was explicitly a STARTING figure with no
      # measurement behind it. The 5084 B it turned out to cost is, symbol by
      # symbol:
      #
      #     760  radiant_sec_pump          the RX policy engine
      #     344  encrypt_block             AES-128, one direction
      #     308  radiant_sec_tx_transform
      #     290  rx_close_window
      #     256  sbox                      the AES table, rodata
      #     228  radiant_sec_cmac_final
      #     206  antr_sec_status_get
      #     ~400 the four antr_sec_* entry points together
      #     ~2300 everything else, none of it over 200 B
      #
      # There is no fat in that list: it is a block cipher, two modes, a KDF,
      # a windowing state machine and a serial surface. The honest conclusion is
      # that the guess was low, not that the code is bloated - so the ceiling
      # moves to a measured figure with about 20% headroom, and the breakdown
      # above is what the next person compares against when it moves again.
      #
      # RAM IS ASSERTED TOO, WHICH IT NEVER WAS. "Costs nothing when disabled"
      # was only ever checked in flash, and the feature turns out to cost more
      # bss than text - 5277 B, of which 1536 is the ISR-to-pump queue
      # (RADIANT_SEC_MAX_CHANNELS x W_MAX entries). On a part with 256 KB that
      # is affordable and it is not nothing, and a budget nobody checks is how
      # it stops being affordable.
      - name: Enabled build stays inside its measured budget
        env:
          SIZE: ${{ steps.binutils.outputs.size }}
        run: |
          set -euo pipefail
          west build app/apps/dongle \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-enabled \
            -p always \
            -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf"
          west build app/apps/dongle \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-pairing \
            -p always \
            -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf" \
               "-DCONFIG_RADIANT_SEC_PAIRING_X25519=y"
          west build app/apps/dongle \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-compat \
            -p always \
            -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf" \
               "-DCONFIG_RADIANT_SEC_COMPAT=y"

          # Resolved by the arm-binutils step above, not here. See its header
          # for why a bare ${ZEPHYR_SDK_INSTALL_DIR} under `set -u` is a
          # failure and not a fallback.
          size="${SIZE}"

          # Zephyr's sections are named `text` and `bss`, WITHOUT a leading
          # dot. An awk matching ".text" finds nothing, sets the delta to an
          # empty string, and `test "" -le 6144` errors rather than passing -
          # but only because of the -o pipefail above, which is a thin thread
          # to hang a budget on. Hence the explicit emptiness checks.
          sect_of() {
            "${size}" -A "$2" | awk -v s="$1" '$1 == s { print $2 }'
          }
          off_elf="$(find build-app -name zephyr.elf -print -quit)"
          on_elf="$(find build-enabled -name zephyr.elf -print -quit)"
          pair_elf="$(find build-pairing -name zephyr.elf -print -quit)"
          compat_elf="$(find build-compat -name zephyr.elf -print -quit)"
          compat_cfg="$(find build-compat -name .config -path '*/dongle/*' -print -quit)"

          fail=0
          check() {   # name measured ceiling
            echo "$1: ${2} B (ceiling ${3})"
            if [[ -z "$2" ]]; then
              echo "::error::$1 could not be measured"
              fail=1
            elif (( $2 > $3 )); then
              echo "::error::$1 is ${2} B, over its ${3} B ceiling"
              fail=1
            fi
          }

          off_text="$(sect_of text "${off_elf}")"
          on_text="$(sect_of text "${on_elf}")"
          pair_text="$(sect_of text "${pair_elf}")"
          off_bss="$(sect_of bss "${off_elf}")"
          on_bss="$(sect_of bss "${on_elf}")"
          test -n "${off_text}" && test -n "${on_text}"
          test -n "${off_bss}" && test -n "${on_bss}"

          # X_AUTH + X_CONF + the 0xF1-0xF4 host surface. Measured 5084 / 5277.
          check "security text" "$(( on_text - off_text ))" 6144
          check "security bss"  "$(( on_bss  - off_bss  ))" 6144

          # X25519 and the pairing logic, on top of the above and under their
          # own Kconfig symbol - so they get their own budget rather than
          # hiding inside a bigger one. Measured 2812 B of text, which is a
          # field arithmetic implementation and a Montgomery ladder.
          check "pairing text" "$(( pair_text - on_text ))" 3584

          # ── The compat attestation layer ─────────────────────────────────
          #
          # Its own symbol and its own budget, from the day the symbol first
          # existed rather than from the day the feature is finished - which is
          # the correction the 4096-to-6144 story above bought. C4 to C8 build
          # under this gate instead of meeting it at the end.
          #
          # TWO NUMBERS, BECAUSE ONE OF THEM IS ZERO TODAY AND WILL LIE. Still
          # nothing in the application calls this layer - src/profiles/ wires it
          # up at C5 - so the linker never pulls the archive member in and the
          # LINKED delta is measured at exactly 0 B. A ceiling on that alone
          # would be a gate that cannot fail until somebody writes a caller, so
          # the compiled object is measured too, and that is the number that
          # bites now.
          #
          # ── C2 -> C4, and why the object ceiling moved ────────────────────
          #
          # At C2 the file was three pure functions and 228 B, with a 288 B
          # ceiling. C4 added the emit hooks, the receive path, the verdicts and
          # the bounded epoch recovery, and it is 2930 B on this board:
          #
          #     radiant_sec_compat_rx               576   both tiers' verify
          #     radiant_sec_compat_tx_attest        238   when a page is due
          #     recover                             222   the three bounded phases
          #     radiant_sec_compat_set_key          176
          #     probe_at                            160   one candidate epoch
          #     radiant_sec_compat_set_epoch        138
          #     radiant_sec_compat_tier2_tag        128
          #     radiant_sec_compat_recover_tier2    102
          #     radiant_sec_compat_stream_verdict    96   receiver-side pinning
          #     radiant_sec_compat_tx_sent           92
          #     radiant_sec_compat_configure         88
          #     ~730 everything else, none of it over 72 B
          #     ------------------------------------------
          #     total .text in the object          2930   (measured, Cortex-M4)
          #
          # 3584 B is that measurement plus about a fifth, in the shape the
          # security text ceiling moved in: a measurement and a breakdown, or
          # the number does not move. There is no fat in the list - it is two
          # emit hooks, two verify paths, a windowing buffer and a search with
          # three ceilings - and the honest reading is that C2's 288 B was a
          # ceiling on a third of a feature.
          #
          # RAM APPEARS HERE FOR THE FIRST TIME, because until C4 this file had
          # none: 1344 B of bss, which is CONFIG_RADIANT_SEC_COMPAT_MAX_CHANNELS
          # (2) contexts of 672 B, and the bulk of each is the two 248-byte
          # window buffers a Tier II tag at N = 32 has to cover. It is inside
          # the disabled build's assertions above - the symbol does not exist
          # there at all - so it needs no ceiling of its own until something
          # links it.
          compat_text="$(sect_of text "${compat_elf}")"
          test -n "${compat_text}"
          check "compat text (linked)" "$(( compat_text - on_text ))" 288

          compat_obj="$(find build-compat \
                          \( -name 'radiant_sec_compat.c.obj' \
                             -o -name 'radiant_sec_compat.c.o' \) \
                          -print -quit)"
          if [[ -z "${compat_obj}" ]]; then
            echo "::error::CONFIG_RADIANT_SEC_COMPAT=y built no object"
            fail=1
          else
            obj_text="$("${size}" -A "${compat_obj}" |
                          awk '$1 ~ /^\.text/ { total += $2 } END { print total+0 }')"
            check "compat object text" "${obj_text}" 3584
          fi

          # The check people forget, in the direction that catches a rename:
          # every assertion above is satisfied by a symbol that no longer
          # exists, because a build that ignored the -D would pass all of them.
          if ! grep -qx 'CONFIG_RADIANT_SEC_COMPAT=y' "${compat_cfg}"; then
            echo "::error::CONFIG_RADIANT_SEC_COMPAT did not take effect;"
            echo "::error::every size check above is vacuous on this build"
            fail=1
          fi

          exit "${fail}"

      # CONFIG_RADIANT_SEC depends on CONFIG_RADIANT, so it can never reach a
      # build with no radiant in it - the stub here, and equally the sdk_ant
      # backend, which this lane no longer builds. Asserted rather than
      # assumed, in the job that already has both trees to hand.
      - name: The stub build carries none of it
        run: |
          set -euo pipefail
          west build app/apps/dongle \
            -b adafruit_feather_nrf52840/nrf52840/uf2 \
            -d build-stub \
            -p always \
            -- "-DANT_RADIO=stub" "-DEXTRA_CONF_FILE=security.conf"
          cfg="$(find build-stub -name .config -path '*/dongle/*' -print -quit)"
          if grep -qx 'CONFIG_RADIANT_SEC=y' "${cfg}"; then
            echo "::error::security reached a build with no radiant in it"
            exit 1
          fi

