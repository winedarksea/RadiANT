#
# GENERATED: the west manifest release.yml's build-core job builds from, with
# every project pinned by commit SHA (security review 2026-11-22). Do not
# hand-edit; regenerate it.
#
# Why it exists: west.yml pins sdk-nrf by commit, but sdk-nrf v3.4.0's own
# west.yml (imported with `import: true`) names zephyr, mcuboot, nrfxlib,
# mbedtls, matter, nrf-802154 and others by TAG, and Zephyr's imported
# manifest is read at whatever ncs-v3.4.0 points to. A tag can be moved, so
# pinning the top project alone would still let the shipping build follow a
# moved tag. This file is the same workspace with every import resolved and
# every revision replaced by the SHA it resolved to.
#
# It holds active projects only (--active-only). West cannot freeze a project
# that is not cloned, and sdk-ant (group `ant`, private) never is. The release
# lane does not use sdk-ant, so it is simply absent here, and so are the other
# projects NCS's group-filter disables. `self: path: app` is where every job in
# release.yml checks this repository out.
#
# Regenerate whenever west.yml's nrf or hal_ti revision moves; the
# tools/test_ci_actions.py lint fails while the two disagree. In a clean
# directory with the repository checked out at app/ and the locked west from
# .github/release-build-requirements.txt:
#   west init -l app            # west.yml, not this file
#   west update -o=--depth=1 -n
#   west manifest --freeze --active-only -o app/.github/west-release-frozen.yml
# then put this header back on top.
#
# Generated 2026-11-23 on Linux (ubuntu:24.04 container, west 1.5.0) from
# west.yml with nrf at 99553055607b2e9885fbc80ccd11fa9da81c2df0 (tag v3.4.0).
# Cross-checked against a local NCS v3.4.0 install made by the nRF Connect
# toolchain manager: 54 of the 55 projects are at the same commit there, and
# the 55th (zcbor) is not in that install.

