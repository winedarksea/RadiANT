# Stage-1 bring-up overlay: USB device + ANT serial bridge, no radio.
#
#   west build ... -- -DEXTRA_CONF_FILE=stub.conf
#
# Turning CONFIG_ANT off keeps sdk-ant's CMakeLists from compiling init/ or
# linking libant.a, so src/ant_stub.c can supply those symbols instead. The
# CONFIG_ANT_* values in prj.conf go inert in this configuration; that is
# expected and they are restored by simply dropping this overlay.
CONFIG_ANT=n
CONFIG_ANT_DONGLE_RADIO_STUB=y

# Bring-up is about proving USB enumerates at all, which is easier when the
# device binds a driver on its own. The release build deliberately does not -
# see the Kconfig help - but here it saves needing an ANT driver installed.
CONFIG_ANT_DONGLE_MSOS_DESCRIPTORS=y
CONFIG_USB_DEVICE_BOS=y
