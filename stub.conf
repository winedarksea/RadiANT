# Stage-1 bring-up overlay: USB device + ANT serial bridge, no radio.
#
#   west build ... -- "-DANT_RADIO=stub" "-DEXTRA_CONF_FILE=stub.conf"
#
# Note the -DANT_RADIO=stub: this file no longer selects the backend, and on
# its own it no longer gives you a stub build. It used to set CONFIG_ANT=n and
# CONFIG_ANT_DONGLE_RADIO_STUB=y, which was the whole mechanism. Both are gone,
# for the same underlying reason: the backend has to be chosen before Kconfig
# exists, because appending sdk-ant to ZEPHYR_EXTRA_MODULES happens before
# find_package(Zephyr). So CMake chooses, and with -DANT_RADIO=stub the module
# is never added at all - CONFIG_ANT is then not merely off, it is undefined,
# and assigning to an undefined symbol is fatal. CMake writes
# CONFIG_ANT_DONGLE_RADIO_STUB=y itself, so stating it here as well could only
# ever disagree with what was actually compiled.
#
# What is left here is the part Kconfig really does own: the USB identity
# choices that make bring-up easier.

# Bring-up is about proving USB enumerates at all, which is easier when the
# device binds a driver on its own. The release build deliberately does not -
# see the Kconfig help - but here it saves needing an ANT driver installed.
CONFIG_ANT_DONGLE_MSOS_DESCRIPTORS=y
CONFIG_USB_DEVICE_BOS=y
