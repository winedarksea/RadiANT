# SPDX-License-Identifier: Apache-2.0
#
# The MPSL gate unit. One application, one suite, one invariant: exactly one
# radiant_nrf_gate_on_grant_end() per granted timeslot, on every exit.
#
# It contains no hardware access at all - MPSL, MPSL_TIMER0 and the backend are
# all fakes - so native_sim is the right platform for it, on the same 32-bit
# reasoning the parent application's file gives: the target shares pointer and
# long widths with it, and the gate does 64-bit time arithmetic that a 64-bit
# host would quietly widen.
#
# On Windows there is no native_sim (no host C compiler), which is what
# scripts\run_ztest_hw.ps1 exists for:
#
#   .\scripts\run_ztest_hw.ps1 -App radiant_core\tests\gate -NcsVersion v3.4.0
#
# The timeout is twister's default: the whole suite is work-queue latency and
# nothing else.
tests:
  radiant_core.gate:
    tags:
      - radiant_core
      - mpsl
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
