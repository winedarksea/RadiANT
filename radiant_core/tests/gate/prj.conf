#
# Configuration for the MPSL gate unit-test application.
#
# Deliberately minimal, and in particular there is NO CONFIG_MPSL here. The
# whole point of this application is that the gate is compiled against
# radiant_core/tests/gate/fakes/mpsl_timeslot.h and driven signal by signal from
# a test; a real MPSL in the image would bring a real arbiter, a real timeslot
# session and a real TIMER, and the signal sequences this suite exists to inject
# would be whatever the arbiter felt like producing.

CONFIG_ZTEST=y

# The module, consumed as a module. BACKEND_NONE because ../fake_radio.c is the
# HAL implementation for this image - the gate is a seam inside the NRF backend,
# and building that backend here would be a second definition of all eight HAL
# entry points. No CONFIG_RADIANT_CORE_ANTR_API line, for the same reason
# ../prj.conf gives: that symbol is application-side now (src/Kconfig.antr_api)
# and this application's Kconfig tree never sources it, so src/ant_radio_radiant.c
# is unreachable from here regardless.
CONFIG_RADIANT_CORE=y
CONFIG_RADIANT_CORE_BACKEND_NONE=y

# The gate registers a log module and logs its session_open rc, which is the one
# diagnostic that names the CONFIG_MPSL_TIMESLOT_SESSION_COUNT=0 trap. Kept at
# WRN so the run's own output is ztest's and not the gate's.
CONFIG_LOG=y
CONFIG_RADIANT_CORE_LOG_LEVEL_WRN=y

# CONFIG_RADIANT_CORE_SWEEP_DEBUG is NOT set, so gate_dump_fn() is not compiled.
# It is a 1 Hz LOG_INF on its own work item; in a run whose output is parsed for
# ztest's own lines it is noise, and it is the soak's instrument rather than
# this suite's.

# The suite drives the gate from the ztest thread and the gate defers every MPSL
# call and every call into the core to a work queue, so both threads are real.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
