#
# Configuration for the radiant_core unit-test application.
#
# radiant_core is pure logic sitting on top of radiant_radio_hal.h, and the
# tests drive it against radiant_core/tests/fake_radio.c rather than a radio.
# So there is deliberately nothing here about clocks, USB or the ANT stack:
# anything that needs hardware belongs on the bench, not in this application.
#
# Keep this file minimal. Zephyr aborts the build on an assignment to an
# undefined Kconfig symbol, so every line added here is a way for one agent's
# convenience setting to break every other agent's tests.

CONFIG_ZTEST=y

# The module under test, consumed as a module. BACKEND_NONE because
# fake_radio.c in this directory is the HAL implementation for this image, and
# a second one would be a duplicate-symbol link error. ANTR_API=n because the
# suites test the modules, not the forwarding onto src/ant_radio.h.
CONFIG_RADIANT_CORE=y
CONFIG_RADIANT_CORE_BACKEND_NONE=y
CONFIG_RADIANT_CORE_ANTR_API=n

# The crypto primitives. On here and off in every product build: the feature's
# governing constraint is that it costs nothing to the overwhelming majority
# who never enable it, so src/radiant_sec_aes.c is Kconfig-gated rather than
# compiled unconditionally the way radiant_crc_repair.c is. This is the door a
# real application uses, and the suite goes through it rather than around it.
#
# HOST_MESSAGES stays off because ANTR_API is off above - the host adapter is
# the one security file that reaches an application header.
CONFIG_RADIANT_SEC=y
CONFIG_RADIANT_SEC_HOST_MESSAGES=n

# The compat attestation primitives, for the same reason and through the same
# door. Nothing in radiant_core calls them yet - src/test_sec_compat.c is their
# only caller anywhere - so without this line the suite would link against the
# header's disabled inlines and assert ENOTSUP at every call site while
# reporting a pass.
CONFIG_RADIANT_SEC_COMPAT=y

# X25519 and the pairing state machine (compat-C7).
#
# It WAS a twister-only scenario (testcase.yaml's radiant_core.unit.pairing),
# and that meant every pairing assertion in this repository - test_sec_pair.c,
# test_sec_x25519.c, node_ident.c's window and now the whole of Layer D -
# compiled to nothing in the run the hardware gate actually performs
# (scripts/run_ztest_hw.ps1 builds this prj.conf and nothing else). A suite that
# is empty on the gate that must pass is a suite that reports a pass for having
# said nothing, which is the exact failure mode ANTR_API=n's comment above
# exists to prevent.
#
# The cost is the software ladder, and it is bounded: test_sec_x25519.c pins one
# X25519 at under 250 ms and the whole of pairing across this application is
# tens of ladders, against the gate's 240-second ceiling.
CONFIG_RADIANT_SEC_PAIRING_X25519=y

# The suites build tables of frames and channel state on the stack, and on
# native_sim an overrun surfaces as a wrong answer rather than as a fault -
# which is the worst possible failure mode for a test harness.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
