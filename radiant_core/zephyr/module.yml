#
# radiant_core is a Zephyr module living inside this repository rather than a
# separate one. Splitting it out later is `git filter-repo` plus a west.yml
# project entry; nothing in this file or the two it names would change.
name: radiant_core
build:
  cmake: .
  kconfig: Kconfig
# Self-describes its test root so `west twister` (any version that supports
# the command) and other module-scanning tools find radiant_core/tests
# without being told the path. CI still passes an explicit -T
# (see .github/workflows/build.yml) because it invokes scripts/twister
# directly for SDK-version compatibility rather than via `west twister`,
# so this list is for external consumers, not a change to CI's behavior.
tests:
  - tests
