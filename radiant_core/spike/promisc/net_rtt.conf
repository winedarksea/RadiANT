#
# Provenance: clean-room. Zephyr Kconfig only.
#
# The fallback console for the nRF5340 network-core build, and the reason it
# exists is worth stating because it is the thing Spike B part 1 missed.
#
# The network core's uart0 is P1.00/P1.01, and on this part every GPIO belongs
# to the application core until the application core hands it over. So the UART
# console depends on a *second image on a second core* being right. RTT does
# not: the buffer lives in network-core RAM and the debugger reads it over SWD,
# which needs no pin from anybody. If the network-core VCOM is silent, this
# overlay separates "the capture program is not running" from "the pins were
# never granted", and those two have completely different fixes.
#
#   west ... -b nrf5340dk/nrf5340/cpunet -- -DEXTRA_CONF_FILE=net_rtt.conf
#   JLinkRTTLogger -Device nRF5340_xxAA_NET -If SWD -Speed 4000 \
#                  -SelectEmuBySN 1050006310 0 <outfile>
#
# It is the fallback and not the default for one reason: a VCOM capture is a
# plain text file produced by a plain COM port, and a result that can only be
# read through vendor tooling is harder to archive and harder to reproduce.
#
# The up-buffer is oversized deliberately. RTT drops silently when the buffer
# fills and the host has not drained it, and a silently dropped frame in the
# middle of a burst sequence reads as an encoding that skips a value - which is
# precisely the finding this spike is trying to make. 4 KB is about 30 output
# lines, which covers a whole burst arriving back to back. It is still not a
# guarantee, which is why src/main.c carries its own dr= counter regardless of
# which console is in use: that counter is the proof, and the buffer size is
# only an attempt to keep it at zero.

CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Blocking, not trimming. If the host cannot keep up, stall the capture program
# rather than throw away the middle of a burst: a stalled program shows up as a
# gap in n= that the analyser flags, whereas a trimmed buffer shows up as a
# plausible-looking capture that is missing a sequence number.
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y
