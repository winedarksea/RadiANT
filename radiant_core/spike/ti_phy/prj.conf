# SPDX-License-Identifier: Apache-2.0
#
# Provenance: clean-room. Zephyr Kconfig only; nothing here derives from
# sdk-ant.
#
# This spike owns the RF core outright, exactly as Spike A owns the nRF RADIO,
# and for the same reason: the whole question is whether the bare peripheral
# can be made to hear an ANT frame, so anything else that would want the radio
# has to be absent. On this part that means the IEEE 802.15.4 driver, which the
# board devicetree already disables (&radio and &ieee802154 are both
# status = "disabled" in cc26x2r1_launchxl.dts) - stated here as well so the
# answer does not depend on a board file somebody may fix.
#
# The console is the entire output of this program. It goes out uart0, which on
# this board is the XDS110 backchannel - one COM port over the same cable that
# programs it, with no adapter. NOTE THAT THIS IS THE OPPOSITE ARRANGEMENT TO
# THE DONGLE IMAGE, which reserves uart0 for the ANT serial protocol and sends
# its log to uart1 on BoosterPack pins. The difference is not an inconsistency:
# a spike has no ANT serial protocol to carry, so the one reachable port should
# carry the thing the spike exists to produce.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# No logging subsystem. printk is synchronous, and the phases here print at
# human rates; deferred logging would add a way to lose the last lines of a
# phase to a wrapped buffer, which is the one output that matters when a phase
# fails.
CONFIG_LOG=n

# NOTHING TURNS THE RF DRIVER ON, and that is worth a line rather than a
# silence. hal_ti's own CMakeLists.txt compiles RFCC26X2_multiMode.c, the
# SimpleLink Power driver and the DPL shim whenever CONFIG_HAS_CC13X2_CC26X2_SDK
# is set, which the SoC's Kconfig sets as soon as the module is on the path. So
# there is no CONFIG_TI_RF to state and stating one would be an assignment to a
# symbol that does not exist - which Zephyr treats as fatal. What decides
# whether the driver is present is -DEXTRA_ZEPHYR_MODULES, in CMakeLists.txt.

# ── Why a spike about a radio turns POWEROFF OFF ────────────────────────────
#
# This started as CONFIG_POWEROFF=y and it was wrong, in a way that took a
# hardware run to see. Recorded in full because the reasoning that produced the
# =y is reasoning anyone would repeat.
#
# THE REASON FOR =y. It was never about powering anything off. The SimpleLink
# RF driver references PowerCC26X2_config, PowerCC26XX_schedulerDisable and
# PowerCC26XX_schedulerRestore and cannot link without them; all three live in
# soc/ti/simplelink/cc13x2_cc26x2/power.c, which that SoC's CMakeLists.txt
# compiles only under CONFIG_PM, CONFIG_PM_DEVICE or CONFIG_POWEROFF. POWEROFF
# was chosen over PM because PM additionally lets the idle thread put the part
# into STANDBY, which powers down the debug interface - a plausible way to lose
# both the RAT and the probe mid-measurement.
#
# WHY IT IS NOW =n. That file also sets
#
#     .calibrateFxn = NULL
#
# for any build that is not one of Zephyr's three in-tree radio drivers, and
# PowerCC26X2.c:1357 dereferences that pointer WITHOUT A NULL CHECK the first
# time anything requests XOSC_HF - which is the first RF_open(). The spike's
# first run on hardware faulted there, PC = 0x00000000. So dragging power.c in
# does not merely cost oscillator accuracy, as this file previously claimed and
# as README.md still needs correcting to say: it makes the radio unusable.
#
# With POWEROFF off, power.c is not compiled and src/ti_power_shim.c supplies
# those three symbols instead, with calibrateFxn pointing at
# PowerCC26XX_calibrate. Read that file's header before touching this line.
# STANDBY is not a risk either way, because CONFIG_PM stays off.
CONFIG_POWEROFF=n

# Nothing else may claim the RF core.
CONFIG_IEEE802154=n
CONFIG_NETWORKING=n
CONFIG_BT=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=n

# The RF driver posts commands and waits on them from a thread, and its
# callbacks run from a SWI. Neither is deep, but the default 1024 is tight for
# a callback that also formats a line of output.
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
