#
# Provenance: clean-room. Zephyr and nrfxlib Kconfig only; nothing here derives
# from sdk-ant.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# printk rather than the logging subsystem, on the same terms as every other
# spike here: this program prints a handful of result lines and deferred logging
# is only a way to lose the last of them when a buffer wraps.
CONFIG_LOG=n
CONFIG_SHELL=n

# No floating point. Every figure is printed as integer microseconds or as
# integer hundredths of a percent, which is also what keeps a result exactly
# reproducible from the counters it was derived from.
CONFIG_CBPRINTF_FP_SUPPORT=n

# ── MPSL, which is the thing under measurement ──────────────────────────────
#
# CONFIG_MPSL_TIMESLOT_SESSION_COUNT DEFAULTS TO 0 AND THAT IS A SILENT
# FAILURE. mpsl_init.c sizes and passes the session context array from this
# symbol, so with the default every mpsl_timeslot_session_open() returns an
# error and the program measures nothing while looking like it ran. There is no
# other call to make - mpsl_timeslot_session_count_set() does not need calling,
# because mpsl_init.c already does it from this number, with its own
# BUILD_ASSERT against MPSL_TIMESLOT_CONTEXT_COUNT_MAX (8).
CONFIG_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# An application-defined assertion sink. MPSL asserts on OVERSTAYED - closing a
# timeslot late is a crash, not a lost window - and on returning any action
# other than NONE from a low-priority signal. Both are failure modes this spike
# exists to find, so they must print something identifiable rather than land in
# a generic fault handler with no context.
CONFIG_MPSL_ASSERT_HANDLER=y

# The crystal, not the internal oscillator: every request here asks for
# XTAL_GUARANTEED, which is what a radio timeslot needs and what makes
# CONFIG_MPSL_HFCLK_LATENCY (the DT hfxo startup-time-us, 1650 us on nRF54L)
# part of the answer rather than a footnote.
CONFIG_CLOCK_CONTROL=y

# Nothing else claims the RADIO in the baseline build. ble.conf is what adds a
# second stack, and the two builds are compared against each other - which is
# the whole measurement, so they must differ in exactly this.
CONFIG_BT=n

CONFIG_MAIN_STACK_SIZE=4096
