#
# Provenance: clean-room. Zephyr Kconfig and radiant_core's own Kconfig only;
# nothing here derives from sdk-ant.
#
# This spike owns the RADIO outright, through radiant_core's nrf backend rather
# than by writing registers itself. Anything else that would claim the
# peripheral has to be absent, and src/main.c BUILD_ASSERTs it rather than
# trusting this file.
#
# THE CONSOLE IS BOTH THE INPUT AND THE OUTPUT of this program, and its
# transport differs per board - which is why only the generic half is here:
#
#   nRF54L15 DK   the board's default UART VCOM (uart20). Nothing needed.
#   Feather       USB CDC ACM, because the board has no debugger and no usable
#                 UART. The board target's own Kconfig.defconfig turns that on;
#                 boards/adafruit_feather_nrf52840_nrf52840_uf2.conf in this
#                 directory only keeps it on and links the image where the UF2
#                 bootloader expects it. See that file.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# No logging subsystem, on the same terms as spike/rx_raw and spike/x1m_len:
# printk is synchronous, this program prints a handful of lines, and deferred
# logging would only add a way to lose the last lines of a rung when the buffer
# wraps. radiant_core's own LOG_INF/LOG_ERR calls fold away with this off, which
# is wanted - the counters this spike prints are its result, and the backend
# narrating underneath them would bury them.
CONFIG_LOG=n

# No shell either. The command set is six words; Zephyr's shell would cost tens
# of kilobytes and, on a CDC ACM console, defaults to gating output on DTR
# (SHELL_BACKEND_SERIAL_CHECK_DTR) - a known way on this bench to end up looking
# at a board that appears dead. src/main.c parses lines with uart_poll_in().
CONFIG_SHELL=n

# The RADIO needs the crystal, not the internal oscillator: a 1 Mbps GFSK link
# will not hold bit sync on HFINT, and the backend starts it through the clock
# control driver.
CONFIG_CLOCK_CONTROL=y

# ── The module under test ───────────────────────────────────────────────────
#
# CONFIG_RADIANT_CORE_BACKEND_NRF is what makes this a measurement of the
# SHIPPING path. Both packet formats under comparison come from
# radiant_frame_format(); everything that turns them into bits on the air is the
# shipping backend, unmodified.
#
# THIS ASSIGNMENT CAN BE SILENTLY IGNORED, which is why src/main.c asserts on
# the result rather than on this line. RADIANT_CORE_BACKEND_NRF depends on
# SOC_COMPATIBLE_NRF52X || SOC_COMPATIBLE_NRF54LX; on any other part the
# dependency is unmet, Kconfig falls back to the choice default
# (RADIANT_CORE_BACKEND_NULL), no error is printed, and the image runs and
# refuses every arm. See radiant_core/Kconfig's note on the same trap.
CONFIG_RADIANT_CORE=y
CONFIG_RADIANT_CORE_BACKEND_NRF=y

# The antr_* adapter is the one file in the module that reaches an application
# header (src/ant_radio.h). This spike has no host bridge to satisfy it and
# forwards nothing to a host, so it goes out the same way the unit-test
# application and spike/x1m_len take it out.
CONFIG_RADIANT_CORE_ANTR_API=n

# Nothing else may claim the RADIO. The backend BUILD_ASSERTs !CONFIG_BT for
# itself; MPSL is listed for the same reason spike/rx_raw lists it.
CONFIG_BT=n
CONFIG_MPSL=n

CONFIG_MAIN_STACK_SIZE=4096

# No floating point in the output. Loss is printed from integer hundredths of a
# percent, which is also what keeps the figure exactly reproducible from the
# three counters it is derived from.
CONFIG_CBPRINTF_FP_SUPPORT=n
