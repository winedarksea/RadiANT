#
# Provenance: clean-room. Zephyr Kconfig only; nothing here derives from
# sdk-ant. Read from the repo-root boards/adafruit_feather_nrf52840_nrf52840_uf2.conf
# and from the board's own Kconfig.defconfig /
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig in NCS v3.2.4.
#
# ---------------------------------------------------------------------------
# The console, which is the reason this file exists
# ---------------------------------------------------------------------------
# This board has no debugger and no usable UART on this bench, and this
# program's console carries its INPUT as well as its output. So the console goes
# over USB CDC ACM.
#
# THE NOTABLE THING IS THAT ALMOST NOTHING IS NEEDED. The
# adafruit_feather_nrf52840/nrf52840/uf2 board target already:
#
#   - includes boards/common/usb/cdc_acm_serial.dtsi, which creates
#     board_cdc_acm_uart under zephyr_udc0 and points zephyr,console at it;
#   - sources boards/common/usb/Kconfig.cdc_acm_serial.defconfig, which defaults
#     BOARD_SERIAL_BACKEND_CDC_ACM, USB_DEVICE_STACK_NEXT and
#     CDC_ACM_SERIAL_INITIALIZE_AT_BOOT to y, and CDC_ACM_SERIAL_ENABLE_AT_BOOT
#     is y by default - so usbd_init() and usbd_enable() run from SYS_INIT with
#     no application code at all.
#
# The PRODUCT build turns all of that off (see the repo-root file of this name:
# CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n, plus an overlay that deletes
# zephyr,console) because the product's USB is a vendor class impersonating an
# ANT dongle and its diagnostics go out over RTT. This spike is the opposite
# case, so the assignment below is a deliberate y rather than an absence - it is
# the one line that says "this image's console is USB", and leaving it implicit
# would make a future default change silently produce a board with no console
# and no way to drive a ladder.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y

# ---------------------------------------------------------------------------
# Loaded by the Adafruit UF2 bootloader
# ---------------------------------------------------------------------------
# The application is linked at the code partition the UF2 bootloader expects
# (0x26000, from nrf52840_partition_uf2_sdv6.dtsi), not at 0. The board
# defconfig already sets BUILD_OUTPUT_UF2; USE_DT_CODE_PARTITION is what makes
# the link address follow the devicetree, and without it the image is built for
# address 0 and the bootloader loads something that cannot run.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_USE_DT_CODE_PARTITION=y

# The stack has to grow: the CDC ACM console lives on top of the new USB device
# stack, whose threads and buffers this board's product build never pays for.
CONFIG_HEAP_MEM_POOL_SIZE=1024
