#
# Provenance: clean-room. Zephyr Kconfig only; nothing here derives from
# sdk-ant.
#
# Spike A owns the RADIO outright. That is the point of the experiment - the
# whole question is whether the bare peripheral can be made to hear an ANT
# frame, so anything that would also want the radio has to be absent, and the
# build asserts it rather than trusting it (see src/main.c).
#
# The console is the entire output of this program. It goes out uart20, which
# is the nRF54L15 DK's first VCOM - COM7 on this bench. RTT is deliberately not
# used: the VCOM needs no SEGGER DLL on the host, and a spike whose results can
# only be read through vendor tooling is a spike whose results are hard to
# archive.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# No logging subsystem. printk is synchronous, and at 4 Hz there is nothing to
# gain from deferred logging except the chance of losing the last lines of a
# phase when the buffer wraps.
CONFIG_LOG=n

# clock_control_on(CLOCK_CONTROL_NRF_SUBSYS_HF) is how the HFXO is started.
# The RADIO will not hold bit sync on the internal oscillator.
CONFIG_CLOCK_CONTROL=y

# Nothing else may claim the RADIO.
CONFIG_BT=n
CONFIG_MPSL=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=n
