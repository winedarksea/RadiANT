# SPDX-License-Identifier: Apache-2.0
#
# Build arm 4 of the CC26xx coexistence A/B: the arbiter WITH a real second RF
# core client. See docs/testing.md for the four-arm table and ADR 0015 for why
# there are four arms rather than three.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_coex.conf" \
#               "-DEXTRA_DTC_OVERLAY_FILE=ti_coex.overlay"
#
# TI_COEX.OVERLAY IS NOT OPTIONAL. Zephyr's own board file disables the
# 802.15.4 devicetree node and deletes the zephyr,ieee802154 chosen property,
# so without the overlay this fragment builds a driver with no device behind it
# and fails on an undeclared __device_dts_ord_NN. See that file's header.
#
# READ THIS ARM AGAINST ARM 3 (ti_gate.conf), never against arm 1. Arm 3 is
# this image with the neighbour absent, so the difference is the neighbour's
# cost and nothing else; against arm 1 the number would also carry the CPE
# patch swap (arm 2's job) and the scheduler's own overhead (arm 3's job), and
# the patch swap could plausibly be the larger of the three.
#
# ── WHAT IS AND IS NOT VERIFIED HERE ────────────────────────────────────────
#
# This arm compiles and links. Nothing in it has been run against a real
# 802.15.4 peer, because this bench has none. That matters more than usual: the
# ANT-side number this arm produces is honest either way (the neighbour's
# background CMD_IEEE_RX is on the air and genuinely contends for the core
# whether or not anyone answers it), but THE NEIGHBOUR'S OWN HEALTH CANNOT BE
# SCORED without a peer - and the neighbour going silently deaf is exactly the
# failure this arm exists to catch. A run that reports only an ANT loss figure
# has measured half of what the arm is for. Do not record a coexistence verdict
# off it.
#
# ── THE THREE LINES, AND WHY EACH IS A TRAP IF LEFT OUT ─────────────────────
#
#   - CONFIG_IEEE802154_CC13XX_CC26XX=n is NOT "turn 802.15.4 off". It turns
#     off ZEPHYR'S copy of the driver so that ours compiles instead. Leaving it
#     y is not a subtle mistake either: both files register NET_DEVICE against
#     the same devicetree node, and radiant/CMakeLists.txt compiles
#     driverlib/rfc.c which hal_ti also compiles under that symbol. It fails at
#     link, loudly, which is the good case. The symbol `default y` off the
#     devicetree node, so it has to be said explicitly here.
#   - CONFIG_RADIANT_COEX154_CC26XX_FORK=y is the second client. Without
#     it this fragment is arm 3 with extra networking symbols - an A/B whose
#     two halves are the same image, which reads as "coexistence costs
#     nothing". That is the same shape as the nRF side's CONFIG_BT=y trap in
#     coex.conf: a stack linked in and asking for no air at all.
#   - CONFIG_RADIANT_BACKEND_CC26XX_COEX=y is the arbiter. Without it the
#     backend still uses RF_postCmd, and RF_verifyGap then refuses every ANT
#     window for as long as the neighbour's endless background receive is
#     posted - which is always. That build does not measure contention, it
#     measures a deaf ANT stack.
#
# CHECK THE GENERATED .config, NOT THE BUILD LOG. Every trap above ends in a
# warning among a hundred others and an exit code of 0:
#
#   Select-String build\<dir>\<app>\zephyr\.config `
#       -Pattern "^CONFIG_RADIANT_BACKEND_CC26XX|^CONFIG_RADIANT_COEX154|^CONFIG_IEEE802154_CC13XX_CC26XX="
#
# Expect BACKEND_CC26XX=y, BACKEND_CC26XX_COEX=y, BACKEND_CC26XX_MULTI_PATCH=y
# (selected by COEX), COEX154_CC26XX_FORK=y, and IEEE802154_CC13XX_CC26XX
# absent or =n.

CONFIG_RADIANT_BACKEND_CC26XX_COEX=y

# Ours instead of Zephyr's. Order does not matter to Kconfig; the comment above
# is the reason both lines are here.
CONFIG_IEEE802154_CC13XX_CC26XX=n
CONFIG_RADIANT_COEX154_CC26XX_FORK=y

# The L2 the driver delivers into. The driver registers NET_DEVICE and needs a
# net_if to hand frames to; without NETWORKING it does not build.
#
# NO IP ON TOP, and that is deliberate rather than minimal. This arm wants a
# neighbour that occupies the radio, not a neighbour that joins a network:
# every layer above the L2 is one more place a frame can vanish for a reason
# that is not the arbiter - the same argument coex154/prj.conf makes on the
# nRF side, reached from the other direction (there the L2 itself was dropped
# because the driver could be driven raw; this driver cannot).
#
CONFIG_NETWORKING=y
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n

# NET_CONFIG_SETTINGS is on ONLY because it is the thing that applies the
# channel and PAN ID below - the NET_CONFIG_IEEE802154_* symbols `depends on`
# it, and without it they are dropped with a warning among a hundred others,
# leaving the neighbour on the default channel. That is the failure this arm
# can least afford: an overlapping channel turns a scheduling measurement into
# an adjacent-interference measurement and the two are indistinguishable
# afterwards.
#
# AND ITS TWO BLOCKING SWITCHES ARE OFF DELIBERATELY. NET_CONFIG_NEED_IPV6
# blocks BEFORE main() on a node with nothing to attach to - this bench lost
# several runs to exactly that on a Thread build, where a perfectly healthy
# board looked hung for 31 seconds and then came up. With IPv6 and IPv4 off
# above there is nothing for it to wait for anyway; these two lines are here so
# that turning either address family back on later cannot silently reintroduce
# the stall.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV4=n

# A PAN to sit on. Channel 15 rather than the default, and it is chosen against
# the ANT side, not for 802.15.4's sake: 2425 MHz is clear of the ANT+ network
# frequency (2457 MHz, RF channel 57) and of the two frequencies the
# search/tracking pair uses, so this arm measures SCHEDULING contention for the
# one radio rather than adjacent-channel interference. An arm that overlapped
# in frequency would confuse the two permanently.
CONFIG_NET_CONFIG_IEEE802154_CHANNEL=15
CONFIG_NET_CONFIG_IEEE802154_PAN_ID=0xabcd
