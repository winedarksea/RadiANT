#
# THE CONTENDED HALF OF P3.5: 802.15.4 receive with radiant_core taking the
# radio away underneath it.
#
#   west ... -- "-DEXTRA_CONF_FILE=rx_ant.conf"
#
# The other half is the SAME image without this fragment - 802.15.4 alone, no
# ANT, no MPSL contention - and the number P3.5 reports is the DIFFERENCE. A
# single run of the contended build measures the antenna, the channel and the
# distance between two boards on a desk as much as it measures the arbiter.
#
# THE UNCONTENDED HALF IS NOT OPTIONAL AND IS NOT A FORMALITY. docs section
# 7.3a predicts 18-24 % loss. Two boards a metre apart on channel 26 can easily
# lose a percent or two to nothing at all, and a bench that has never measured
# its own floor cannot tell 24 % of arbitration from 22 % of arbitration plus
# 2 % of room. tools/ant_verify.py's `loss (exact)` exists for the same reason
# on the other radio, and this is the same quantity so the two are comparable.

CONFIG_RADIANT_CORE=y
CONFIG_RADIANT_CORE_BACKEND_NRF=y

# The arbiter. Without it radiant_core drives the RADIO directly and nrf_802154
# never gets a look in - the two would simply fight over the peripheral, which
# is not coexistence and is not what section 7.3a models.
CONFIG_RADIANT_CORE_BACKEND_NRF_GATE_MPSL=y

# Two MPSL timeslot users now, not one: the gate holds a session and the
# 802.15.4 driver's RAAL holds another.
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2

# THE LINE WITHOUT WHICH THIS MEASURES NOTHING, and it is not on by default.
#
# Its own Kconfig help, verbatim: "In dynamic multiprotocol applications, access
# to the radio peripheral must be distributed by an arbiter. To support this
# arbitration in the driver, this option must be enabled. OTHERWISE, THE DRIVER
# ASSUMES THAT ACCESS TO THE RADIO PERIPHERAL IS GRANTED INDEFINITELY."
#
# So without it the 802.15.4 driver does not ask MPSL for anything - it simply
# programs the RADIO whenever it likes, straight over whatever timeslot the gate
# is holding. That is not the coexistence section 7.3a models; it is two drivers
# fighting over one peripheral, and the loss figure it produced would be a
# number about a bug in this configuration rather than about the arbiter.
#
# It CANNOT BE SET HERE. It is promptless, and assigning a promptless symbol in
# a .conf file is a hard Kconfig error rather than a silent drop - which is the
# one merciful thing about it. See COEX154_ARBITRATED in Kconfig, which selects
# it off the gate symbol below.

# The counters section 7.3a's scheduler column is read from.
CONFIG_RADIANT_CORE_SWEEP_DEBUG=y
