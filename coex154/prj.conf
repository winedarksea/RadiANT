#
# P3.5's stub 802.15.4 pair. See src/main.c for what is being measured and why
# it is not OpenThread.

CONFIG_LOG=y
# IMMEDIATE, not deferred. Deferred logging needs its own thread to run, and
# this application spends its life inside radio callbacks; the first symptom of
# getting that wrong here was a boot banner (printk, synchronous) followed by
# total silence, which reads exactly like a hang in nrf_802154_init(). The
# throughput cost is irrelevant - this prints once every ten seconds.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=2048

# THE LOG GOES OUT THE VCOM, NOT RTT, and this is not the default. Without
# these three the image boots, runs, and prints absolutely nothing to COM7 -
# which on a board with no other output is indistinguishable from a dead image.
# Same reasoning as boards/nrf54l15dk_nrf54l15_cpuapp.conf in the root
# application: the VCOM is a COM port over the cable that already programs the
# board, whereas RTT would need SEGGER's JLinkARM DLL on the host.
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# The radio driver, from nrfxlib rather than serialised to another core. On the
# nRF54L15 the RADIO is on the only core there is; the nRF5340 build overrides
# this - see nrf5340.conf.
#
# WHICH driver, not WHETHER. NRF_802154_SOURCE_NRFXLIB on its own adds no
# include path and no library: the build fails on a missing nrf_802154.h with
# every symbol apparently set. NRF_802154_RADIO_DRIVER is the one that matters,
# and nothing in tree ever sets it explicitly - it is defaulted to y by
# nrf/subsys/net/openthread's defconfig - so an application that wants the
# driver WITHOUT OpenThread has to ask.
#
# IT IS ASKED FOR PER BOARD, NOT HERE, because the two boards this application
# runs on cannot both have it. RADIO_DRIVER `depends on
# HAS_HW_NRF_RADIO_IEEE802154`, and on the nRF5340 the RADIO is on the NETWORK
# core - so on cpuapp the symbol is unsatisfiable and setting it here would be
# dropped with a warning among a hundred others, leaving an image with no radio
# at all and an exit code of 0. See boards/.
CONFIG_NRF_802154_SOURCE_NRFXLIB=y

# NOT the Zephyr ieee802154 driver, and not the network stack it delivers into.
# main.c explains at length; the short version is that a frame counter does not
# need an L2 and an L2 is one more place for a frame to vanish for a reason that
# is not the arbiter.
CONFIG_NETWORKING=n
CONFIG_IEEE802154=n

# NO TEMPERATURE COMPENSATION, and it is not an optimisation.
#
# NRF_802154_TEMPERATURE_UPDATE defaults on and drags in SENSOR and TEMP_NRF5 -
# which on this SoC resolves to TEMP_NRF5_MPSL, a driver that reads the die
# temperature THROUGH MPSL at POST_KERNEL priority 91. The observed failure was
# a boot banner and then nothing at all: main() was never reached and no fault
# was printed, because the hang is before the application exists.
#
# What it buys is CCA threshold and crystal drift compensation over
# temperature, on a bench at room temperature, for a measurement that runs for
# a minute. Nothing. What it costs is a second MPSL client in the arm of the
# A/B that is supposed to have none.
CONFIG_NRF_802154_TEMPERATURE_UPDATE=n

# The receive callback runs in the driver's own context and does a handful of
# byte loads. Nothing here needs a deep stack.
CONFIG_ISR_STACK_SIZE=2048
