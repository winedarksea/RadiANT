# Synthesize the 32.768 kHz clock from the 32 MHz crystal.
#
# nRF52840 ONLY. On nRF54L this does not work, and src/main.c refuses to build
# the combination rather than let it ship. Measured on an nRF54L15 DK against a
# live power meter, alternating builds in one sitting: XTAL heard 14
# broadcasts, SYNTH heard none, XTAL heard 14 again. Nothing reports a problem
# - the LFSYNT source exists in the nRF54L register map, the clock starts,
# ant_init() returns 0, channels open and acknowledge - and the radio never
# receives anything. An nRF54L board without a real crystal is not a dongle,
# and cannot be made into one from software.
#
# For nRF52840 boards that have no 32.768 kHz crystal. That is the first
# component a cheap clone drops, and it is not knowable from a product listing
# - two boards sold under the same name and photograph may differ.
#
# Without it, Zephyr's default LFXO source never starts. Because ant_init()
# gates usb_enable() in main.c, the symptom is that the board never enumerates
# at all: no ANT+ dongle, no COM port, nothing. It reads as a dead board or a
# bad cable rather than a missing part. (The RC fallback is not an answer
# either - it runs at +/-500 ppm against ANT's +/-50 ppm requirement, 10x out of
# tolerance, so channels will not stay synchronised.)
#
# The 32 MHz crystal is always present: the nRF52840 radio cannot operate
# without one, so no board claiming BLE can omit it, and Nordic requires it
# inside +/-40 ppm. LFSYNTH derives the low-frequency clock from it and inherits
# that accuracy, which lands inside ANT's window on any board fit to be a radio
# at all.
#
# Two costs, in exchange. HFCLK must run continuously, which would be
# disqualifying on a battery device and is free on a dongle in a powered port.
# And a synthesized clock jitters more than a crystal, which is why this is a
# fallback rather than the default - if the board has the crystal, the crystal
# is better.
#
# MPSL supports this source directly: mpsl_init.c maps
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH to MPSL_CLOCK_LF_SRC_SYNTH, and
# mpsl_clock_ctrl.c carries a workaround (NRFX-6865) holding HFXO up while it
# is in use.
#
# Usage:
#   west build ... -b promicro_nrf52840/nrf52840/uf2 -- "-DEXTRA_CONF_FILE=synth.conf"

CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
