# West manifest for RadiANT / ant_dongle.
#
# This repository is a freestanding nRF Connect SDK application: it is not part
# of the NCS tree and does not need to be. This manifest exists so that
#
#   west init -m https://github.com/<owner>/RadiANT --mr master radiant-ws
#   cd radiant-ws && west update
#
# produces a complete, buildable workspace from nothing, and so that the SDK
# version this application is developed and tested against is recorded in the
# repository rather than in someone's shell history.
#
# THIS MANIFEST IS NOW HOW CI BUILDS. Every job in
# .github/workflows/release.yml checks this repository out and runs
# `west init -l` against this file. That is new: until 2026-08-20 the job that
# produced release artifacts checked out sdk-ant separately and initialised
# against *sdk-ant's* manifest instead, because sdk-ant declares
# `self: path: ant` and is itself a manifest repository - so in that layout
# sdk-ant, not this file, chose the SDK version. Release artifacts have since
# moved to the clean-room backend and that job is deleted
# (docs/decisions/0001-backend-selection-and-release-default.md).
#
# The two entry points still exist, and the second is now a bench-only route:
#
#   this manifest      -> the workspace CI and everyone else uses. No sdk-ant,
#                         builds every shipping image, needs no credentials.
#   sdk-ant's manifest -> full workspace, sdk-ant present. Used by hand when an
#                         A/B comparison against libant.a is being run.
#
# They deliberately resolve DIFFERENT SDK versions and must stay decoupled:
# sdk-ant v2.1.0 cannot build on the v3.4.0 this file imports at all. If the
# two ever disagree, sdk-ant's pin wins for the comparison build and this one
# wins for everything else; the difference is visible in .config.

manifest:
  version: "0.13"

  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
    # sdk-ant lives in its own GitHub organisation, separate from nrfconnect,
    # and access is granted per account under Garmin's terms for the SDK.
    - name: ant-nrfconnect
      url-base: https://github.com/ant-nrfconnect
    # Upstream Zephyr's own organisation, for the one HAL NCS filters out of
    # its import. See the hal_ti project below.
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  # The `ant` group is disabled by default, and this is the single most
  # important line in the file.
  #
  # sdk-ant is a private repository. If it were an ordinary project entry,
  # `west update` on a fresh public clone would attempt to clone it, fail
  # authentication, and abort the whole update - so nobody without access to
  # the private repository could set up a workspace at all, which is
  # precisely the failure mode this project exists to remove. Putting it in a
  # disabled group means the default path clones nothing private, succeeds,
  # and yields a tree that builds the open backends.
  #
  # A workspace opts in explicitly:
  #
  #   west config manifest.group-filter +ant
  #   west update
  #
  # which places the checkout at <topdir>/sdk-ant - the same sibling location
  # the root CMakeLists.txt guesses when SDK_ANT_DIR is unset, so no further
  # configuration is needed after opting in.
  group-filter: [-ant]

  projects:
    # The nRF Connect SDK, imported wholesale. Importing sdk-nrf rather than
    # listing Zephyr separately is deliberate: NCS pins its own fork of Zephyr
    # (the `ncs-vX.Y.Z` tags on nrfconnect/sdk-zephyr) along with every HAL,
    # nrfxlib and MCUboot revision it was tested with, and hand-pinning Zephyr
    # here would let this file drift out of step with that set. One pin, one
    # source of truth: change the revision below and the whole SDK moves.
    #
    # v3.4.0 is the version this application is developed and released against.
    # Locally it corresponds to the C:\ncs\v3.4.0 install and toolchain bundle
    # dcbdc366a1 (Zephyr SDK 1.0.1); sdk-nrf v3.4.0 imports Zephyr ncs-v3.4.0.
    - name: nrf
      remote: nrfconnect
      repo-path: sdk-nrf
      revision: v3.4.0
      path: nrf
      import: true

    # The proprietary ANT stack: Nordic's ANT Zephyr module and the prebuilt
    # libant.a. Optional by construction - see the group-filter note above.
    #
    # This is the `sdk_ant` backend of the three described in
    # docs/decisions/0001-backend-selection-and-release-default.md. It is the
    # A/B COMPARISON REFERENCE and is in no shipping image: release artifacts
    # moved to the clean-room backend on 2026-08-20. It stays selectable
    # (-DANT_RADIO=sdk_ant, which must now be passed explicitly) because it is
    # the thing radiant is measured against, and the only build that can
    # BUILD_ASSERT our protocol constants against Garmin's own headers.
    #
    # Pinned at v2.1.0. Do not float this to a branch: the whole point of the
    # pin is that an A/B comparison run months apart is against the same
    # reference. Nothing in .github/ names this revision any more - the
    # workflow variable that used to mirror it went with the deleted job - so
    # this line is the only pin, which is simpler rather than weaker.
    #
    # Not imported. sdk-ant's own west.yml declares `self: path: ant` and
    # imports sdk-nrf itself; importing it here would produce two conflicting
    # opinions about where the SDK lives and which revision it is.
    - name: sdk-ant
      remote: ant-nrfconnect
      repo-path: sdk-ant
      revision: v2.1.0
      path: sdk-ant
      groups:
        - ant

    # TI's SimpleLink HAL, for the CC13x2/CC26x2 backend.
    #
    # THIS IS THE ONLY PROJECT HERE THAT EXISTS BECAUSE OF AN OMISSION RATHER
    # THAN A CHOICE. Both NCS Zephyr forks still ship boards/ti/cc26x2r1_launchxl
    # and soc/ti/simplelink/cc13x2_cc26x2, so the board and the SoC are already
    # in the workspace above - but nrf/west.yml imports zephyr's manifest through
    # a `name-allowlist` that does not include hal_ti, so the project is dropped
    # from the RESOLVED manifest and west never learns it exists. That is why it
    # cannot be recovered with `manifest.project-filter`: that setting selects
    # among projects the resolved manifest defines, and this one is not among
    # them. Naming it here is the only way west can fetch it.
    #
    # The revision is zephyr's own pin, copied from
    # <ncs>/zephyr/west.yml - the same value scripts/fetch_hal_ti.ps1 READS out
    # of that file rather than hardcoding, for a workspace (like the local
    # C:\ncs install) that was not created from this manifest. If the two ever
    # disagree, that file is right and this line is stale.
    #
    # Its own group so it can be switched off - `west config
    # manifest.group-filter +ant,-ti` - but enabled by default, unlike sdk-ant.
    # The reason for sdk-ant's default does not apply: hal_ti is public, so
    # cloning it cannot fail authentication and abort the update, and it is
    # 44 MB rather than the multi-GB its full history suggests.
    - name: hal_ti
      remote: zephyrproject
      repo-path: hal_ti
      revision: afbcfffd393be03ca2c9b41f9ce8d94a4c2f2fbd
      path: modules/hal/ti
      groups:
        - ti

  self:
    # Placed as a sibling of sdk-ant so that <app>/../sdk-ant resolves, which
    # is the CMake default when SDK_ANT_DIR is not set.
    path: ant_dongle
