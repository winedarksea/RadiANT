# P8b: enable the BLE HRS branch on top of the ANT+ master build.
#
# Passed with -Dstrap_EXTRA_CONF_FILE=strap_ble.conf (image-scoped, per the
# root CMakeLists.txt's note on sysbuild EXTRA_CONF_FILE resolution: a plain
# -DEXTRA_CONF_FILE= lands in the sysbuild cache and never reaches the image).

CONFIG_STRAP_BLE_HRS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# The name a phone, Zwift, or a BLE scanner shows for this node. It is a
# simulated heart rate monitor, so it is named as one - "RadiANT HR", not
# "RadiANT Strap". strap_ble.c puts this same string in the advertising
# payload (BT_DATA_NAME_COMPLETE), so it is visible in a scan list without
# connecting first.
CONFIG_BT_DEVICE_NAME="RadiANT HR"

# radiant/Kconfig: RADIANT_BACKEND_NRF's choice entry carries
# `depends on !BT || RADIANT_BACKEND_NRF_GATE_MPSL`. CONFIG_BT=y above
# breaks the first half, so without this the choice silently falls back to
# RADIANT_BACKEND_NULL - an image that enumerates, answers the host, and
# transmits nothing, with the fallback buried in a warning among a hundred
# others. This IS the arbitrated build P8b needs anyway: a strap advertising
# BLE HRS beside an ANT+ master is exactly the case the gate exists for.
CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
