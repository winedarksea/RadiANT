#
# The named dual-radio preset: ANT+ FE-C with FTMS Indoor Bike over BLE, and
# strict product identity. The build a manufacturer ships, once a product
# .conf supplies the identity:
#
#   west build -b <board> apps/smart_trainer -- \
#     -Dsmart_trainer_EXTRA_CONF_FILE="dual.conf;product.conf"
#
# (product.conf is your copy of product.conf.example.)
#
# ON ITS OWN THIS PRESET FAILS TO CONFIGURE, ON PURPOSE: strict identity
# refuses the placeholder identity, and at run time a trainer whose identity
# fails to boot stays off the air rather than sharing one device number with
# every unit of the image. scripts/build_all.ps1 trainer_dual_fail asserts the
# refusal; trainer_dual* rows build it with tests/product_test.conf.

CONFIG_SMART_TRAINER_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
# 5 key slots = 4 phones: the pairing window keeps one slot spare
# (radiant_ble_pairing.h).
CONFIG_BT_MAX_PAIRED=5
CONFIG_RADIANT_PRODUCT_STRICT=y

# Equipment bonding: new phones only inside a pairing window opened at the
# trainer (TRAINER_EVT_PAIRING_WINDOW; the simulator: sw0), LRU eviction when
# full. The power-on window is the fallback for a trainer with no such
# control: power-cycle it to pair. Drop it once yours has one.
CONFIG_RADIANT_BLE_PAIRING_WINDOW=y
CONFIG_RADIANT_BLE_PAIRING_WINDOW_AT_BOOT_S=120
