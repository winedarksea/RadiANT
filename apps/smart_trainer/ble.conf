# FTMS Indoor Bike over BLE on top of the ANT+ FE-C node (development variant,
# no strict identity). Passed IMAGE-SCOPED:
#
#   -Dsmart_trainer_EXTRA_CONF_FILE=ble.conf
#
# THE PREFIX IS THE BASENAME OF THIS DIRECTORY; a wrong one is accepted in
# silence and builds with no BLE (see apps/treadmill/ble.conf).
#
# SMART_TRAINER_BLE selects SMP (the Control Point needs encryption), the
# shared BLE layer and DIS, the FTMS core (Indoor Bike), the arbiter and the
# MPSL gate; the session count default rides on it too.

CONFIG_SMART_TRAINER_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4

# In the scan response, at most 29 characters. No trademarked default.
CONFIG_BT_DEVICE_NAME="RadiANT Trainer"
