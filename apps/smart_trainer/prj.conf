# RadiANT smart trainer: ANT+ FE-C node. ble.conf adds FTMS; dual.conf is the
# shipping preset (BLE + strict identity). Copied from apps/treadmill/prj.conf,
# which explains each line at length.

CONFIG_SMART_TRAINER=y

CONFIG_RADIANT=y
CONFIG_RADIANT_ANT_API=y

# Per-unit identity (ADR 0009/0020): every trainer flashed from one image
# derives its own device number and serial on first boot.
CONFIG_RADIANT_SEC=y
CONFIG_RADIANT_NODE_IDENT=y
CONFIG_RADIANT_NODE_NVM_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_RADIANT_SEC_RNG_ENTROPY=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

# The simulated source uses float for the model's bisection.
CONFIG_FPU=y

CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# See apps/treadmill/prj.conf: a 1 KB ring drops the boot banner.
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
