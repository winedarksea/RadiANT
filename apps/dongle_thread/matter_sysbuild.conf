# SPDX-License-Identifier: Apache-2.0
#
# The sysbuild half of the Matter arm.
#
#   west ... -- "-DSB_EXTRA_CONF_FILE=matter_sysbuild.conf"
#
# ---------------------------------------------------------------------------
# THIS FILE IS NOT NAMED sysbuild.conf, AND THAT IS THE WHOLE POINT
# ---------------------------------------------------------------------------
#
# A file called sysbuild.conf at this application's root is picked up
# automatically by every build of this application - which is gate.conf,
# coex.conf, thread.conf, thread_sed.conf and bridge.conf as well as this arm.
# Four of those five carry the P3/P4 coexistence numbers recorded in
# docs/radiant-bridge.md section 7.4, and those numbers describe the images
# they were taken on. Turning Matter on in sysbuild for all of them would
# change every one of those images while changing nothing anybody could see in
# the fragment they were built from. So the Matter arm carries an EXPLICIT
# sysbuild fragment, named on the command line, and the other five arms are
# untouched by construction rather than by care.
#
# ---------------------------------------------------------------------------
# WHY IT HAS TO EXIST AT ALL
# ---------------------------------------------------------------------------
#
# nrf/sysbuild/CMakeLists.txt:890-903 writes CONFIG_CHIP into the application
# image from SB_CONFIG_MATTER, and it does so whenever connectedhomeip is in
# the workspace - which in this one it always is. `y` if SB_CONFIG_MATTER is
# set, `n` if it is not. It runs AFTER the application's own .conf fragments
# have been read, so an unset SB_CONFIG_MATTER does not conflict with
# matter.conf's CONFIG_CHIP=y, it overrides it: a clean build, exit code 0, and
# an image with no Matter in it.
#
# This is the reason E1's deliverable is a .config read-back rather than a
# green build.

SB_CONFIG_MATTER=y

# ── Tier 1: the DFU and provisioning machinery stays off ───────────────────
#
# SB_CONFIG_MATTER_OTA defaults to y (nrf/sysbuild/Kconfig.matter:26-31) and
# turns on CHIP_OTA_REQUESTOR and CHIP_OTA_IMAGE_BUILD in the image, which need
# MCUboot, a secondary slot and a partition layout this application has never
# had. SB_CONFIG_MATTER_FACTORY_DATA_GENERATE adds a generated factory-data
# partition and a HEX merge step.
#
# Both are real requirements for a shipping Matter device and both are
# deferred, not rejected. The first build that has to answer "does the CHIP
# stack link beside RadiANT, and what does it cost" should not also be the
# first build that has to answer "does this part's flash map close" - the two
# failures look nothing alike and debugging them together costs more than
# debugging them in order.
SB_CONFIG_MATTER_OTA=n
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n
SB_CONFIG_BOOTLOADER_MCUBOOT=n

# The nRF5340 needs a network-core image as well (SB_CONFIG_NETCORE_IPC_RADIO
# and its two transports), because its RADIO is on cpunet. Those symbols do not
# EXIST on the nRF54L15 - SUPPORT_NETCORE is nRF53/nRF54H only,
# nrf/sysbuild/Kconfig.netcore:14-16 - so they are passed on the nRF5340
# command line rather than written here, where they would be an assignment to
# an undefined symbol on the other board. See docs/matter-e1-readback.md for
# both reproduce lines.
