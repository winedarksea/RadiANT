# SPDX-License-Identifier: Apache-2.0
#
# The Matter arm: the CHIP stack linked beside RadiANT, as a build.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=thread.conf;matter.conf" \
#               "-DSB_EXTRA_CONF_FILE=matter_sysbuild.conf"
#
# E1 of the Matter plan. At the point this file was written there is no Matter
# SOURCE in the image at all: radiant_matter.c is still excluded by
# CMakeLists.txt:102-106 and nothing calls a CHIP API. This fragment exists to
# answer the three questions that are cheaper to answer before that code is
# written than after - does the image configure, does it link, and what does it
# cost in flash and RAM. docs/matter-e1-readback.md is the answer sheet.
#
# ---------------------------------------------------------------------------
# THIS LAYERS ON thread.conf AND NEVER ON bridge.conf
# ---------------------------------------------------------------------------
#
# bridge.conf brings CONFIG_NET_TCP, MQTT_LIB, a broker connection and
# HEAP_MEM_POOL_SIZE=49152. Matter wants the sample bus and the tap without any
# of that: CHIP is its own transport and an MQTT client beside it is a second
# publisher of the same samples, not a dependency of the first. So the four
# lines this arm needs out of bridge.conf are RESTATED below rather than
# inherited, exactly as bridge.conf itself restates NET_CONFIG_INIT_TIMEOUT
# rather than inheriting it from thread.conf (bridge.conf, "So the timeout is
# restated HERE rather than inherited"). A fragment layered on a different base
# must not lose a load-bearing line, and it must not silently acquire one.
#
# ---------------------------------------------------------------------------
# -DSB_EXTRA_CONF_FILE=matter_sysbuild.conf IS NOT OPTIONAL, AND WITHOUT IT
# THE CONFIG_CHIP=y BELOW IS OVERWRITTEN
# ---------------------------------------------------------------------------
#
# nrf/sysbuild/CMakeLists.txt:890-903:
#
#     if(SB_CONFIG_ZEPHYR_CONNECTEDHOMEIP_MODULE)
#       if(SB_CONFIG_MATTER)
#         set_config_bool(${DEFAULT_IMAGE} CONFIG_CHIP y)
#       else()
#         set_config_bool(${DEFAULT_IMAGE} CONFIG_CHIP n)
#
# connectedhomeip is in this workspace (C:\ncs\v3.4.0\modules\lib\matter), so
# the outer test is true whether or not anyone asked for Matter. If
# SB_CONFIG_MATTER is unset, sysbuild writes CONFIG_CHIP=n into this image's
# merged configuration AFTER this file has been read, and the build is clean,
# fast and completely Matter-free with an exit code of 0. That is a silent
# fallback of exactly the shape this application has already paid for twice
# (see coex.conf's header and thread.conf's). matter_sysbuild.conf is the file
# that sets SB_CONFIG_MATTER=y; it cannot be sysbuild.conf, because a
# sysbuild.conf at this application's root would apply to all five existing
# coexistence arms whose baselines have to stay comparable.
#
# ALWAYS CHECK THE GENERATED .config, NOT THE BUILD LOG:
#
#   Select-String build\<dir>\dongle_thread\zephyr\.config -Pattern `
#       "^CONFIG_CHIP=|^CONFIG_BT=|^CONFIG_MPSL|^CONFIG_RADIANT_BACKEND_"
#
# Expect CHIP=y, BT=y, MPSL=y, MPSL_TIMESLOT_SESSION_COUNT>=2,
# RADIANT_BACKEND_NRF=y AND RADIANT_BACKEND_NRF_GATE_MPSL=y.
# RADIANT_BACKEND_NULL=y here is the failure that reports EXIT=0 and puts
# nothing on the air.

# ── The stack ──────────────────────────────────────────────────────────────
CONFIG_CHIP=y

# The application-side symbol for RadiANT's Matter sink, declared in this
# application's Kconfig beside RADIANT_BRIDGE and ANT_DONGLE_MQTT_SINK. As of
# E3 it turns on CONFIG_ANT_DONGLE_MATTER_MAP, which compiles
# radiant/src/bridge/radiant_matter.c - the section 8.1 map - into this image.
# It is set here rather than inferred so that the arm is identifiable from its
# own .config rather than from the command line that produced it.
CONFIG_ANT_DONGLE_MATTER=y

# ── The vendored bridge core: the ZAP, the project config, the storage ──────
#
# Package E3. apps/dongle_thread/src/matter/ is NCS's matter_bridge core with
# the whole BLE-central provider left behind; src/matter/README.md records the
# source path, the NCS version and every omission. These four lines are what
# make the build consume it.
#
# THE ZAP PATH IS NOT A CONVENIENCE, IT IS THE DATA MODEL. Both
# ncs_get_zap_parent_dir() and ncs_configure_data_model()
# (nrf/samples/matter/common/cmake/) read this symbol, string(CONFIGURE) it,
# and use the PARENT directory as the generated-code directory. With no value
# the parent path is empty, the include directory becomes the source root and
# the data model that gets compiled is whatever endpoint_config.h the include
# path happens to find first. ${APPLICATION_CONFIG_DIR} expands to this
# application's own root.
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/matter/default_zap/bridge.zap"

# CHIP's per-project configuration header, relative to this application's root.
# It carries exactly one line - CHIP_DEVICE_CONFIG_DYNAMIC_ENDPOINT_COUNT - and
# that line is trap 15: it sizes the Descriptor cluster's real per-endpoint
# server array, not just the dynamic endpoint table its own upstream comment
# describes. Read the file; the assertion that keeps it honest is
# src/matter/bridge_core_asserts.cpp.
CONFIG_CHIP_PROJECT_CONFIG="src/matter/chip_project_config.h"

# bridge_storage_manager.cpp is built on Nrf::PersistentStorage, and
# source_common.cmake only compiles a storage backend when this is set.
# Without it the vendored core compiles and fails to LINK, on
# Nrf::PersistentStorage::Instance() - which is at least loud. matter_bridge's
# own Kconfig defaults it to y for the same reason; this application's Kconfig
# does not, because four of its five other arms have no Matter at all.
CONFIG_NCS_SAMPLE_MATTER_PERSISTENT_STORAGE=y

# BridgeManager::HandleCommand() forwards a bound-cluster action through
# Nrf::Matter::BindingHandler, which needs the Interaction Model's Read Client.
# matter_bridge sets this "for all build configurations" and the comment in its
# Kconfig says exactly that. It is unused on this arm today - nothing calls
# HandleCommand until an ANT provider exists - and is set anyway because
# discovering it missing at E4, when the failure is a link error inside a
# vendored file nobody wants to modify, is the expensive order to discover it
# in.
CONFIG_CHIP_ENABLE_READ_CLIENT=y

# C++17, AND WITHOUT IT THE CHIP LIBRARY DOES NOT COMPILE AT ALL.
#
# Not a preference and not future-proofing. Measured on the first attempt at
# this arm: connectedhomeip's own GN build passes -std=gnu++17, but Zephyr's
# compile flags are appended AFTER it and carry -std=gnu++11 from the default
# arm of the STD_CPP choice, and the last -std on a g++ command line wins. The
# failure is 40 lines of
#
#   src/lib/support/TypeTraits.h:44: error: 'underlying_type_t' in namespace
#   'std' does not name a template type; did you mean 'underlying_type'?
#
# in ErrorStr.cpp and CHIPError.cpp - which reads like a broken toolchain or a
# corrupt checkout rather than a missing Kconfig line, and is neither. Every
# NCS Matter sample sets this in its prj.conf (nrf/samples/matter/template);
# nothing sets it for you.
CONFIG_STD_CPP17=y

# ── CHIP IS ON ITS ZEPHYR-SOCKETS PATH HERE, NOT ITS OPENTHREAD ONE ────────
#
# This is the one thing E1 found that the plan did not predict, and it follows
# directly from the plan's own decision to layer this arm on thread.conf.
#
# connectedhomeip's chip-module/Kconfig:475-478:
#
#     config CHIP_USE_OPENTHREAD_ENDPOINT
#         bool "Use OpenThread TCP/UDP stack directly"
#         default y
#         depends on OPENTHREAD && !WIFI && !NETWORKING
#
# thread.conf sets CONFIG_NETWORKING=y - it has to, because thread_coex_load.c
# sends UDP through Zephyr sockets and mqtt_sink.c needs the same stack. So the
# `!NETWORKING` dependency is unmet, CHIP_USE_OPENTHREAD_ENDPOINT falls to n,
# and chip_system_config_use_sockets becomes true in the generated args.gn.
# EVERY NCS Matter sample builds the other way: no Zephyr IP stack at all, CHIP
# talking to OpenThread's own UDP directly. This arm is therefore NOT the
# configuration Nordic's Matter samples are tested in, and that is a finding
# rather than a setting - see docs/matter-e1-readback.md.
#
# CONFIG_EVENTFD is what that path needs, and its absence is a compile error
# rather than a fallback:
#
#   src/system/WakeEvent.cpp:44: fatal error: sys/eventfd.h: No such file or
#   directory
#
# because SystemConfig.h:819-824 only reaches for <zephyr/posix/sys/eventfd.h>
# when CONFIG_EVENTFD is defined, and reaches for the nonexistent bare
# <sys/eventfd.h> otherwise. Loud, at least - unlike most of this file's traps.
#
# The alternative is to take NETWORKING away from the Matter arm and let CHIP
# use OpenThread directly, which would also drop the Zephyr IP stack out of the
# image. That is a real option and it is NOT taken here, because it would take
# thread_coex_load.c with it - the instrument every P4 coexistence number in
# section 7.4 was measured with - and this arm has to stay comparable to those.
# Revisit it when the Matter arm stops needing to be a coexistence arm too.
CONFIG_EVENTFD=y

# ── The arbiter, and the reason this line is not optional ───────────────────
#
# NOTHING IN THIS FILE SAYS CONFIG_BT=y, AND THE IMAGE HAS BLUETOOTH ANYWAY.
# connectedhomeip's Kconfig.defaults carries `config BT / default y` inside
# `if CHIP`, so BLE arrives as a Kconfig DEFAULT rather than as a line anyone
# wrote. That breaks the `!BT` half of radiant/Kconfig's
#
#     depends on !BT || RADIANT_BACKEND_NRF_GATE_MPSL
#
# and without the line below the whole radio backend silently becomes
# RADIANT_BACKEND_NULL - an image that boots, answers the host and puts nothing
# on the air. coex.conf's header describes this failure verbatim; the
# difference here is that coex.conf sets CONFIG_BT=y itself and one can see the
# connection, whereas in this file the cause is invisible.
#
# thread.conf already sets this and this arm layers on thread.conf. It is
# restated for the same reason bridge.conf restates NET_CONFIG_INIT_TIMEOUT:
# the line is load-bearing HERE, for a reason thread.conf does not have, and a
# future edit to thread.conf must not be able to take it away silently.
CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y

# THREE, NOT TWO, AND THE DIFFERENCE IS 96 BYTES.
#
# CONFIG_MPSL_TIMESLOT_SESSION_COUNT carries `default 0`, which sizes MPSL's
# session context array to nothing: mpsl_timeslot_session_open() then fails at
# runtime and the gate never gets air, in an image that configures, compiles,
# links and boots perfectly. build/m_link/template/zephyr/.config from the
# Matter flash spike is exactly that image - GATE_MPSL=y with COUNT=0 - so this
# is a documented near-miss rather than a hypothetical.
# radiant_radio_nrf_gate_mpsl.c now carries a BUILD_ASSERT for >= 1 (the first
# half of E1), which catches the zero but cannot count the users.
#
# The users on this arm: radiant's own gate (1), the 802.15.4 Service Layer,
# which takes a session of its own whether or not anything asks it to
# (thread.conf's header explains why), and the RRAM flash-sync driver, which
# adds one invisibly on nRF54L. thread.conf's 2 covers the first two. This arm
# adds Matter's persistent storage - fabrics, ACLs, the OT dataset - written
# through settings/ZMS on RRAM, so the flash-sync user is not theoretical here
# the way it is on a gate arm that never writes. 3 costs 96 bytes of RAM and
# removes the one failure in this file that a .config read-back CANNOT see.
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=3

# ── The four lines restated out of bridge.conf ─────────────────────────────
#
# The bus, the tap and the pairing window, with NO MQTT SINK. See the header:
# this arm publishes through CHIP, and pulling bridge.conf in wholesale would
# bring NET_TCP, MQTT_LIB and a broker connection that this image has no use
# for and whose air time a coexistence figure taken here would have to account
# for.
CONFIG_RADIANT_BRIDGE=y
CONFIG_ANT_DONGLE_RX_TAP=y
CONFIG_ANT_DONGLE_SELF_CHANNELS=2
CONFIG_ANT_DONGLE_PAIRING_WINDOW_S=60

# Restated for bridge.conf's stated reason, and it is sharper here: CHIP
# `imply`s NET_CONFIG_NEED_IPV6 through CHIP_USE_ZEPHYR_NETWORKING's chain, so
# a Matter image is if anything MORE likely than a bridge image to sit in
# net_config_init() waiting for an address an unattached MTD does not have.
# Measured at 31.04 s on this bench, before main(), and read as a hung board by
# a human and by ant_verify.py in the same session.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# ── Two owners of one LED ──────────────────────────────────────────────────
#
# NCS's samples/matter/common/src/board.cpp drives DK LEDs 0-3 as Matter state
# indicators, and apps/common/ant_heartbeat_led.c already flashes led0 as the
# ANT liveness-and-activity signal. Nothing in this arm compiles board.cpp yet, so today
# this line only records the decision - it is set now so that E2, which brings
# the sample-common sources in, cannot land the collision by omission.
CONFIG_NCS_SAMPLE_MATTER_LEDS=n

# ── Tier 1: no bootloader, no factory data, no OTA ─────────────────────────
#
# CHIP's own Kconfig defaults the CHIP_BOOTLOADER choice to MCUBOOT, which
# `imply BOOTLOADER_MCUBOOT` and drags in a secondary slot, a partition layout
# and DFU multi-image packaging. matter_sysbuild.conf says n to the sysbuild
# half (SB_CONFIG_MATTER_OTA, SB_CONFIG_MATTER_FACTORY_DATA_GENERATE,
# SB_CONFIG_BOOTLOADER_MCUBOOT); this is the image half of the same decision.
#
# NOT a statement that this device will ship without OTA or without factory
# data - it will need both. It is a statement that neither belongs in the first
# build that has to answer "does this link", because a partitioning failure and
# a Matter integration failure look nothing alike and debugging them together
# costs more than debugging them in order.
CONFIG_CHIP_BOOTLOADER_NONE=y

# SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n IS NOT ENOUGH, AND THIS IS THE
# SECOND HALF OF TRAP 2 THAT THE PLAN DOES NOT NAME.
#
# The sysbuild flag only stops the factory-data set being GENERATED. Which
# provider the image CONSUMES is a separate choice one level down, and
# chip-module/Kconfig defaults CHIP_FACTORY_DATA_BACKEND to
# CHIP_FACTORY_DATA_NRFCONNECT_BACKEND, which `select CHIP_FACTORY_DATA` -
# a provider that reads CBOR out of a `factory_data` flash partition. Nothing
# turns it off just because nothing is generating its content.
#
# Measured on this arm: CONFIG_CHIP_FACTORY_DATA=y with no such partition in
# the devicetree, and the build fails in FactoryDataProvider.h:40-41 on
#
#   error: 'DT_N_NODELABEL_factory_data_partition_REG_IDX_0_VAL_SIZEU' was not
#   declared in this scope
#
# which is a devicetree-shaped error message for a Kconfig-shaped problem. It
# fails loudly, which is the good case; the bad case would have been an image
# that links and then cannot commission because the partition it reads its
# certificates from is full of erased flash.
#
# Deferred with the rest of tier 1, not rejected: a shipping Matter device
# needs real factory data, a real DAC and a partition to keep them in.
CONFIG_CHIP_FACTORY_DATA_NONE=y

# ── RAM, and the two lines that bought E4/E5/E6 their room ─────────────────
#
# E3 measured this arm at 253 156 B of 256 KB - 96.57 %, 8 988 B free - before
# E4, E5 or E6 had written a byte. docs/matter-ram-budget.md is the ranked
# consumer table and the method; the two lines below are what came out of it,
# and both were measured on this arm rather than reasoned about.
#
# The measurement command, for whoever has to re-run it:
#
#   ninja -C build\<dir>\dongle_thread ram_report   # Zephyr's own tree
#   arm-zephyr-eabi-nm -C --print-size --size-sort zephyr\zephyr.elf
#
# and the number to quote is the linker's "RAM: ... B  256 KB  ...%" line, not
# `size` on the ELF - the latter counts data+bss and misses nothing here, but
# the linker's figure is the one the region check actually enforces.

# NO NFC ANTENNA, NO NFC STACK. Measured: -40 B RAM, -1 144 B flash.
#
# The 40 bytes are the honest number and they are almost nothing, which is
# itself the finding: connectedhomeip's Kconfig.defaults:232 turns
# CHIP_NFC_ONBOARDING_PAYLOAD on (the symbol's own `default n` in
# chip-module/Kconfig is overridden), and E1 recorded it as "headroom available
# for the asking". It is not - not yet. In THIS image nothing calls
# NFCOnboardingPayloadManagerImpl, so --gc-sections has already thrown the
# whole nfc_t2t/NDEF chain away and there is nothing left to save.
#
# The line stays anyway, for the reason CONFIG_NCS_SAMPLE_MATTER_LEDS=n stays:
# at E6, main() reaches Server::Init(), matter_event_handler.cpp's
# ShareQRCodeOverNFC() becomes reachable, and libnfc_t2t.a's buffers plus the
# NFCT driver arrive with it. This line means they never do. This product
# commissions by QR code (plan step G1) and has no NFC antenna; NCS's own
# Matter template disables it in its prj.conf for the same reason.
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# 32 KB OF KERNEL HEAP WITH NO CALLER IN THE IMAGE. Measured: -24 584 B RAM,
# 253 116 -> 228 532 B, 96.56 % -> 87.18 %. The single largest saving available
# on this arm, and the largest single consumer in the whole image.
#
# thread.conf sets CONFIG_HEAP_MEM_POOL_SIZE=32768 and calls it "the heap
# OpenThread wants". On the Matter arm that is not true, and the reason is
# trap 10 running in reverse:
#
#   zephyr/modules/openthread/platform/memory.c:13-15
#       void *otPlatCAlloc(size_t aNum, size_t aSize) { return calloc(...); }
#
# OpenThread allocates through libc, and CONFIG_CHIP_MALLOC_SYS_HEAP_OVERRIDE=y
# redirects libc malloc/calloc globally into CHIP's OWN 10 KB sys_heap
# (__wrap_malloc is in this image's symbol table; k_malloc is not). So on this
# arm OpenThread's allocations come out of CHIP_MALLOC_SYS_HEAP_SIZE, and
# HEAP_MEM_POOL_SIZE - a completely different heap - is not what serves them.
#
# What DOES reach _system_heap was checked rather than assumed. Disassembling
# the final ELF, the only four references to the _system_heap object are
# statics_init, init_mem_slab_obj_core_list, k_thread_system_pool_assign and
# z_thread_alloc_helper; the only caller of z_thread_alloc_helper is
# z_thread_malloc, whose only caller is queue_insert's alloc path - i.e.
# k_queue_alloc_append/prepend. And `nm` on the final ELF finds NO k_malloc,
# k_calloc, k_heap_alloc, k_queue_alloc_append, k_object_alloc or
# k_thread_stack_alloc at all. Nothing in this image can reach the pool.
# Zephyr's own required-minimum machinery agrees: no subsystem in this build
# declares a CONFIG_HEAP_MEM_POOL_ADD_SIZE_* at all.
#
# 8192 rather than 0 is margin for E4/E5/E6, not a measurement - it is four
# times a pool that currently has no user. RE-RUN THE CHECK AFTER E6:
#
#   arm-zephyr-eabi-nm zephyr\zephyr.elf | findstr "k_malloc k_queue_alloc"
#
# If any of those appear, this number has to be justified again rather than
# inherited. A too-small kernel heap fails at runtime, which a .config
# read-back cannot see - the same shape of failure as trap 4.
#
# RESTATED HERE, so thread.conf's 32768 is untouched and the five non-Matter
# arms keep the image their section 7.4 numbers were taken on. This is the
# third instance of the rule in this file's header: a fragment layered on a
# different base restates what it needs rather than editing the base.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# THE NEXT 12.5 KB IS MEASURED AND DELIBERATELY NOT TAKEN, so that nobody has
# to rediscover it at E6 under pressure. Both were built and measured on this
# arm and then reverted; docs/matter-ram-budget.md carries the argument.
#
#   CONFIG_CHIP_SYSTEM_PACKETBUFFER_POOL_SIZE=8   -9 100 B  (15 -> 8, 1 300 B
#       per buffer, exactly). CHIP's ONLY message buffer supply, shared by BTP
#       commissioning and every Thread exchange. Exhaustion is a dropped
#       message on the code path that allocates hardest, and 15 is what Nordic
#       ships and tests in every Matter sample. Needs G1 to have passed first.
#
#   CONFIG_CHIP_MAX_ACTIVE_CASE_CLIENTS=2         -3 408 B together (they size
#   CONFIG_CHIP_MAX_ACTIVE_DEVICES=2                  chip::Server::sServer).
#       Both default to CHIP_MAX_FABRICS *because* CHIP_PERSISTENT_SUBSCRIPTIONS
#       is on: they are the outgoing-CASE pools that resume subscriptions after
#       a reboot. At 2, a device joined to 5 fabrics cannot resume all of them.
#
# CONFIG_CHIP_MAX_FABRICS stays at 5 (the Matter specification's minimum) and
# CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE stays at 10240 - trap 10, and step 2 above
# made it MORE load-bearing, not less: OpenThread allocates out of it too.
