# nRF52840 DK - the flash/RAM feasibility arm for Matter on nRF52840.
#
# See docs/matter-nrf52840.md. This board target exists to answer a budget
# question with a linked image; there is no nRF52840 DK attached to this bench,
# so nothing here has ever booted.
#
#   west ... -b nrf52840dk/nrf52840 -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#            "-DEXTRA_CONF_FILE=thread.conf;matter.conf" \
#            "-DSB_EXTRA_CONF_FILE=matter_sysbuild.conf"

# ANT on uart1 (see the overlay), not USB. The nRF52840 does have a USB device
# peripheral - unlike the nRF54L15 - but a USB transport would add the device
# stack to a flash measurement whose whole point is the CHIP stack's cost, and
# the nRF54L15 arm this is being compared against is a UART arm.
CONFIG_ANT_DONGLE_TRANSPORT_UART=y

# Logs out the J-Link OB's VCOM (uart0) rather than RTT, for the same reason as
# the nRF5340 and nRF54L15 DK confs: RTT needs SEGGER's JLinkARM DLL, the VCOM
# is just a COM port. prj.conf turns the console off because a dongle has no
# use for one; a DK does.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
