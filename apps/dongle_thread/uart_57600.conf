# Pairs with uart_57600.overlay: the ANT UART at 57600 baud for Zwift through
# tools/zwift_shim. ant_uart_transport.c asserts this matches the overlay.
#
#   west build ... -- "-DEXTRA_CONF_FILE=gate.conf;uart_57600.conf"
#       -DEXTRA_DTC_OVERLAY_FILE=uart_57600.overlay

CONFIG_ANT_DONGLE_UART_BAUD=57600
