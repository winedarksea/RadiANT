#
# The multiprotocol plan's P3 coexistence gate, as a build.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=coex.conf"
#
# -DANT_RADIO=core IS NOT OPTIONAL AND IS NOT THE DEFAULT. The root build
# defaults to the sdk-ant radio, which leaves CONFIG_RADIANT=n - and then
# every RADIANT_* line below is dropped with an "unsatisfied dependencies:
# RADIANT (=n)" warning. Leaving it out here fails loudly only by accident
# (sdk-ant then fails to link for the wrong float ABI); on a board where it
# links, it would silently measure the sdk-ant stack instead of this one.
#
# This is the CONTENDED half of an A/B. The other half is the same image without
# this fragment: gate on, no second stack. Read both or neither - the question
# the gate answers is a difference between two images, never a property of one.
#
# WHY EVERY LINE IS HERE, because three of the four are silent-fallback traps
# this project has now paid for more than once:
#
#   - CONFIG_BT=y ALONE IS NOT A SECOND STACK. It links the SoftDevice
#     Controller in and leaves it asleep, asking MPSL for no air whatsoever.
#     Measured, and it produced a sweep-rate ratio of exactly 1.000 between
#     "BLE off" and "BLE on" - a gate that cannot fail. ANT_DONGLE_BLE_COEX_LOAD
#     is what makes the controller actually advertise; see its Kconfig help.
#   - CONFIG_BT=y also breaks the `!BT` half of RADIANT_BACKEND_NRF's
#     `depends on !BT || RADIANT_BACKEND_NRF_GATE_MPSL`, so without the
#     gate line below the whole radio backend silently becomes
#     RADIANT_BACKEND_NULL - an image that enumerates, answers the host,
#     and puts nothing on the air. That is not a bad measurement, it is a
#     measurement of nothing, and it reports EXIT=0.
#   - The gate itself is `select MPSL`, so nothing else needs turning on. It was
#     `depends on MPSL` once, which meant asking for the arbitrated build
#     without a second stack quietly compiled the DIRECT backend - i.e. the A of
#     this very A/B measured the wrong thing.
#
# ALWAYS CHECK THE GENERATED .config, NOT THE BUILD LOG. Every trap above ends
# in a warning among a hundred others and an exit code of 0:
#
#   Select-String build\<dir>\<app>\zephyr\.config `
#       -Pattern "^CONFIG_RADIANT_BACKEND_|^CONFIG_ANT_DONGLE_BLE_COEX_LOAD="
#
# EXEMPTION FROM THE W2 BLE POLICY (apps/hrm_ble/Kconfig,
# apps/treadmill/Kconfig): those two applications now redeclare
# BT_PERIPHERAL_PREF_MIN_INT/MAX_INT/LATENCY/TIMEOUT to 800/800/0/400 and
# fix le_param_req to enforce it, because THEY are the ANT+ side that needs
# BLE shaped down to 1 s. This file is the opposite instrument: it is the
# bench advertiser the gate is measured AGAINST, and its whole job is to be
# the adversarial neighbour those two applications defend against - see "The
# load itself" below for the deliberately-adversarial 100 ms advertising
# rate. Applying the 1 s policy here would tune the load down and understate
# every number the coexistence gate produces. Deliberately left off.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RadiANT coex load"

# Named rather than inherited. It is the default controller on a Nordic board,
# so this line changes nothing today - and it is the one fact that makes the
# plan's finding 1 true: the SoftDevice Controller is another MPSL user holding
# priority levels above anything an application timeslot request may ask for. A
# build that had silently fallen back to the Zephyr controller would be
# measuring a different arbitration, and every number would be optimistic.
#
# CONFIG_BT_CTLR is NOT a symbol to set - it is selected by the controller
# choice, and assigning it in v3.4.0 is a Kconfig warning that fails the build.
CONFIG_BT_LL_SOFTDEVICE=y

# The arbiter. See the second trap above: with CONFIG_BT=y and without this,
# the radio backend is silently the null one.
CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# The load itself, and its two levers.
#
# 100 ms is a common real-world connectable-advertising rate and is the
# adversarial-but-realistic middle of the Kconfig's range. It is also the exact
# setting under which acquisition was measured at placed=570 granted=2
# blocked=568 before the anchor re-bootstrap landed, so it is the setting that
# any claim about that fix has to be re-checked at.
CONFIG_ANT_DONGLE_BLE_COEX_LOAD=y
CONFIG_ANT_DONGLE_BLE_COEX_LOAD_INTERVAL_MS=100

# The load starts AFTER the host has had time to open a channel, on purpose:
# with it running from the first millisecond, "ANT+ never worked" and "ANT+
# stopped when BLE started" are the same observation. 8 s is the Kconfig
# default and is comfortably past enumeration and channel setup.
CONFIG_ANT_DONGLE_BLE_COEX_LOAD_DELAY_S=8
