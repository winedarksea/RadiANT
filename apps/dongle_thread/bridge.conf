# SPDX-License-Identifier: Apache-2.0
#
# The RadiANT bridge, as a build: ANT+ in, MQTT over Thread out.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=thread.conf;bridge.conf"
#
# ---------------------------------------------------------------------------
# THIS IS A SEPARATE FRAGMENT ON PURPOSE. DO NOT FOLD IT INTO thread.conf.
# ---------------------------------------------------------------------------
#
# CONFIG_NET_TCP is deliberately absent from thread.conf, which says why in its
# own words: flash the gate image does not need, plus air time the gate would
# then have to account for. docs/radiant-bridge.md section 7.4's coexistence
# numbers - the ones recorded in 7.4.2 as a PASS - were taken on a TCP-FREE
# IMAGE. An image with a TCP stack, a broker connection and a keepalive thread
# in it is a different image, and quoting 7.4's numbers against it would be
# quoting a measurement of something else.
#
# So: the gate arms (gate.conf, thread.conf, thread_sed.conf) stay TCP-free,
# this fragment layers on top of thread.conf for a bridge build, and a
# coexistence figure taken with this fragment on is its own measurement with
# its own row.

# ── The bus ────────────────────────────────────────────────────────────────
#
# Note what this brings with it: the linker fragment
# radiant/src/bridge/radiant_bridge_sections.ld, through
# zephyr_linker_sources() in CMakeLists.txt. Watch for "bridge: N sinks" in the
# boot log; N of 0 means every sink in the image is dead code and nothing
# downstream can work.
CONFIG_RADIANT_BRIDGE=y
CONFIG_ANT_DONGLE_RX_TAP=y

# ── Self-driving channels and the pairing window ───────────────────────────
#
# Two channels, taken from the top of the ANT allocation downward so a host
# library allocating from 0 upward collides last. Acquiring is not binding: a
# press of sw0 opens a 60 s window, and outside it an unbound device's
# broadcasts are dropped (section 10.1 rule 1, and section 5 - binding is
# explicit opt-in, never promiscuous).
CONFIG_ANT_DONGLE_SELF_CHANNELS=2
CONFIG_ANT_DONGLE_PAIRING_WINDOW_S=60

# ── MQTT ───────────────────────────────────────────────────────────────────
#
# TCP is the whole reason this fragment exists. NET_SOCKETS, NET_IPV6 and the
# OpenThread L2 come from thread.conf, which this is layered on top of.
CONFIG_NET_TCP=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n

CONFIG_ANT_DONGLE_MQTT_SINK=y

# A PLACEHOLDER, and it is certainly not your broker. Numeric IPv6 only:
# section 9.0a's DNS-SD discovery is deferred (it rests on two things nobody
# has verified on real hardware), so there is no resolver call in this build
# and a hostname here is an error rather than an unimplemented feature.
CONFIG_ANT_DONGLE_MQTT_BROKER="fd11:22::1"
CONFIG_ANT_DONGLE_MQTT_PORT=1883
CONFIG_ANT_DONGLE_MQTT_BRIDGE_ID="radiant0"

# CONFIG_NET_CONFIG_NEED_IPV6 IS DELIBERATELY ABSENT HERE TOO, and the reason
# is thread.conf's, unchanged: it blocks net_config_init() until the interface
# has an IPv6 address, before main(), for up to 30 s - measured at 31.04 s on
# an unattached MTD on this bench, reproducible to the tenth, and read as a
# hung board by a human and by ant_verify.py in the same session.
#
# src/mqtt_sink.c connects on its FIRST PUBLISH and never at boot, exactly the
# way src/thread_coex_load.c opens its socket. A connect that fails is retried
# on the next sample rather than being fatal.
#
# ONE CORRECTION TO thread.conf's WORDING, FOUND BY READING THIS BUILD'S OWN
# .config RATHER THAN THE FRAGMENTS. thread.conf says NET_CONFIG_NEED_IPV6 is
# "deliberately absent"; it is absent from that FILE, but it defaults to y once
# CONFIG_NET_CONFIG_SETTINGS and CONFIG_NET_IPV6 are both on, and this build's
# generated .config reads CONFIG_NET_CONFIG_NEED_IPV6=y. What actually prevents
# the 31 s stall is the line beside it - CONFIG_NET_CONFIG_INIT_TIMEOUT=0,
# which makes the wait return immediately.
#
# So the timeout is restated HERE rather than inherited, because it is the line
# that is load-bearing and a fragment layered on top of a different base must
# not lose it. Verified in build/p2_bridge/dongle_thread/zephyr/.config:
# NEED_IPV6=y, INIT_TIMEOUT=0.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# Buffers. The bridge adds a TCP connection, a 512 B MQTT tx buffer, a 256 B rx
# buffer and two threads to the OpenThread build's existing demand; thread.conf
# sizes the heap for OpenThread alone, so this raises it rather than discovering
# the shortfall as intermittent send failures that look like contention loss.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
