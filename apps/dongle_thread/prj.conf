# Board-specific settings live in boards/<board>.conf. The Thread/coexistence
# stack itself is opt-in through EXTRA_CONF_FILE (gate.conf, coex.conf,
# thread.conf, thread_sed.conf) rather than baked in here, so a plain
# `west build apps/dongle_thread` with no extra fragment is an ordinary
# ANT+-only dongle image - see scripts/build_p4.ps1 for how the bench arms
# turn the second stack on.

# The ANT stack settings - CONFIG_ANT, CONFIG_ANT_EVALUATION_KEY,
# CONFIG_ANT_TOTAL_CHANNELS_ALLOCATED and CONFIG_ANT_BURST_QUEUE_SIZE - are
# written by CMakeLists.txt into a generated fragment alongside the
# CONFIG_ANT_DONGLE_RADIO_* symbol naming the backend, same as apps/dongle.
# They name symbols that exist only when sdk-ant's Kconfig has been sourced,
# and it is CMake that decides whether that happens.

# Logging via RTT by default; a board's own boards/<board>.conf overrides
# this to a UART VCOM where RTT needs tooling the bench does not carry.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Heap and threads
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n

CONFIG_ANT_DONGLE_BCD_DEVICE=0x0100

# Ring buffer for USB RX data
CONFIG_RING_BUFFER=y

# GPIO for onboard LED activity signal
CONFIG_GPIO=y
