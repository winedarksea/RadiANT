# Bench only (assert 69:108): MPSL assumes 3000 us HFXO ramp-up.
# ON nRF54L15 THIS LINE ALONE DOES NOTHING: with CLOCK_CONTROL_NRF=y and an
# &hfxo node, nrf/subsys/mpsl/init/mpsl_init.c:456-457 passes the devicetree's
# hfxo startup-time-us to mpsl_clock_hfclk_latency_set() and ignores this
# symbol. Build with -DEXTRA_DTC_OVERLAY_FILE=arm_hfclk_latency.overlay too;
# this symbol's default is then 3000 as well, so the .config shows the arm.
CONFIG_MPSL_HFCLK_LATENCY=3000
