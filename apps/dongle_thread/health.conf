#
# The 0xF6 health counters on the bridge image, for a bench that wants the
# reading. Off by default, same as apps/dongle/health.conf. On an MPSL build
# this brings in CONFIG_RADIANT_SEARCH_COVERAGE, so the reply is 32 bytes and
# carries sets_advanced_uncovered at [30..31]; see tools/ant_health.py.

CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y
