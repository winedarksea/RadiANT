#
# Enable the 0xF6 health counters (MESG_RADIANT_HEALTH) on the TI dongle.
# Stacks on top of an arm fragment:
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_gate.conf;ti_health.conf"
#
# Read with tools/ant_health.py over the ANT UART. ANT_HEALTH_SCHED_DENIED is
# where an arm refused by RF_scheduleCmd() lands (synchronous EDENIED ->
# radiant_sched.c arm_failed() -> notify_done(DENIED)).
#
# CHECK THE GENERATED .config: CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y, plus the
# arm fragment's own symbols - a semicolon list that lost its second half
# builds cleanly without either.
CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y
