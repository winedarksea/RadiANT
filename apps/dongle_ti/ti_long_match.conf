#
# The A image of a cc26xx wildcard-search A/B (ADR 0022 on TI): the 24-bit
# hardware match, [A6 C5 devnum_lo], and the 128-set sweep (~33 s per pass).
# CONFIG_RADIANT_SEARCH_SHORT_MATCH defaults to y on cc26xx since 2026-11-12;
# this fragment turns it back off for comparison.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_long_match.conf"
#
# A fragment rather than a bare -D on the command line, which may not reach
# the image under sysbuild. On this radio the setting changes EVERY hardware
# match, tracking windows too (formatConf.nSwBits is fixed per RF_open()).
#
# Check the generated .config, not the build log:
#
#   Select-String build\<dir>\dongle_ti\zephyr\.config -Pattern "SHORT_MATCH|BACKEND_CC26XX="
#
# Expect CONFIG_RADIANT_BACKEND_CC26XX=y and the short match "is not set".

CONFIG_RADIANT_SEARCH_SHORT_MATCH=n
