# Bring-up fragment for a TI board with no console but a debugger.
#
# WHAT THIS IS FOR, precisely. prj.conf sets CONFIG_RESET_ON_FATAL_ERROR=y,
# which is right for a shipped dongle and actively hostile during first
# bring-up on a board whose only console is a RAM buffer:
#
#   * The reset re-zeroes BSS, and the RTT control block lives in BSS. So the
#     fault message that CONFIG_LOG_MODE_IMMEDIATE just wrote is erased by the
#     reset that the fault caused, and scripts/ti/rtt_dump.ps1 reports an
#     uninitialised control block - which reads as "the image never started".
#   * A board resetting every few milliseconds cannot be halted. The ICEPick
#     still scans, so `dslite --list-cores` succeeds and the probe looks
#     healthy, while every DSS halt returns "Unable to access the DAP ... try
#     more reliable JTAG settings", twenty times over. That message points at
#     the probe, the wiring and the clock speed. It is none of those.
#
# Together those two produce a board that is loudly failing and presents as a
# board that is silently dead, with the diagnostic pointing at the debug rig.
# This fragment breaks that: a fault parks the core in the fatal handler, where
# the DAP answers, the RTT buffer still holds the dump, and
# scripts/ti/dss_alive.js can read CFSR/HFSR off a core that stayed put.
#
#   west build ... -- -DEXTRA_CONF_FILE=ti_bringup.conf
#   .\scripts\ti\rtt_dump.ps1
#
# NOT for anything that gets flashed and left. A dongle that hangs forever on a
# transient fault is worse than one that reboots.
CONFIG_RESET_ON_FATAL_ERROR=n

# Say something unconditionally, at the earliest point Zephyr can. Every log
# line in this application comes from main() or later, so an image that dies in
# a PRE_KERNEL driver init produces an empty buffer that is indistinguishable
# from an image that never ran at all - the exact ambiguity this fragment
# exists to remove. The banner is printed by the kernel before main() and costs
# a few hundred bytes.
CONFIG_BOOT_BANNER=y
CONFIG_EARLY_CONSOLE=y
