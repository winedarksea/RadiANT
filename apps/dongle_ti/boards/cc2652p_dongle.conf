# CC2652P + CP2102N USB dongle - the deployment target apps/dongle_ti was
# always written for. The LaunchXL arm exists to prove the port on a board with
# a debugger, a backchannel UART and LEDs whose positions are documented; this
# is the sealed stick it stands in for.
#
#   . .\scripts\env.ps1 -NcsVersion v3.4.0
#   .\scripts\fetch_hal_ti.ps1                 (once - NCS filters hal_ti out)
#   west build -s apps/dongle_ti -b cc2652p_dongle -- `
#       -DBOARD_ROOT=<repo> -DANT_RADIO=core -DRADIANT_BACKEND=cc26xx `
#       -DEXTRA_ZEPHYR_MODULES=C:/ncs/v3.4.0/modules/hal/ti
#
# Flash with scripts\flash_ti.ps1 -Ccxml scripts\ti\cc2652p_dongle.ccxml.
# THERE IS NO OTHER WAY IN. The ROM serial bootloader listens on DIO2/DIO3,
# fixed in silicon, and this module's bridge is on DIO12/DIO13 - so the JTAG
# rig is not the convenient route, it is the only route. See the board's
# devicetree header.

CONFIG_ANT_DONGLE_TRANSPORT_UART=y

# ── The log goes to RTT, because there is nowhere else for it to go ─────────
#
# THIS IS THE ONE PLACE THIS BOARD DIFFERS FROM THE LAUNCHXL IN KIND rather
# than in pin numbers, so it is worth being explicit.
#
# The LaunchXL's rule is "uart0 carries ANT, uart1 carries the log", and its
# .conf turns RTT OFF on the grounds that SEGGER's RTT needs a J-Link and this
# bench's TI probe is an XDS110. That reasoning is half right and the half that
# is wrong matters here: RTT is nothing but a ring buffer in RAM with a
# findable signature. A J-Link is needed to read it WITH SEGGER'S OWN TOOLS -
# it is not needed to read RAM. The XDS110 reads RAM perfectly well through
# DebugServer Scripting, which is how this board's part number, CCFG and entire
# pin map were recovered in the first place.
#
# And on this board there is no alternative to weigh it against. uart1's pins
# are inside a sealed USB shell, so a log on uart1 is a log nobody can ever
# read; a log on uart0 corrupts the ANT stream, which is the exact failure the
# LaunchXL's separation exists to prevent. RTT is the only port left.
#
# Read it with scripts\ti\rtt_dump.ps1, which needs no USB connection to the
# dongle at all - only the XDS110 wiring that flashed it. That property is why
# bring-up on this board is not blind.
CONFIG_SERIAL=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y

# Console OFF the UART, hard. uart0 is the ANT stream and the overlay beside
# this file deletes the chosen console property to match; this is the symbol
# that actually stops the console driver binding to a UART.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Immediate logging, for the same reason the LaunchXL arm sets it and with more
# force here: deferred logging turns a stack overflow into a board that simply
# goes quiet, because the fault message needs a log thread that no longer
# exists. That has already cost this project a session on the MPSL gate. This
# is a first bring-up on a board with no console at all unless a debugger is
# attached, which is precisely where an unexplained silence is most expensive.
CONFIG_LOG_MODE_IMMEDIATE=y

# Name the threads. On the first window the cc26xx backend ever ran, the
# LaunchXL reset inside the completion path and the dump said
# "Current thread: 0x200025e8 (unknown)" - and "(unknown)" cost an hour of
# guessing at three plausible stacks, none of which was the one. See
# boards/cc26x2r1_launchxl.conf for the whole story.
CONFIG_THREAD_NAME=y
