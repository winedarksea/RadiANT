#
# The 0xF7 diagnostic pages (MESG_RADIANT_DIAG, ADR 0023) on the TI dongle.
# Needs the 0xF6 health counters too, so stack it after ti_health.conf:
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_health.conf;ti_diag.conf"
#
# Read with tools/ant_diag.py --port COM11 --baud 57600. A bench build: the
# counters cost a few increments on the radio paths and nothing on the wire
# unless asked.
#
# CHECK THE GENERATED .config: CONFIG_ANT_DONGLE_DIAG=y and
# CONFIG_RADIANT_DIAG_COUNTERS=y.
CONFIG_ANT_DONGLE_DIAG=y
