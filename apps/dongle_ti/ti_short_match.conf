#
# The B image of the cc26xx wildcard-search A/B (ADR 0022 on TI): the search
# matches [A6 C5] in hardware and takes devnum_lo from the first payload byte,
# so the sweep is ONE set instead of 128 (~33 s per pass).
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=cc26xx" \
#               "-DEXTRA_ZEPHYR_MODULES=<hal_ti path>" \
#               "-DEXTRA_CONF_FILE=ti_short_match.conf"
#
# A fragment rather than a bare -DCONFIG_RADIANT_SEARCH_SHORT_MATCH=y on the
# command line, which may not reach the image under sysbuild.
#
# ON THIS RADIO IT SHORTENS EVERY HARDWARE MATCH, TRACKING TOO.
# formatConf.nSwBits is fixed per RF_open(), so the sync word is 16 bits for
# every window, and a tracking window compares three address bytes in software
# (two in the A image). That is the cost the A/B measures: read
# radiant_cc26xx_sw_addr_mismatch / radiant_cc26xx_sync_frames over JTAG (by
# address from arm-zephyr-eabi-nm on the ELF) in both images.
#
# CHECK THE GENERATED .config, NOT THE BUILD LOG:
#
#   Select-String build\<dir>\dongle_ti\zephyr\.config -Pattern "SHORT_MATCH|BACKEND_CC26XX="
#
# Expect CONFIG_RADIANT_BACKEND_CC26XX=y and CONFIG_RADIANT_SEARCH_SHORT_MATCH=y.

CONFIG_RADIANT_SEARCH_SHORT_MATCH=y
