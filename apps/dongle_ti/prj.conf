# Board-specific settings live in boards/cc26x2r1_launchxl.conf: which UART
# carries ANT and which carries the log, RTT off (no J-Link on this probe),
# immediate logging so a fault message survives a stack overflow, and thread
# naming so a fault dump names the thread that overflowed.

# The ANT stack settings are written by CMakeLists.txt into a generated
# fragment alongside the CONFIG_ANT_DONGLE_RADIO_* symbol naming the backend,
# same as every other RadiANT application - they name symbols that exist only
# once CMake has decided which Kconfig tree (sdk-ant's, or none) gets sourced.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Heap and threads
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y

CONFIG_SHELL=n

# Ring buffer for the serial bridge's RX path
CONFIG_RING_BUFFER=y

# The boot reset cause - see apps/dongle/prj.conf. On this dongle it is what
# the boot STARTUP reports to a host whose CP2102N handle survived the reboot.
CONFIG_HWINFO=y

# CRC repair, on as in apps/dongle/prj.conf (owner acceptance, 2026-11-15; the
# cc26xx on-air run is archive/benchmarks/2026-11-13-ti-crc-repair/).
# PROFILE_SANITY is the third refutation for a repaired frame and travels with
# it. Counters on 0xF7 page 10 of a diagnostic build. See radiant/Kconfig.
CONFIG_RADIANT_CRC_REPAIR=y
CONFIG_RADIANT_PROFILE_SANITY=y

# The hot files at -O2, as in apps/dongle/prj.conf (owner ruling 2026-11-16;
# Pro Micro page 9 [5] 289 us at -Os, 255 us at -O2, budget 240 us). On this
# board that is radiant_sched.c, ant_api/radiant_ant.c and
# radiant_radio_cc26xx.c. See radiant/Kconfig.
CONFIG_RADIANT_HOT_PATH_O2=y
