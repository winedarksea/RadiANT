# Board-specific settings live in boards/cc26x2r1_launchxl.conf: which UART
# carries ANT and which carries the log, RTT off (no J-Link on this probe),
# immediate logging so a fault message survives a stack overflow, and thread
# naming so a fault dump names the thread that overflowed.

# The ANT stack settings are written by CMakeLists.txt into a generated
# fragment alongside the CONFIG_ANT_DONGLE_RADIO_* symbol naming the backend,
# same as every other RadiANT application - they name symbols that exist only
# once CMake has decided which Kconfig tree (sdk-ant's, or none) gets sourced.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Heap and threads
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y

CONFIG_SHELL=n

# Ring buffer for the serial bridge's RX path
CONFIG_RING_BUFFER=y
