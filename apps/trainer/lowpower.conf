#
# The trainer with the nRF backend's HFXO/timebase release (power plan Track B,
# CONFIG_RADIANT_NRF_LOW_POWER), for the follow-on regression gate G2: the FE-C
# master's reply window, its ACK and inbound bursts must still land with the
# crystal released between slots. Needs the LF crystal (the nRF54L15 DK has
# one); the shell console stays on, because tools/fec_ack_sweep.py drives it.
#
#   west build -b nrf54l15dk/nrf54l15/cpuapp apps/trainer -- \
#       -DRADIANT_BACKEND=nrf -DEXTRA_CONF_FILE=lowpower.conf
#
# EXPERIMENTAL, as the option itself.

CONFIG_RADIANT_NRF_LOW_POWER=y
