# RadiANT trainer simulator.
#
# Like apps/treadmill: no USB, no serial bridge. Unlike it: a shell on the
# console, because the shell is how the fault model is driven.

CONFIG_TRAINER=y

# radiant and its antr_* adapter. The backend comes from -DRADIANT_BACKEND via
# the fragment CMakeLists.txt generates.
CONFIG_RADIANT=y
CONFIG_RADIANT_ANTR_API=y

# THE INSTRUMENT. Test images only - radiant/Kconfig's help says so, and CI
# asserts the opposite on every dongle. CMakeLists.txt refuses a build that
# loses it.
CONFIG_RADIANT_ACK_FAULTS=y

# The identity record, as the treadmill has it (node_ident needs RADIANT_SEC).
CONFIG_RADIANT_SEC=y
CONFIG_RADIANT_NODE_IDENT=y
CONFIG_RADIANT_NODE_NVM_SETTINGS=y
# But NOT first-boot provisioning (ADR 0020): this is the bench fixture, and
# tools/fec_ack_sweep.py addresses it by CONFIG_TRAINER_DEVICE_NUMBER. Stated
# here even though no entropy backend is selected (so the symbol is off by
# dependency anyway), so that adding one later does not move the fixture.
CONFIG_RADIANT_NODE_IDENT_SELF_PROVISION=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

# The physics is single-precision float. FPU on the M33/M4F, so the solver's
# 40 halvings are microseconds on the workqueue.
CONFIG_FPU=y

# The console, the shell and the log share the DK's first VCOM. The log goes
# THROUGH the shell's backend rather than beside it, so a log line can never
# land in the middle of an `ackfault dump` record line.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
# Plain text for a machine on the other end: no colour escapes, and room for
# an `ackfault set` with every parameter on one line.
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_STACK_SIZE=3072

# See apps/treadmill/prj.conf: the boot burst overflows a 1024-byte ring and
# the banner is what gets dropped.
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
