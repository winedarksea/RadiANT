# ANT+ sensor simulator.
#
# Nothing here is shared with the dongle's prj.conf on purpose. This build has
# no USB, no serial bridge and no partition-manager constraints; it is a
# sensor, and the only thing the two applications have in common is the radio.

CONFIG_ANT=y

# The evaluation licence key for the ANT stack on single-core parts. This is
# the stack's *licence*, not the ANT+ *network* key - a different thing that
# ant_plus_key_set() supplies at runtime, and confusing the two produces a
# build that runs happily and is never heard by anything.
#
# A product shipped with this would need a commercial key:
# https://www.thisisant.com/developer/ant/licensing
CONFIG_ANT_EVALUATION_KEY=y

CONFIG_NCS_SAMPLES_DEFAULTS=y

# Logs out the DK's first VCOM (COM7 on the nRF54L15 DK here; COM8 is where the
# dongle's UART transport lives, so the two boards do not collide). Not RTT:
# RTT needs SEGGER's JLinkARM DLL installed, whereas the VCOM is a plain COM
# port carried by the cable that already programs the board.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# The ±target buttons and the channel-state LEDs. Both are genuinely useful on
# a bench transmitter: the LED says whether the channel came up, which is the
# first question when the receiver hears nothing.
CONFIG_DK_LIBRARY=y

CONFIG_HEAP_MEM_POOL_SIZE=4096

# Halt on a fault rather than rebooting into it. A sensor that resets in a loop
# still transmits between resets, which reads as an intermittent radio fault
# from the receiving end - the most expensive kind of symptom to chase.
CONFIG_RESET_ON_FATAL_ERROR=n
