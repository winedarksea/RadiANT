#
# nRF5340 DK, APPLICATION core - the P3.5 traffic generator.
#
# THERE IS NO RADIO ON THIS CORE. nrf5340_cpuapp has no `radio` node at all;
# the peripheral exists only on the network core. So NRF_802154_RADIO_DRIVER is
# unsatisfiable here (it `depends on HAS_HW_NRF_RADIO_IEEE802154`) and the
# driver has to be reached over IPC instead: this core runs the Spinel HOST,
# the network core runs `ipc_radio`, and the nrf_802154_* API is identical on
# both sides - which is the whole point of the serialisation and the reason
# src/main.c needs not one line of conditional code.
#
# Build it as:
#
#   west ... -b nrf5340dk/nrf5340/cpuapp --sysbuild -- \
#       "-DCONFIG_COEX154_ROLE_TX=y" \
#       "-DSB_CONFIG_NETCORE_IPC_RADIO=y" \
#       "-DSB_CONFIG_NETCORE_IPC_RADIO_IEEE802154=y"
#
# ---------------------------------------------------------------------------
# WHY NOT JUST BUILD FOR cpunet DIRECTLY, WHICH IS SIMPLER AND WAS TRIED FIRST
# ---------------------------------------------------------------------------
#
# It builds, it flashes, and it is unobservable. The network core has no VCOM
# on this DK - the debugger's two serial ports both belong to cpuapp - so a
# generator that runs there prints nowhere. When it produced no frames the
# receiver could hear, there was no way to tell "the core is held in reset"
# from "the core is running and the transmit is failing", and the flash order
# (net core first, then app core so its reset releases NETWORK.FORCEOFF) plus
# nrf/samples/nrf5340/empty_app_core with SOC_NRF53_CPUNET_ENABLE=y did not
# resolve it either way.
#
# A traffic generator whose own transmit count cannot be read is not a
# reference. The whole loss figure is "what the DUT heard divided by what was
# SENT", and the denominator has to come from somewhere. So the generator moves
# to the core with the console, and pays an IPC hop for it - which costs
# latency it does not care about and nothing else, because it transmits on a
# 20 ms timer rather than to a deadline.

CONFIG_NRF_802154_SER_HOST=y

# The IPC transport the serialisation rides on. Selected by
# NRF_802154_SERIALIZATION, named here so a build that lost them fails loudly.
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
