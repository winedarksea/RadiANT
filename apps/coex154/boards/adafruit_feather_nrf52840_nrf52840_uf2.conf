#
# Feather nRF52840 - the P3.5 traffic generator.
#
# Single core, RADIO on it, 802.15.4 in the silicon. That is the whole reason it
# is here rather than the nRF5340 DK, whose RADIO lives on a network core with
# no VCOM behind it.
#
# Flashed with scripts\flash_uf2.ps1 - no debugger, a UF2 bootloader.
#
# ---------------------------------------------------------------------------
# NO CONSOLE, AND IT COSTS NOTHING, WHICH IS WORTH BEING EXPLICIT ABOUT
# ---------------------------------------------------------------------------
#
# This board's only wire is USB, so a log would have to go out a CDC ACM - and
# enabling the legacy USB_DEVICE_STACK beside the board's default device_next
# is a link error (two definitions of the same cdc_acm device), while doing it
# properly means bringing up usbd from the application.
#
# None of that is needed, because the loss arithmetic does not depend on it.
# src/main.c computes the denominator from the SEQUENCE NUMBERS IN THE FRAMES:
#
#     span = last_seq - first_seq + 1
#
# over the counters the receiver actually saw. The generator's own opinion of
# how many it sent is a cross-check, not the measurement, and it was never the
# thing the arithmetic rested on. What the generator has to be is TRANSMITTING,
# and the receiver hearing it says so more directly than a log would.
#
# The 5340 was a different case: there the question was whether the core was
# running AT ALL, and with no console there was no way to tell that from a core
# that was running and failing to transmit. Here the board boots from a
# bootloader that is known good and the first thing it does is transmit.

CONFIG_NRF_802154_RADIO_DRIVER=y

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
