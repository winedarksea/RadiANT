# Phase 5: add the ANT+ heart-rate slave, a THIRD channel.
#
#   -Dtreadmill_EXTRA_CONF_FILE="ble.conf;hr_rx.conf"
#
# Layered on top of whatever else is being built, and the semicolon-list form is
# the one already used elsewhere in this tree for exactly that.
#
# WHAT IT ADDS TO THE RADIO. Two masters transmitting, one slave tracking, and
# possibly a BLE connection - which is the heaviest configuration this
# application has. The slave acquires ONCE and then stops searching, because a
# tracking slave beside two masters is benign and an acquisition sweep beside
# them is what starves the arbiter (ADR 0013). src/treadmill_hr_rx.h explains
# what "strongest strap wins" actually means here, which is a proximity floor
# rather than a sweep, and is honest about the difference.
#
# WHAT IT BUYS. The bpm reaches three consumers from one strap: FE-C page 16
# byte 6 with the HR-source nibble set to ANT+, the FTMS Treadmill Data
# heart-rate field, and a console display when one exists. There is no display
# code in this tree and none is proposed.
CONFIG_TREADMILL_HR_RX=y
