# One ANT+ master instead of two: FE-C only, no SDM.
#
#   -Dtreadmill_EXTRA_CONF_FILE=fec_only.conf
#
# THE COEXISTENCE FALLBACK, BUILT BEFORE IT IS NEEDED.
#
# Two ANT+ masters plus BLE on one radio is more contention than anything this
# project has measured. The arbiter has been characterised with ONE master
# beside BLE (P8b) and with EIGHT masters beside 802.15.4 (P3.5), but never
# this mix - and the two periods, 8192 and 8134 counts, beat against each other
# with a period of about 32 seconds. If they interact badly the symptom is a
# slow cycle of loss on both channels rather than a steady figure, which is
# exactly the kind of number a short bench run reads as noise.
#
# So this fragment exists to answer "is it the second master?" in one build
# rather than in an afternoon of editing Kconfig. It is not a shipping
# configuration: FE-C alone is invisible to anything that only knows foot pods,
# which includes Zwift Run and most watches.
CONFIG_TREADMILL_ANT_SDM=n
