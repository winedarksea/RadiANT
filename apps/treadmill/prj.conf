# RadiANT treadmill node.
#
# Nothing here is shared with the dongle's prj.conf, for the same reason
# apps/hrm_ble says it: this build has no USB, no serial bridge and no
# partition-manager constraints. It is fitness equipment. What it does share is
# the whole radio stack, because that is the point of the application.

CONFIG_TREADMILL=y

# radiant and its antr_* adapter. The backend itself comes from
# -DRADIANT_BACKEND via the generated fragment in CMakeLists.txt, so a
# null-radio build is a deliberate choice rather than a default nobody noticed.
CONFIG_RADIANT=y
CONFIG_RADIANT_ANTR_API=y

# The identity record and its storage. ADR 0009 makes the device number a
# property of the node rather than of the image.
#
# RADIANT_SEC is not optional here and not a feature choice: src/node/Kconfig
# says `depends on RADIANT_SEC` because everything in node_ident derives keys,
# down to the boot counter's epoch.
CONFIG_RADIANT_SEC=y
CONFIG_RADIANT_NODE_IDENT=y
CONFIG_RADIANT_NODE_NVM_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

# THE CONTROL PATH NEEDS ACKNOWLEDGED DATA IN BOTH DIRECTIONS. FE-C's control
# pages 48-51 arrive as acknowledged messages into a channel this node is the
# MASTER of, which is not the usual direction. radiant/src/radiant_burst.c
# refuses at config time any backend that cannot acknowledge - loudly, which is
# the right behaviour - so this is worth knowing before the first control page
# rather than at it.

# Logs out the DK's first VCOM. Not RTT: RTT needs SEGGER's JLinkARM DLL
# installed, whereas the VCOM is carried by the cable that already programs the
# board.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# Halt on a fault rather than rebooting into it. A machine that resets in a loop
# still transmits between resets, which reads as an intermittent radio fault
# from the receiving end - the most expensive kind of symptom to chase, and one
# this project has already paid for twice.
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
