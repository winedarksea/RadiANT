# Compile NO implementation of the treadmill seam - the integrator's starting
# point.
#
#   -Dtreadmill_EXTRA_CONF_FILE=source_custom.conf
#
# A fragment rather than a bare -DCONFIG_ for the reason ble.conf gives: under
# sysbuild a bare -DCONFIG_x lands in the sysbuild cache and never reaches the
# image.
#
# WHAT THIS BUILD DOES. It links - which is the whole reason it is in CI, since
# an integrator's very first build failing for a reason unrelated to their
# driver is an expensive way to start - and at boot it warns, then
# treadmill_source_start() returns -ENODEV and the node reports a stopped belt
# at zero grade in the READY state, forever, on both ANT+ channels.
#
# THAT IS THE CORRECT FAILURE AND IT IS NOT A BUG. There is deliberately no
# fallback to the simulator: a machine quietly reporting a synthetic runner
# while somebody stands on it is invisible from the receiving end, and one
# reporting a stopped belt is not. On a gym dashboard it reads as "unoccupied",
# which is the safe direction to be wrong in.
#
# Your code calls treadmill_source_register() from a SYS_INIT() before main()
# reaches treadmill_source_start(); see src/treadmill_source.h,
# src/treadmill_source_custom.c and docs/treadmill-reference-design.md.
CONFIG_TREADMILL_SOURCE_CUSTOM=y
