# FTMS + RSC on top of the ANT+ node build.
#
# Passed IMAGE-SCOPED:
#
#   -Dtreadmill_EXTRA_CONF_FILE=ble.conf
#
# THE PREFIX IS THE BASENAME OF THE APPLICATION DIRECTORY, and getting it wrong
# is silent. Sysbuild derives an image's name from the basename of APP_DIR, so a
# flag naming an image that does not exist is accepted with nothing beyond
# CMake's end-of-run "manually-specified variables were not used" warning, and
# the BLE image builds green with no BLE in it. apps/hrm_ble shipped exactly
# that no-op after a directory rename and MEASURED it: two builds, one with the
# flag and one without, produced byte-identical .config files.
#
# A plain -DEXTRA_CONF_FILE= is no better: it lands in the sysbuild cache and
# never reaches the image at all. .github/workflows/release.yml's build-treadmill
# job asserts the resulting .config for exactly this reason - a build-only check
# passes the no-op without noticing.

CONFIG_TREADMILL_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# THE CONTROL POINT REQUIRES ENCRYPTION, so this build pairs and bonds.
#
# FTMS v1.0 Table 4.1 gives the Fitness Machine Control Point security
# permission "Encryption", and src/treadmill_ble.c puts BT_GATT_PERM_WRITE_ENCRYPT
# on the attribute accordingly. CONFIG_BT_SMP is `select`ed by
# CONFIG_TREADMILL_BLE rather than set here, so it cannot be lost by editing
# this file; the storage below is what makes a bond survive a power cycle.
#
# WITHOUT THE BOND STORE the machine still works and every power cycle costs the
# user a re-pair, which on a gym floor is worse than it sounds: a phone that
# remembers a bond the machine has forgotten fails to encrypt and reports the
# machine as broken rather than as unpaired.
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4

# NCS's Running Speed and Cadence service. `select`ed by CONFIG_TREADMILL_BLE
# as well - noted here because CONFIG_BT_RSCS=y PUBLISHES THE SERVICE WHETHER OR
# NOT bt_rscs_init() IS CALLED (rscs.c uses a static BT_GATT_SERVICE_DEFINE), so
# a build that enabled the symbol and skipped the init would advertise a service
# whose features and location are whatever zeroed memory says.
# src/treadmill_ble.c fails loudly if the init fails, which is this repository's
# house answer to that shape of problem.
#
# It also publishes Sensor Location (0x2A5D) and SC Control Point (0x2A55)
# whether a treadmill wants them or not. Nothing can be done about that from
# here and it is harmless; it is written down so a scan list is not a surprise.

# The name a phone, Zwift or a BLE scanner shows. IT IS IN THE SCAN RESPONSE,
# not the advertisement: the advertising payload is already 16 bytes of flags,
# a two-UUID16 list and the FTMS Service Data element, leaving 13 for a name -
# too few for a machine name anybody would choose. src/treadmill_ble.c
# BUILD_ASSERTs the 29-character scan-response budget.
#
# NO TRADEMARKED DEFAULT, and that is a decision rather than an oversight:
# docs/decisions/0003 is the home for it and ADR 0017 amends it here. Some apps
# key compatibility off a device name, which makes a plausible-looking default
# an invitation to impersonate somebody's product. An end user renaming their
# own machine on their own initiative is a different act entirely.
CONFIG_BT_DEVICE_NAME="RadiANT Treadmill"

# NOT SET HERE, and their absence is the point:
#
#   CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
#   CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
#
# Both are a `select` and a `default` on TREADMILL_BLE in apps/treadmill/Kconfig,
# so turning the BLE branch on carries them with it however it is turned on.
# CMakeLists.txt keeps a FATAL_ERROR backstop for the same interlock approached
# from the other side (CONFIG_BT set without CONFIG_TREADMILL_BLE).
