#
# The named dual-radio preset: ANT+ FE-C (0x11) and SDM (0x7C) with FTMS and
# RSC over BLE, and strict product identity. The build a manufacturer ships,
# once a product .conf supplies the identity:
#
#   west build -b <board> apps/treadmill -- \
#     -Dtreadmill_EXTRA_CONF_FILE="dual.conf;product.conf"
#
# (product.conf is your copy of product.conf.example.) THE PREFIX IS THE
# BASENAME OF THIS DIRECTORY - see ble.conf.
#
# ON ITS OWN THIS PRESET FAILS TO CONFIGURE, ON PURPOSE.
# CONFIG_RADIANT_PRODUCT_STRICT refuses the placeholder identity at configure
# time, and at run time a machine whose identity fails to boot stays off the
# air and retries instead of transmitting on the device number every machine
# of the image shares - which in a gym is twenty treadmills a receiver cannot
# tell apart. scripts/build_all.ps1's tread_dual_fail row asserts the
# refusal; tread_dual_* rows build it with tests/product_test.conf.
#
# The BLE lines are ble.conf's (ble.conf is the development variant, without
# strict identity): TREADMILL_BLE selects RADIANT_BLE, SMP and the MPSL gate;
# bonds persist in settings.

CONFIG_TREADMILL_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_RADIANT_PRODUCT_STRICT=y
