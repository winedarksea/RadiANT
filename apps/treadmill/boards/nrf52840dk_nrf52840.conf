# nRF52840 DK, as a RadiANT treadmill node.
#
# The other half of the overlay's `zephyr,entropy = &rng`, for the reason
# apps/hrm_ble/boards/nrf52840dk_nrf52840.conf gives: without this the
# CryptoCell entropy driver is still built for the enabled cryptocell node and
# links CryptoCell's platform library for a driver nothing calls (~6.7 KB of
# flash and ~1.9 KB of RAM, measured on hrm_ble).
CONFIG_ENTROPY_CC3XX=n
