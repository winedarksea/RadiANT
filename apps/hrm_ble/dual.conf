#
# The named dual-radio preset: ANT+ heart rate (0x78) and the BLE side
# together, with strict product identity. The build a manufacturer ships,
# once a product .conf supplies the identity:
#
#   west build -b <board> apps/hrm_ble -- \
#     -Dhrm_ble_EXTRA_CONF_FILE="dual.conf;product.conf"
#
# (product.conf is your copy of product.conf.example.) THE PREFIX IS THE
# BASENAME OF THIS DIRECTORY - see ble.conf for why a wrong one is silent.
#
# ON ITS OWN THIS PRESET FAILS TO CONFIGURE, ON PURPOSE.
# CONFIG_RADIANT_PRODUCT_STRICT refuses the placeholder identity (manufacturer
# id 255, placeholder names) at configure time, and at run time a node whose
# identity fails to boot stays off the air and retries instead of transmitting
# on the device number every unit of the image shares.
# scripts/build_all.ps1's hrm_dual_fail row asserts the refusal;
# hrm_dual_* rows build it with tests/product_test.conf.
#
# What the BLE half is: HRM_BLE_HRS, which selects RADIANT_BLE (advertising
# lifecycle, connection-parameter policy, Device Information Service from
# radiant_product) and the MPSL gate. ble.conf is the development variant of
# the same thing, without strict identity.

CONFIG_HRM_BLE_HRS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_RADIANT_PRODUCT_STRICT=y
