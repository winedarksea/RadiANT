# Compile the seam's second implementation instead of the simulator.
#
#   -Dhrm_ble_EXTRA_CONF_FILE=sensor_example.conf
#
# A FRAGMENT AND NOT A BARE -DCONFIG_HRM_SENSOR_EXAMPLE=y, for the same reason
# ble.conf is image-scoped: under sysbuild a bare -DCONFIG_x lands in the
# sysbuild cache and never reaches the image. It is accepted, it warns about
# nothing, and the build compiles the simulator - which is precisely the class
# of silent no-op this application already shipped once (see ble.conf).
#
# src/hrm_sensor_example.c is a worked example of a driver that reports beats
# from interrupt context. It has no front end in it and is not shippable; read
# its header before copying it.
CONFIG_HRM_SENSOR_EXAMPLE=y
