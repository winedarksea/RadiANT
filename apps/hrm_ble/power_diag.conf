#
# The software power proxy with its log line, as radiant/samples/
# hr_transmitter/power_diag.conf. Image-scoped, after the fragments it
# measures:
#
#   -Dhrm_ble_EXTRA_CONF_FILE="ble.conf;lowpower.conf;power_diag.conf"
#
# Every 10 s the log prints one "power dt_ms=... hfxo_pm=..." line; the same
# counters are in radiant_power_diag, and with lowpower.conf the low-power
# path's own counters (CONFIG_RADIANT_NRF_LP_STATS, on by default with this)
# are in radiant_nrf_lp_stats, read over SWD by symbol. On the MPSL build
# hfxo_pm is only the backend's own request (boot, then none); the duty proxy
# there is radiant_nrf_lp_stats.slot_awake_us. Every number is a proxy, not a
# current measurement, and the console UART costs current of its own.

CONFIG_RADIANT_POWER_DIAG=y
CONFIG_RADIANT_POWER_DIAG_LOG_S=10

# CPU time and idle entries (the wake rate) come through Zephyr's user tracing
# hooks. A Kconfig choice member cannot be selected, so they are set here.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
