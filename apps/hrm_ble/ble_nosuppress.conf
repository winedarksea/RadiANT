# Layered ON TOP OF ble.conf, never instead of it:
#
#   -Dhrm_ble_EXTRA_CONF_FILE="ble.conf;ble_nosuppress.conf"
#
# A fragment rather than a `-DCONFIG_...=n` on the command line, for the same
# reason ble.conf is image-scoped: under sysbuild a bare -DCONFIG_x lands in the
# sysbuild cache and never reaches the image, exactly as a bare
# -DEXTRA_CONF_FILE does. The semicolon-list form is the one already used for
# the P4 SED arm (thread.conf;thread_sed.conf).
#
# WHAT THIS IS FOR. With HRM_SUPPRESS_ANT_WHEN_CONNECTED=y - the default - the
# node stops transmitting ANT+ for the duration of a BLE connection, so the two
# stacks never genuinely contend and MPSL is never asked to arbitrate anything.
# That default is right for a shipping strap and useless as a test: it is the
# configuration in which the timeslot code cannot fail.
#
# Turning it off is what puts a 4.06 Hz ANT+ transmit obligation and a live BLE
# connection on one radio at the same time, which is the case the gate exists
# for. Kconfig's own help text for the symbol says as much.
CONFIG_HRM_SUPPRESS_ANT_WHEN_CONNECTED=n
