# P8b: enable the BLE HRS branch on top of the ANT+ node build.
#
# Was strap_ble.conf. Passed IMAGE-SCOPED:
#
#   -Dhrm_ble_EXTRA_CONF_FILE=ble.conf
#
# THE PREFIX IS THE BASENAME OF THE APPLICATION DIRECTORY, and getting it wrong
# is silent. Sysbuild derives an image's name from the basename of APP_DIR, so
# while this directory was strap/ the flag was `-Dstrap_EXTRA_CONF_FILE=`. After
# the rename that flag named an image that does not exist: CMake said nothing
# beyond its end-of-run "manually-specified variables were not used" warning,
# and the BLE image built green with no BLE in it. Measured - two builds, one
# with the flag and one without, produced byte-identical .config files (the
# with-flag one recording `# CONFIG_BT is not set`), which is what proves it was
# a total no-op rather than a partial one.
#
# A plain -DEXTRA_CONF_FILE= is no better: it lands in the sysbuild cache and
# never reaches the image at all. .github/workflows/release.yml's build-node job
# asserts the resulting .config for exactly this reason - a build-only check
# passes the no-op without noticing.

CONFIG_HRM_BLE_HRS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# The name a phone, Zwift, or a BLE scanner shows for this node. It is a
# simulated heart rate monitor, so it is named as one - "RadiANT HR", not
# "RadiANT Strap". src/hrm_ble.c puts this same string in the advertising
# payload (BT_DATA_NAME_COMPLETE), so it is visible in a scan list without
# connecting first, and BUILD_ASSERTs the 22-character budget it has to fit.
CONFIG_BT_DEVICE_NAME="RadiANT HR"

# NOT SET HERE ANY MORE, and their absence is the point:
#
#   CONFIG_RADIANT_BACKEND_NRF_GATE_MPSL=y
#   CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
#
# Both used to be hand-written in this file, which meant the interlock held only
# for as long as one fragment stayed correct - and this file is precisely the
# one that a manufacturer replaces. They are now a `select` and a `default` on
# HRM_BLE_HRS in apps/hrm_ble/Kconfig, so turning the BLE branch on carries them
# with it however it is turned on. CMakeLists.txt keeps a FATAL_ERROR backstop
# for the same interlock approached from the other side (CONFIG_BT set without
# HRM_BLE_HRS), and build-node asserts both symbols land in .config.
