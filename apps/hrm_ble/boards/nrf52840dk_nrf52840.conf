# nRF52840 DK, as a RadiANT heart-rate node.
#
# The other half of the overlay's `zephyr,entropy = &rng`. Choosing the RNG
# peripheral does not stop the CryptoCell entropy driver from being built: it
# instantiates a device for the (still enabled) cryptocell node whatever the
# chosen node is, and that device links CryptoCell's platform library (and
# NCS raises MAIN_STACK_SIZE to 2048 for it) for a driver nothing calls.
# Measured on this board, 2026-11-07: 6728 B of flash and 1937 B of RAM more
# than with this line. K_dev is drawn once in the life of the part (ADR 0020)
# and the RNG peripheral serves it.
CONFIG_ENTROPY_CC3XX=n
