# Compile NO implementation of the heart-rate seam - the integrator's starting
# point.
#
#   -Dhrm_ble_EXTRA_CONF_FILE=sensor_custom.conf
#
# A fragment rather than a bare -DCONFIG_ for the reason ble.conf gives: under
# sysbuild a bare -DCONFIG_x lands in the sysbuild cache and never reaches the
# image.
#
# WHAT THIS BUILD DOES. It links - which is the whole reason it is in CI, since
# an integrator's very first build failing for a reason unrelated to their
# driver is an expensive way to start - and at boot hrm_sensor_start() returns
# -ENODEV, logs an error naming this symbol, and the node transmits
# PROFILE_HR_INVALID_BPM forever.
#
# THAT IS THE CORRECT FAILURE AND IT IS NOT A BUG. There is deliberately no
# fallback to the simulator: a strap quietly reporting a simulated 72 bpm on a
# real chest is invisible from the receiving end, and a strap reporting nothing
# is not. Your code calls hrm_sensor_register() from a SYS_INIT() before main()
# reaches hrm_sensor_start(); see src/hrm_sensor.h and
# docs/hrm-reference-design.md.
CONFIG_HRM_SENSOR_CUSTOM=y
