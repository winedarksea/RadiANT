#
# Release the HFXO between radio operations (CONFIG_RADIANT_NRF_LOW_POWER,
# power plan Track B). Image-scoped, on top of ble.conf for the arbitrated
# build (pass B6) or alone for the direct one:
#
#   -Dhrm_ble_EXTRA_CONF_FILE="ble.conf;lowpower.conf"
#
# With ble.conf (the MPSL gate) the backend drops its boot-time HFXO request,
# stops its radio TIMER between MPSL timeslots (time runs on the GRTC) and
# starts it from the GRTC at each timeslot's START, where MPSL guarantees the
# crystal (every request is XTAL_GUARANTEED). The BLE controller's own HFXO
# use is MPSL's and is unchanged. Without ble.conf it is the direct backend's
# two-edge wake (passes B3/B5).
#
# Unlike radiant/samples/hr_transmitter's lowpower.conf this keeps the
# console: this application logs on it, and the bench gate for the MPSL build
# (Gate G4) reads the power-diag line there (power_diag.conf). A battery
# product would also drop LOG/SERIAL/CONSOLE.
#
# EXPERIMENTAL until Gate G4 (BLE connected + ANT+ for an hour, no MPSL
# assert, the START cross-check inside the gate's 0..17 us).
CONFIG_RADIANT_NRF_LOW_POWER=y
