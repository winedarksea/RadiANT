# Layered ON TOP OF ble.conf, never instead of it:
#
#   -Dhrm_ble_EXTRA_CONF_FILE="ble.conf;ble_suppress.conf"
#
# A fragment rather than a `-DCONFIG_...=y` on the command line, for the same
# reason ble.conf is image-scoped: under sysbuild a bare -DCONFIG_x lands in the
# sysbuild cache and never reaches the image, exactly as a bare
# -DEXTRA_CONF_FILE does. The semicolon-list form is the one already used for
# the P4 SED arm (thread.conf;thread_sed.conf).
#
# WHAT THIS IS FOR. The default (HRM_SUPPRESS_ANT_WHEN_CONNECTED=n) keeps ANT+
# transmitting while a phone is connected, so a watch and a phone are served at
# once. This fragment opts into the other policy: the node stops ANT+ for the
# duration of a BLE connection, since the phone already gets the rate over the
# SIG service. That saves air and power, but a watch listening on ANT+ loses
# the strap while the phone is connected.
#
# It is also the only build of the suppression code in main.c, so CI keeps it
# as a row: drop it and that code stops being compiled.
CONFIG_HRM_SUPPRESS_ANT_WHEN_CONNECTED=y
