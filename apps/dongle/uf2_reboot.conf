# Let the host reboot the board into its UF2 bootloader over USB, so it can be
# reflashed with no physical access. See CONFIG_ANT_DONGLE_UF2_REBOOT_REQUEST.
#
# The Pro Micro images already have this in their board conf. This fragment is
# the opt-in for other boards.
#
# Usage:
#   west build ... -b adafruit_feather_nrf52840/nrf52840/uf2 -- "-DEXTRA_CONF_FILE=uf2_reboot.conf"
#   python tools/ant_probe.py --reboot-to-bootloader

CONFIG_ANT_DONGLE_UF2_REBOOT_REQUEST=y
