# Let the host reboot the board into its UF2 bootloader over USB, so a board
# with no RESET button - most Pro Micro nRF52840 clones - can be reflashed
# without shorting RST to GND. See CONFIG_ANT_DONGLE_UF2_REBOOT_REQUEST.
#
# Usage:
#   west build ... -b promicro_nrf52840/nrf52840/uf2 -- "-DEXTRA_CONF_FILE=uf2_reboot.conf"
#   python tools/ant_probe.py --reboot-to-bootloader

CONFIG_ANT_DONGLE_UF2_REBOOT_REQUEST=y
