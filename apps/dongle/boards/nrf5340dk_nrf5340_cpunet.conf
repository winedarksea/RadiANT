# nRF5340 DK, NETWORK core - a real ANT+ endpoint on this board at last.
#
# THIS IS THE CORE WITH THE RADIO, AND THAT IS THE ENTIRE REASON THE FILE
# EXISTS. nrf5340_cpuapp has no `radio` devicetree node; the peripheral is on
# cpunet only. boards/nrf5340dk_nrf5340_cpuapp.conf therefore builds a dongle
# that enumerates over USB and cannot transmit or receive - useful for USB work
# and nothing else, which is what it says. This target is the other half: a
# dongle that owns the RADIO and speaks ANT serial out a UART instead.
#
# Between them the two configurations cover the board. What neither does is
# both at once - USB device is a cpuapp peripheral and RADIO is a cpunet
# peripheral, so a single image can never hold both, and joining them means an
# IPC byte transport plus an app-core USB bridge. That is a real work package
# and it is deliberately not attempted here. See docs/backends.md.
#
#   west ... -b nrf5340dk/nrf5340/cpunet -- -DANT_RADIO=core -DRADIANT_BACKEND=nrf
#
# and program radiant/spike/promisc/appcore alongside it, or this image runs
# perfectly and talks to nothing. That companion does two app-core-only jobs:
# clears RESET.NETWORK.FORCEOFF (CONFIG_SOC_NRF53_CPUNET_ENABLE) so this core
# runs at all, and sets PIN_CNF[0]/PIN_CNF[1].MCUSEL on P1 to NetworkMCU so
# uart0's pins - which belong to the application core until granted - reach the
# DK's second VCOM. It is reused as-is rather than copied; it is not
# spike-specific, and Spike B part 1 lost a day to not having it.
#
# ANT serial is then on that VCOM (COM10 on this bench), and the application
# core's own VCOM (COM9) keeps printing its heartbeat, which is the second
# opinion when this core is silent.

# ── ANT+ over UART, because this core has no USB at all ─────────────────────
#
# Same reasoning as the nRF54L15 DK target: ANT's serial protocol is a UART
# protocol, and a USB stick is a UART bridge in a plastic shell. Every host
# tool in tools/ takes --port, so this is a first-class endpoint for the bench
# rather than a lesser one.
CONFIG_ANT_DONGLE_TRANSPORT_UART=y

# ── There is exactly ONE UART on this core, and ANT gets it ─────────────────
#
# nrf5340_cpunet.dtsi declares uart0 and no others - unlike the nRF54L15 DK,
# where uart20/uart30 let the console and the ANT stream leave as two separate
# COM ports. So the console cannot be split off, and prj.conf's dongle default
# (CONSOLE=n, UART_CONSOLE=n, logging over RTT) is exactly right here and is
# left alone. A console on uart0 would interleave log text into the ANT byte
# stream and make it unparseable.
#
# RTT is reachable on this core - radiant/spike/promisc/net_rtt.conf does it -
# but attach to the NETWORK core's RTT control block, not the application
# core's.
CONFIG_SERIAL=y

# ── Nothing else may touch the RADIO ────────────────────────────────────────
#
# This backend owns the RADIO outright. On the nRF5340 the network core is
# normally running a Bluetooth controller or the 802.15.4 driver, and either
# would reprogram the registers underneath us - silently, as lost packets
# rather than as an error. RADIANT_BACKEND_NRF's own `depends on !BT ||
# RADIANT_BACKEND_NRF_GATE_MPSL` catches the BT case at configure time; these
# say the rest out loud so a future fragment that turned one on fails visibly.
CONFIG_BT=n
CONFIG_MPSL=n
CONFIG_NRF_802154_RADIO_DRIVER=n
CONFIG_IEEE802154=n
