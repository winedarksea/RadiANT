# nRF52840 Dongle (PCA10059) specific configuration.
#
# The dongle boots under Nordic's onboard USB bootloader rather than an
# Adafruit UF2 one, so the differences from the Feather are all about how the
# image is loaded, not what it does. The application itself is identical - the
# ANT stack is a linked library, not a SoftDevice, so nothing outside `app` is
# needed on either board.

# Suppress the board's CDC-ACM serial backend. Kconfig.defconfig sources
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig, whose defaults turn on
# USB_DEVICE_STACK_NEXT and bring up CDC ACM at boot - both of which fight our
# legacy-stack vendor class for the one USB device. Same fix as the Feather.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# Do NOT set CONFIG_USE_DT_CODE_PARTITION. The board's devicetree chooses
# slot0_partition (0x10000) as zephyr,code-partition because it is laid out for
# MCUboot, and we are not using MCUboot. Left off, BOARD_HAS_NRF5_BOOTLOADER
# gives CONFIG_FLASH_LOAD_OFFSET=0x1000, which is where the onboard USB
# bootloader actually hands control over, and which is what
# pm_static_nrf52840dongle_nrf52840.yml links `app` for.

# No UF2 here - the dongle has no mass-storage bootloader. The hex is what
# nrfutil packages into the DFU zip; see scripts/package_dfu.ps1.

# 1 ms between VBUS detection and USB attach, letting the USB regulator settle
# after the bootloader hands over. Same reasoning as the Feather: the
# bootloader has already had the USB peripheral up, and re-attaching too
# eagerly is a coin flip.
CONFIG_USB_NRFX_ATTACHED_EVENT_DELAY=1

# Remote wakeup off, matching a retail stick. See the Feather's conf for why
# this cannot live in prj.conf or be expressed as a Kconfig default.
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
