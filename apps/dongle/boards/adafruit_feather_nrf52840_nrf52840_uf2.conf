# Feather-specific configuration.
#
# Split out of prj.conf so the application also builds for a board with a
# debugger on it (see boards/nrf5340dk_nrf5340_cpuapp.conf). Everything here is
# either a symbol that only exists on this board or a consequence of being
# loaded by the Adafruit UF2 bootloader.

# Suppress the board's CDC-ACM serial backend - we use RTT, and its
# Kconfig.cdc_acm_serial.defconfig defaults (USB_DEVICE_STACK_NEXT, CDC_ACM at
# boot) would otherwise fight our legacy-stack vendor class.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# Drag-and-drop flashing onto FTHR840BOOT. The application is linked at the
# code partition the UF2 bootloader expects (0x26000), not at 0.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_USE_DT_CODE_PARTITION=y

# 1 ms between VBUS detection and USB attach, letting the USB regulator settle
# after the bootloader hands over.
CONFIG_USB_NRFX_ATTACHED_EVENT_DELAY=1

# Remote wakeup off, as a retail stick has it off. The bit ends up in the
# configuration descriptor's bmAttributes, so leaving it on is a difference the
# host can see from the build that was verified against Zwift.
#
# It has to be an explicit assignment, and it has to be here rather than in
# prj.conf. USB_NRFX declares `imply USB_DEVICE_REMOTE_WAKEUP`, and an imply
# outranks any `default n` the symbol could be given in Kconfig - only a user
# assignment beats it. And the symbol lives inside `if USB_DEVICE_DRIVER`, so
# it does not exist in a UART or new-stack build; prj.conf is read by those
# targets too, and an assignment there would be an assignment to nothing.
# Same reasoning as CONFIG_USB_NRFX_ATTACHED_EVENT_DELAY above.
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# Name the board in the product string, so a Feather can be told apart from an
# nRF52840 dongle on the same host (`lsusb -v`, tools/ant_probe.py, macOS System
# Information) - otherwise the two present identical descriptors apart from the
# serial number. Safe because nothing matches on iProduct: every host keys on
# VID/PID (ADR 0003). bcdDevice is deliberately left alone, since Windows caches
# its driver verdict per VID+PID+bcdDevice and that verdict should be shared.
# Feeds both USB stacks: USB_DEVICE_PRODUCT defaults to it on the legacy stack,
# and usb_ant_class_next.c uses it directly.
CONFIG_ANT_DONGLE_USB_PRODUCT="RadiANT ANT+ compatible USB stick (Feather)"

# Hardware stack guard. Every other dongle board already gets this from its
# Zephyr defconfig (promicro: defconfig; nrf52840dongle: Kconfig.defconfig);
# the Feather's defconfig sets only ARM_MPU, so a stack overrun here was silent
# corruption where every other board faults and reboots
# (RESET_ON_FATAL_ERROR=y). Review 2026-10-31, A15-1. Expect release.yml's
# zero-cost job to flag the section-size move once: it compares this board's
# disabled build against the merge base, and this changes it on purpose.
CONFIG_HW_STACK_PROTECTION=y
