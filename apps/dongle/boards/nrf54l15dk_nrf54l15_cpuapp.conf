# nRF54L15 DK - ANT on nRF54L silicon, without USB.
#
# The nRF54L05, L10 and L15 have no USB device peripheral at all. This is not
# a case of the DK leaving a connector unpopulated: there is no usbd node and
# no usbhs node in nrf54l_05_10_15.dtsi, because there is no controller on the
# die. Within the nRF54L family only the LM20A has one (see
# boards/nrf54lm20dk_nrf54lm20a_cpuapp.conf), and it is a DesignWare DWC2
# rather than the Nordic USBD block the nRF52840 carries.
#
# So this target cannot be a dongle. What it can do is prove the half that the
# nRF52840 boards cannot tell us anything about - that sdk-ant's prebuilt
# lib/nrf54l/libant.a links and runs here, that MPSL brings up the clock, and
# that the serial bridge drives real ANT channels on this silicon. The ANT
# serial protocol goes out a UART instead of a USB endpoint, which is what it
# was to begin with; a USB stick is a UART bridge in a plastic shell.
#
#   west ... -b nrf54l15dk/nrf54l15/cpuapp
#
# Then talk to VCOM1 with the host tools. VCOM0 carries the log.

CONFIG_ANT_DONGLE_TRANSPORT_UART=y

# Logs out the J-Link OB's first VCOM, not RTT. Same reasoning as the nRF5340
# DK build: the VCOM is just a COM port on the host, and the same USB cable
# that programs the board carries it, whereas RTT would need SEGGER's JLinkARM
# DLL installed.
#
# prj.conf turns the console off because a dongle has no use for one and USB is
# reserved for ANT. Neither applies here.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
