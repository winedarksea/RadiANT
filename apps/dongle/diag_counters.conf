#
# The 0xF7 diagnostic pages (MESG_RADIANT_DIAG, ADR 0023) on an nRF dongle,
# with the 0xF6 health counters they depend on. NOT diag.conf, which is the
# flash-log overlay.
#
#   west ... -- "-DEXTRA_CONF_FILE=diag_counters.conf"
#
# Read with tools/ant_diag.py --serial <serial>. Check the generated .config:
# CONFIG_ANT_DONGLE_DIAG=y and CONFIG_RADIANT_DIAG_COUNTERS=y.
CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y
CONFIG_ANT_DONGLE_DIAG=y
