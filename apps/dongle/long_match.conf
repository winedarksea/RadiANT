#
# The A image of an nRF wildcard-search A/B (ADR 0022): the 24-bit hardware
# match, [A6 C5 devnum_lo], and the 32-set sweep (~8.3 s per pass).
# CONFIG_RADIANT_SEARCH_SHORT_MATCH defaults to y on nRF since 2026-11-13
# (cc26xx since 2026-11-12); this fragment turns it back off, for an A/B and
# as the fallback image if the short match misbehaves in the field.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=long_match.conf"
#
# A fragment rather than a bare -D on the command line, which may not reach
# the image under sysbuild. On nRF the setting changes search windows only;
# tracking windows keep their full five-byte match either way (unlike cc26xx,
# see apps/dongle_ti/ti_long_match.conf).
#
# Check the generated .config, not the build log:
#
#   Select-String build\<dir>\dongle\zephyr\.config -Pattern "SHORT_MATCH|BACKEND_NRF="
#
# Expect CONFIG_RADIANT_BACKEND_NRF=y and the short match "is not set".

CONFIG_RADIANT_SEARCH_SHORT_MATCH=n
