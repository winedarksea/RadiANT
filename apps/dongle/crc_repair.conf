# CONFIG_RADIANT_CRC_REPAIR opt-in, for the S3 CRC-repair A/B (dB domain).
#
#   west build ... -- "-DEXTRA_CONF_FILE=crc_repair.conf"
#
# Off by default (radiant/Kconfig): the syndrome table and the per-CRC-failure
# lookup cost something for a gain that has never been measured on air - see
# reviewer item 4 in the production-readiness plan. This fragment is the A/B's
# B leg.
#
# CONFIG_RADIANT_PROFILE_SANITY rides along: it is the third refutation for a
# repaired frame (alongside the control-byte and transmission-type checks in
# radiant_crc_repair.h), and an A/B that enables repair without it cannot tell
# a caught mis-repair from an uncaught one.
CONFIG_RADIANT_CRC_REPAIR=y
CONFIG_RADIANT_PROFILE_SANITY=y

# The read path for the four counters this turns on (radiant_api_stats:
# crc_repaired, crc_unrepairable, crc_repair_refuted, crc_repair_implausible)
# comes with the symbol rather than with this fragment: apps/common/
# ant_radio_radiant.c logs them every 10 s from api_housekeep() and once more
# on channel close, both under #if CONFIG_RADIANT_CRC_REPAIR. On the nRF54L15
# DK they land on COM7, which needs DTR asserted.
#
# That read path is what makes an honest null result possible. The S3 decision
# rule requires crc_repaired to be climbing AT the knee before a difference in
# knees may be credited to repair - without the counters, "repair did nothing"
# and "repair never engaged" are the same two numbers, and only one of them is
# a result.
