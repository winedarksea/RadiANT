# CONFIG_RADIANT_CRC_REPAIR on, as a fragment for an application that does
# not already ship it.
#
#   west build ... -- "-DEXTRA_CONF_FILE=<path to>/crc_repair.conf"
#
# apps/dongle and apps/dongle_ti now set both symbols in their own prj.conf
# (owner acceptance of the nRF bench gate on 2026-11-15:
# archive/benchmarks/2026-11-15-nrf-crc-repair/, 22 repairs, 0 mis-repairs;
# the cc26xx run is archive/benchmarks/2026-11-13-ti-crc-repair/), so on
# those two this file is a no-op and crc_repair_off.conf is the one that
# changes anything. The radiant library default stays n (radiant/Kconfig):
# repair needs a backend with caps.has_rx_crc, and an application should turn
# it on knowingly. This is the file to point another radiant application at
# (apps/dongle_thread, a downstream product) when it does.
#
# CONFIG_RADIANT_PROFILE_SANITY rides along: it is the third refutation for a
# repaired frame (alongside the control-byte and transmission-type checks in
# radiant_crc_repair.h), and repair without it cannot tell a caught
# mis-repair from an uncaught one.
CONFIG_RADIANT_CRC_REPAIR=y
CONFIG_RADIANT_PROFILE_SANITY=y

# The read path for the four counters this turns on (radiant_api_stats:
# crc_repaired, crc_unrepairable, crc_repair_refuted, crc_repair_implausible)
# is 0xF7 page 10 on a build with CONFIG_RADIANT_DIAG_COUNTERS (on the dongles,
# diag_counters.conf). radiant/src/antr/ant_radio_radiant.c also logs them
# every 10 s and on channel close, but only at debug level: raise
# CONFIG_RADIANT_LOG_LEVEL to 4 to see those lines on a UART log.
#
# That read path is what makes an honest null result possible: without the
# counters, "repair did nothing" and "repair never engaged" are the same two
# numbers, and only one of them is a result.
