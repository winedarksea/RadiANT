# Enable the 0xF6 health counters (MESG_RADIANT_HEALTH).
#
#   west build app/apps/dongle -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#                                 "-DEXTRA_CONF_FILE=health.conf"
#   (or "-DEXTRA_CONF_FILE=next.conf;health.conf" for the USB_NEXT stack)
#
# -DRADIANT_BACKEND=nrf is spelled out because this recipe was copied without
# it once, onto a rationed Feather flash, and produced an image with the inert
# null radio. That is no longer the default, but an explicit flag is still what
# a reader should copy - and the .config read-back below is what proves it.
#
# Off by default - see CONFIG_ANT_DONGLE_HEALTH_COUNTERS's own help in
# apps/common/Kconfig.health and the header comment in apps/common/ant_health.h
# for why: the `zero-cost` CI job asserts identical section sizes and symbol
# sets against the merge base, and this symbol puts real counters on the
# common path.
#
# This fragment has a matrix entry in .github/workflows/build.yml (both the
# legacy-USB and USB_NEXT builds) with an `assert_config` read-back, on the
# same reasoning as security.conf next to it: a fragment nobody's CI ever
# builds is a fragment nobody notices breaking.
CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y
