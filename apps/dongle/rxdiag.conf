# Classify every tracked receive window (CONFIG_RADIANT_NRF_RX_DIAG) and print
# the totals every 10 s on the log console. Bench tooling for the
# device-number receive loss; see docs/decisions/0019-tracking-matches-a-short-address.md.
#
#   west build ... -b nrf54l15dk/nrf54l15/cpuapp -- -DANT_RADIO=core \
#       -DRADIANT_BACKEND=nrf "-DEXTRA_CONF_FILE=rxdiag.conf"
#
# Read the log VCOM with DTR asserted. Confirm CONFIG_RADIANT_BACKEND_NRF=y in
# the built .config before flashing.
CONFIG_RADIANT_NRF_RX_DIAG=y
