# Build the per-channel payload transforms, X_AUTH and X_CONF.
#
#   west ... -- "-DANT_RADIO=core" "-DEXTRA_CONF_FILE=security.conf"
#
# Not part of any released image, and off by default in Kconfig, because the
# governing constraint of this feature is that almost nobody turns it on and it
# must cost those users nothing. docs/radiant-security.md is normative;
# docs/decisions/0006-security-v1-scope-and-x-priv-withdrawal.md records the
# scope.
#
# ── Why this file exists, and the hole it exists not to repeat ─────────────
#
# encryption.conf sits next to this one and says, in its own comment, that it
# exists "so a default-off path does not quietly stop compiling" - and it has
# never appeared in scripts/build_all.ps1 or in either CI matrix. So the thing
# it was written to prevent was never actually prevented for it.
#
# This fragment has a matrix entry in .github/workflows/build.yml, and so does
# encryption.conf now. A configuration fragment with no build behind it is a
# comment.
#
# ── What a secured channel is ─────────────────────────────────────────────
#
# A RadiANT-envelope channel. It does NOT interoperate with ANT+ power, heart
# rate or speed-and-cadence: the transforms rewrite payload bytes those
# profiles define, so a Garmin head unit or Zwift reading a secured channel
# reads noise. Use a RadiANT device type, on a channel of its own.
#
# CONFIG_RADIANT_SEC depends on CONFIG_RADIANT, so this fragment reaches
# only -DANT_RADIO=core builds. That is asserted rather than assumed: the
# sdk-ant build's own matrix checks that CONFIG_RADIANT_SEC is not set.
CONFIG_RADIANT_SEC=y
