# Log every ANT serial frame between host and dongle (CONFIG_ANT_DONGLE_HOST_TRACE).
#
# For the nRF5340 DK's application core, the one board here that enumerates on
# its own USB port and prints a console at the same time:
#
#   west build -b nrf5340dk/nrf5340/cpuapp apps/dongle -- -DANT_RADIO=core \
#       -DRADIANT_BACKEND=null "-DEXTRA_CONF_FILE=host_trace.conf"
#
# The app core has no RADIO, so that image answers every command exactly as the
# radiant core does and never hears a packet: it shows what a host asks for and
# what is refused, not whether it then finds sensors. Read the console VCOM with
# DTR asserted.
CONFIG_ANT_DONGLE_HOST_TRACE=y

# The DK's board conf puts the nrfx USB driver at DBG under immediate-mode
# logging, which formats several lines per bulk transfer synchronously at
# 115200 baud - enough to delay replies and change what a host does. The
# enumeration-level USB_DEVICE log stays at DBG; the trace above covers the
# bulk traffic.
CONFIG_USB_DRIVER_LOG_LEVEL_INF=y
