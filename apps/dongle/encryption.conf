# Bridge the single channel encryption writes as well as the reads.
#
#   west ... -- "-DEXTRA_CONF_FILE=encryption.conf"
#
# Not part of any released image. See CONFIG_ANT_DONGLE_ENCRYPTION in Kconfig
# for why the default is off: no host on Windows can send 0x7D/0x7E/0x7F,
# because ANT_DLL.dll exports no encryption call at all, so the only thing
# enabling it can do to a shipping dongle is make a mode reachable that nothing
# asked for - on the same path a fitness app depends on.
#
# It exists so the feature can be built and exercised with
# tools/ant_features.py, and so a default-off path does not quietly stop
# compiling.
CONFIG_ANT_DONGLE_ENCRYPTION=y
