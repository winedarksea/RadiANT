# CRC repair OFF, the radiant library default (radiant/Kconfig), on top of an
# apps/dongle image that ships it on.
#
#   west build ... -- "-DEXTRA_CONF_FILE=crc_repair_off.conf"
#
# Two jobs. It is the A leg of any repair A/B now that prj.conf is the B leg,
# and it keeps a dongle build behind the default-off configuration, which
# release.yml's "core: feather, crc repair off" row asserts. PROFILE_SANITY
# depends on CRC_REPAIR, so it is cleared here too: leaving prj.conf's =y in
# place would be an assignment to a symbol with unmet dependencies, which
# Kconfig warns about on every configure.
CONFIG_RADIANT_CRC_REPAIR=n
CONFIG_RADIANT_PROFILE_SANITY=n
