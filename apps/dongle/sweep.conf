# Bench instrumentation for the discovery/scheduling path: the once-a-second
# SWEEP lines from api_housekeep(). Not a debug aid you can leave off and still
# get the measurement - the set/steer/dwell, why-not-armed and gap counters it
# prints are the ONLY witness to how the radio's time is actually split between
# a searching channel and a tracking one, and none of them exist in a build
# without it.
#
# Added while chasing the defect in tools/ant_search_contention.py, which
# reproduces on the bench but on no ztest: a channel that is searching costs a
# channel that is tracking roughly every other slot, and both then hear almost
# nothing. The board that reproduces it in the field is the PCA10059 dongle,
# which logs only over RTT and has no debugger - so the measurement happens on
# a DK with a UART console instead, and this fragment is what makes that build
# say anything.
#
#     west build -b nrf54l15dk/nrf54l15/cpuapp -s apps/dongle -d build/l15_sweep \
#         -- -DANT_RADIO=core -DRADIANT_BACKEND=nrf -DEXTRA_CONF_FILE=sweep.conf
#
# Never in a release row of scripts/build_all.ps1: a shipping image has no
# business carrying a once-a-second log line.
CONFIG_RADIANT_SWEEP_DEBUG=y

# The SWEEP lines are wide and arrive in bursts of three. The default 1024-byte
# deferred buffer drops them under load, which reads as "the counter stopped
# moving" - the exact conclusion the instrumentation exists to prevent.
CONFIG_LOG_BUFFER_SIZE=4096
