#
# The quiet Feather image: no LED activity at all, for users who find a
# blinking light annoying. One of the two shipping Feather images; the other is
# rgb.conf + rgb_feather.overlay (NeoPixel activity indicator plus the red led0
# heartbeat). Build it WITHOUT rgb_feather.overlay, so the ws2812 node, its
# driver and the SPI subsystem never enter the image.
#
# The heartbeat off is the whole switch (apps/common/Kconfig.heartbeat_led):
# ant_heartbeat_led.c is not compiled and no GPIO is configured, so led0 is
# never driven. With the heartbeat gone, nothing selects
# CONFIG_ANT_DONGLE_ACTIVITY_COUNT either, so radiant_ant_on_message() loses its
# per-message counter too.
#
# The UF2 bootloader still drives its own LEDs while it is running (the
# double-tap-RESET drive). That is the bootloader, before this image starts,
# and not something firmware can turn off.

CONFIG_ANT_DONGLE_HEARTBEAT_LED=n
