#
# The activity-rate RGB indicator. Pair with a board overlay that declares the
# LED node and the `rgb-led0` alias - on the Feather that is
# -DEXTRA_DTC_OVERLAY_FILE=rgb_feather.overlay. Without one the build fails
# with an #error naming the missing alias, deliberately, rather than producing
# an image where the feature is enabled and silently inert.
#
# CONFIG_WS2812_STRIP_SPI needs no assignment here: it is `default y` gated on
# the ws2812 compatible being enabled in devicetree, and it selects SPI itself.

CONFIG_ANT_DONGLE_RGB_LED=y
