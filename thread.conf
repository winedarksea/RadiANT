# SPDX-License-Identifier: Apache-2.0
#
# The multiprotocol plan's P4 coexistence gate, MED half, as a build.
#
#   west ... -- "-DANT_RADIO=core" "-DRADIANT_BACKEND=nrf" \
#               "-DEXTRA_CONF_FILE=thread.conf"
#
# This is the CONTENDED half of an A/B. The other half is gate.conf: the same
# arbiter, no second stack. Read both or neither - the gate answers a difference
# between two images and never a property of one. See gate.conf's header for why
# that file exists rather than "just leave this one off".
#
# ---------------------------------------------------------------------------
# THIS IS THE MED (WORST-CASE) BUILD, AND IT IS NOT THE INTENDED ROLE
# ---------------------------------------------------------------------------
#
# docs/radiant-bridge.md section 7.4: "Run it in the MED role as well as the
# intended one, even though MED is the last preference. MED is the always-on
# case, so it is the worst case, and a gate measured only in the role that
# schedules its own windows would be measuring the mitigation rather than the
# problem. Record both numbers."
#
# thread_sed.conf is the other role. Both numbers, or the gate is half-run.
#
# ---------------------------------------------------------------------------
# -DANT_RADIO=core IS NOT OPTIONAL AND IS NOT THE DEFAULT
# ---------------------------------------------------------------------------
#
# Identical trap to coex.conf's: the root build defaults to the sdk-ant radio,
# which leaves CONFIG_RADIANT_CORE=n, and then every RADIANT_CORE_* line below is
# dropped with an "unsatisfied dependencies" warning and an exit code of 0.
#
# ALWAYS CHECK THE GENERATED .config, NOT THE BUILD LOG:
#
#   Select-String build\<dir>\<app>\zephyr\.config -Pattern `
#       "^CONFIG_RADIANT_CORE_BACKEND_|^CONFIG_ANT_DONGLE_THREAD_COEX_LOAD=|^CONFIG_OPENTHREAD_MTD"
#
# Expect BACKEND_NRF=y AND BACKEND_NRF_GATE_MPSL=y. BACKEND_NULL=y here is the
# failure that reports EXIT=0 and puts nothing on the air.

# ── The arbiter ────────────────────────────────────────────────────────────
#
# Two MPSL users now, not one: the 802.15.4 Service Layer takes a session of its
# own, and it does so whether or not this file says anything - on nRF54L,
# CONFIG_NRF_802154_RADIO_DRIVER=y force-selects NRF_802154_SL, which selects
# MPSL, which selects NRF_802154_MULTIPROTOCOL_SUPPORT. So the count below is
# ours plus theirs, and getting it wrong shows up as a timeslot session that
# cannot be opened rather than as anything about ANT+.
CONFIG_RADIANT_CORE_BACKEND_NRF_GATE_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2

# ── The second stack ───────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NET_CONFIG_SETTINGS=y

# CONFIG_NET_CONFIG_NEED_IPV6 IS DELIBERATELY ABSENT, AND ASKING FOR IT COST
# THIRTY-ONE SECONDS OF EVERY BOOT.
#
# It makes net_config_init() BLOCK until the interface has an IPv6 address, up to
# CONFIG_NET_CONFIG_INIT_TIMEOUT - which defaults to 30 s. A Thread MTD does not
# get an address until it has discovered a parent and attached, so on a bench
# where the leader is off, out of range, or still booting, that wait runs to the
# full timeout EVERY TIME. Measured: boot banner at 00:48:16.891, application
# init at 00:48:47.936 - 31.04 s, reproducible to the tenth.
#
# It runs before main(), so for those 31 s the board has no console output, no
# ANT stack and no answer for the host - which is indistinguishable from a hung
# image, and was read as exactly that. `ant_verify.py` reset the dongle, waited
# its couple of seconds for a startup message, got nothing, and reported "no
# startup message after reset". Several runs in this session were scored against
# a board that was merely still in this wait.
#
# Nothing here needs a configured IPv6 address at startup:
# src/thread_coex_load.c opens its own socket lazily, on its first send, and only
# once otThreadGetDeviceRole() says attached.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# CONFIG_NET_TCP is deliberately absent. docs/radiant-bridge.md line 1141 notes
# OpenThread sits under the native IP stack in Zephyr and TCP comes along for the
# ride if asked for; it is flash this image does not need and air time the gate
# would then have to account for.

# MTD, and NOT sleepy - that is what makes this the MED arm. The receiver stays
# on, which is the always-on worst case section 7.4 asks for.
CONFIG_OPENTHREAD_MTD=y

# Fixed credentials so both arms of the A/B, and both roles, join the same
# network without a commissioner. A bench value; not a secret, and never in a
# shipping image (there is no shipping image - see decision 0011).
CONFIG_OPENTHREAD_MANUAL_START=n
CONFIG_OPENTHREAD_NETWORK_NAME="radiant-p4"
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_CHANNEL=26
CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"

# Channel 26 on purpose: it is the top of the 802.15.4 band and the one channel
# that does not overlap the common 2.4 GHz Wi-Fi channels. The bench's ~0.4 %
# ANT+ loss floor is band-flat and NOT a fixed-channel interferer (that was
# measured and the Wi-Fi attribution refuted), so this does not buy a better
# floor - it removes one variable from an argument about the gate's result.

# The heap OpenThread wants. Left explicit rather than inherited: the default is
# sized for a build with no other subsystem in it, and the failure mode of
# getting this wrong is intermittent send failures that look exactly like
# contention losses.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# OpenThread stores its dataset through the settings subsystem.
#
# ZMS AND NOT NVS, AND ON THIS SoC THAT IS NOT ADVICE. NCS prints a warning
# recommending ZMS on nRF54L/nRF54H for RRAM/MRAM lifetime reasons - easy to
# scroll past among a hundred lines - but the actual outcome of ignoring it here
# is a hard compile error, not wear: Zephyr pulls settings_zms.h in regardless
# and it references CONFIG_SETTINGS_ZMS_MAX_COLLISIONS_BITS, which only exists
# under CONFIG_SETTINGS_ZMS. So the wear warning and the build failure arrive
# together and the warning is the one that explains the failure.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# ── The load itself ────────────────────────────────────────────────────────
#
# Without this the image attaches and then goes nearly silent, and the gate
# measures nothing while looking like it passed. See src/thread_coex_load.c.
# ── Keep the fault on the console instead of rebooting over it ─────────────
#
# The contended build resets about every 51 s once an ANT channel is open, and
# NOTHING is printed before it goes - which is why the reset was first mistaken
# for a silent radio. Zephyr's default is to reset on a fatal error, and a reset
# takes the fault message with it. With this off the board halts at the fault and
# the k_sys_fatal_error_handler dump - reason, PC, LR - stays on COM7 to be read.
#
# A BENCH SETTING, not a shipping one: a dongle that halts is worse for a user
# than one that reboots. It lives in thread.conf rather than prj.conf for exactly
# that reason.
CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_ANT_DONGLE_THREAD_COEX_LOAD=y
CONFIG_ANT_DONGLE_THREAD_COEX_LOAD_INTERVAL_MS=100
CONFIG_ANT_DONGLE_THREAD_COEX_LOAD_PAYLOAD=64
CONFIG_ANT_DONGLE_THREAD_COEX_LOAD_DELAY_S=12
