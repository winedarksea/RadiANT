# Board-specific settings live in boards/<board>.conf - the UF2 output and
# code-partition offset for the Feather, RTT wiring for the nRF5340 DK.

# The ANT stack settings that used to sit here - CONFIG_ANT,
# CONFIG_ANT_EVALUATION_KEY, CONFIG_ANT_TOTAL_CHANNELS_ALLOCATED=8 (which is
# what gives Zwift headroom for HRM + power + cadence + extras) and
# CONFIG_ANT_BURST_QUEUE_SIZE - are now written by CMakeLists.txt into a
# generated fragment, alongside the CONFIG_ANT_DONGLE_RADIO_* symbol naming the
# backend. They name symbols that exist only when sdk-ant's Kconfig has been
# sourced, and it is CMake that decides whether that happens; stating them here
# would make every core or stub build fail on an assignment to an undefined
# symbol. Same reasoning as the legacy USB stack settings in Kconfig.

# Logging via RTT only; USB is reserved for the ANT bridge
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# Two separate knobs decide what happens when the RTT up-buffer fills, and on
# this board it is always full: nothing ever drains it, because the Feather has
# no debugger to attach one.
#
# The SEGGER-level one is already Zephyr's default, but the alternative
# (SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL) spins until a host reads, which here
# would be forever. Stating it removes a way for an SDK default to move.
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
# The log-backend one defaults to BLOCK, which is not the default we want: a
# skipped write is retried LOG_BACKEND_RTT_RETRY_CNT (4) times with
# LOG_BACKEND_RTT_RETRY_DELAY_MS (5) between, so every message past the first
# 1 KB costs ~20 ms of k_msleep for output that no one will ever read. Deferred
# mode confines that to the log thread; diag.conf switches to
# CONFIG_LOG_MODE_IMMEDIATE, where it is spent in the calling thread instead -
# the ANT event handler and the USB work queue.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Heap and threads
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y

# Transport. The default is CONFIG_ANT_DONGLE_TRANSPORT_USB_LEGACY wherever a
# Nordic USBD peripheral exists, which is every board this has shipped on; the
# nRF54 targets pick a different one from their board .conf because they have
# to. The USB identity (VID/PID/strings) and each stack's own settings live in
# the application Kconfig, because the legacy symbols do not exist in a build
# that is not using the legacy stack.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n

# Pin bcdDevice rather than letting Zephyr derive it from the kernel version,
# so the hardware ID stays put across rebuilds. Windows caches its driver
# verdict against VID+PID+bcdDevice and will not reconsider a device it has
# already bound, so a moving value quietly creates a new device node on every
# SDK bump. Not verified against a retail stick - the ANT INF matches
# USB\VID_0FCF&PID_1009 without a REV, so the value is free.
CONFIG_ANT_DONGLE_BCD_DEVICE=0x0100

# Ring buffer for USB RX data
CONFIG_RING_BUFFER=y

# GPIO for onboard LED activity signal
CONFIG_GPIO=y
