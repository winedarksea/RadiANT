# Board-specific settings live in boards/<board>.conf - the UF2 output and
# code-partition offset for the Feather, RTT wiring for the nRF5340 DK.

# ANT stack — 8 channels gives Zwift headroom for HRM + power + cadence + extras
CONFIG_ANT=y
CONFIG_ANT_EVALUATION_KEY=y
CONFIG_ANT_TOTAL_CHANNELS_ALLOCATED=8
CONFIG_ANT_BURST_QUEUE_SIZE=256

# Logging via RTT only; USB is reserved for the ANT bridge
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Heap and threads
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_REBOOT=y

# USB device stack — vendor-specific class, no CDC ACM
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_DRIVER=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
# VID/PID that Zwift scans for via libusb / WinUSB (spoofing ANTUSB-2)
CONFIG_USB_DEVICE_VID=0x0FCF
CONFIG_USB_DEVICE_PID=0x1008
CONFIG_USB_DEVICE_MANUFACTURER="Dynastream Innovations"
CONFIG_USB_DEVICE_PRODUCT="ANTUSB2 Stick"
CONFIG_USB_DEVICE_SN="ANT0001"
CONFIG_USB_DEVICE_BOS=y
# We call usb_enable() ourselves after ANT is ready
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_REQUEST_BUFFER_SIZE=2048
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# USB callback stacks.
#
# The nrfx driver dispatches SET_CONFIGURATION on its own work queue, and that
# is the thread our ant_status_cb() -> arm_rx() -> usb_transfer() chain runs on.
# At the 1 KB default it overflows the moment the host configures the device -
# a fatal error that halts the system, so the board goes dark on the bus, the
# LED heartbeat stops and nothing more is logged. It reads exactly like "USB
# never came up".
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048

# Give usb_transfer() its own work queue rather than sharing the system one,
# which is what the in-tree USB classes do. The transfer callbacks then cannot
# overflow whatever else happens to be using the system work queue.
CONFIG_USB_WORKQUEUE=y
CONFIG_USB_WORKQUEUE_STACK_SIZE=2048

# Ring buffer for USB RX data
CONFIG_RING_BUFFER=y

# GPIO for onboard LED activity signal
CONFIG_GPIO=y
