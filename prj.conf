# Board-specific settings live in boards/<board>.conf - the UF2 output and
# code-partition offset for the Feather, RTT wiring for the nRF5340 DK.

# ANT stack — 8 channels gives Zwift headroom for HRM + power + cadence + extras
CONFIG_ANT=y
CONFIG_ANT_EVALUATION_KEY=y
CONFIG_ANT_TOTAL_CHANNELS_ALLOCATED=8
CONFIG_ANT_BURST_QUEUE_SIZE=256

# Logging via RTT only; USB is reserved for the ANT bridge
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Heap and threads
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y

# USB device stack — vendor-specific class, no CDC ACM
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_DRIVER=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
# Identify as an ANT USB-m, the current stick and the one an ANT driver is
# most likely to be published for. Dynastream's own INF (shipped inside Zwift
# as Windows ANT Dongle Driver\ANT_LibUsb.inf) and the usb.ids registry agree
# on the mapping, and it is the one Windows matches against:
#
#   0FCF:1008  ANTUSB2 Stick
#   0FCF:1009  ANT USB-m Stick
#
# Some Garmin support pages state this the other way round. The INF wins,
# because the INF is what driver matching actually reads. Both PIDs are listed
# in that one package, so this choice does not change which driver applies.
CONFIG_USB_DEVICE_VID=0x0FCF
CONFIG_USB_DEVICE_PID=0x1009
CONFIG_USB_DEVICE_MANUFACTURER="Dynastream Innovations"
CONFIG_USB_DEVICE_PRODUCT="ANT USB-m Stick"
CONFIG_USB_DEVICE_SN="ANT0001"
# No BOS. Its only occupant was the MS OS 2.0 platform capability, which is
# now off (see CONFIG_ANT_DONGLE_MSOS_DESCRIPTORS), and disabling it also drops
# bcdUSB from 0x0210 back to 0x0200 - a plain USB 2.0 device, like the stick
# this impersonates.
CONFIG_USB_DEVICE_BOS=n

# Pin bcdDevice rather than letting Zephyr derive it from the kernel version,
# so the hardware ID stays put across rebuilds. Windows caches its driver
# verdict against VID+PID+bcdDevice and will not reconsider a device it has
# already bound, so a moving value quietly creates a new device node on every
# SDK bump. Not verified against a retail stick - the ANT INF matches
# USB\VID_0FCF&PID_1009 without a REV, so the value is free.
CONFIG_ANT_DONGLE_BCD_DEVICE=0x0100
# We call usb_enable() ourselves after ANT is ready
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_REQUEST_BUFFER_SIZE=2048
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# USB callback stacks.
#
# The nrfx driver dispatches SET_CONFIGURATION on its own work queue, and that
# is the thread our ant_status_cb() -> arm_rx() -> usb_transfer() chain runs on.
# At the 1 KB default it overflows the moment the host configures the device -
# a fatal error that halts the system, so the board goes dark on the bus, the
# LED heartbeat stops and nothing more is logged. It reads exactly like "USB
# never came up".
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048

# Give usb_transfer() its own work queue rather than sharing the system one,
# which is what the in-tree USB classes do. The transfer callbacks then cannot
# overflow whatever else happens to be using the system work queue.
CONFIG_USB_WORKQUEUE=y
CONFIG_USB_WORKQUEUE_STACK_SIZE=2048

# Ring buffer for USB RX data
CONFIG_RING_BUFFER=y

# GPIO for onboard LED activity signal
CONFIG_GPIO=y
