# SPDX-License-Identifier: Apache-2.0
#
# Tier 2 A/B gates - the thresholds `tools/ant_ab.py` applies.
#
# This file exists separately from `archive/benchmarks/` for one reason: a
# baseline records what was measured, and a gate records what is required.
# Keeping them in two files makes it obvious when somebody moves a threshold
# to meet a result instead of the other way round. Every number below is a
# reviewable line in a diff, with the reason for its value next to it.
#
# The thresholds themselves come from `docs/testing.md`, which is the
# authority. If the two ever disagree, the document is right and this file is
# stale.
#
# Two rules that are not thresholds, and that have both already gone wrong
# here once:
#
#   * Read `loss (exact)`, never the wall-clock line. The wall-clock figure
#     divides elapsed time by the nominal period and assumes the
#     transmitter's crystal is exact; `loss (exact)` counts what is missing
#     from the transmitter's own event counter, with no clock involved.
#   * Gate on `timing`, never on `jitter`. `jitter` is a standard deviation
#     over raw gaps, so one lost packet turns a 250 ms gap into a 500 ms one
#     and six losses in 1,200 packets produce its entire figure - it has
#     always moved with the loss number and adds nothing to it. `timing` is
#     the same packets with the whole periods subtracted out: the error
#     without the count.
#
# `tools/ant_ab.py` enforces both by reading `derived.loss_exact_pct` and
# `derived.timing_offgrid_host_ms` and by having no code path that reads
# either of the other two.
#
# ---------------------------------------------------------------------------
# 2026-08-15: bench floor investigation - read before recalibrating
# ---------------------------------------------------------------------------
#
# The plan's Phase 1.1 asked for a recalibration run with the host's Wi-Fi 6E
# card disabled. Not done, and should not be: the card is this machine's only
# network interface, and the room carries enough other 2.4 GHz traffic that
# switching off one local card would isolate nothing.
#
# What was measured instead: the acceptance rig (Feather DUT, sdk_ant,
# USB_LEGACY; nRF54L15 DK master running apps/sim, RF 57) repeats at
# 4.87-7.94 % loss (exact) across four 60-300 s runs, with an A1-A2 spread of
# 3.07 pp - nine times `repeat_a_max_delta_pp` below. A threshold cannot be
# re-derived from a bench whose own repeat spread is ten times the threshold
# being derived, so no A/B/A sitting on this bench is currently valid.
#
# Four candidate explanations were chased in the same afternoon - room-wide
# contention, which rig, which stack, and finally transmit power - and each
# was overturned by the next control rather than confirmed. Do not reuse any
# of them as settled without re-running the control that overturned it
# (`git log` on this file carries the full trace). The surviving lead: most
# of the gap tracked transmit power (apps/sim at +4 dBm roughly halved the
# loss), and an nRF54L15 master cannot reach the power level a Feather master
# can (level 5 / +8 dBm is nRF52-only). Every historical figure in this file
# - the 0.85-1.37 % power sweep and the 0.26-0.60 % floor below - was taken
# with a Feather transmitting, not an nRF54L15.
#
# BEFORE PHASE 1.7: move the master off the nRF54L15 - build apps/sim for the
# Feather (build/sim_feather/sim/zephyr/zephyr.uf2 already exists) and put
# the DUT on the L15 - then re-take A1/A2. Only once that repeats inside
# `repeat_a_max_delta_pp` do these thresholds mean anything; re-deriving them
# from the current bench would bake its unexplained loss into the product's
# acceptance criteria.
#
# A parallel attempt to separate room from rig with a quiet RF channel (72 or
# 78) did not produce a result: both ends report success but nothing is
# heard, on any channel, until the RF-57 build is reflashed. Not yet
# root-caused; the next probe is a non-ANT+ network key on a private network
# number.
#
# One more trap already spent on this bench: on nRF54L, the log clock behind
# the console timestamp free-runs across a soft reset, so a climbing uptime
# across a reflash is not evidence the board didn't reset - read the boot
# banner instead.
#
# And before fitting any threshold here to a bench number: check the number
# can be accounted for. The previous 1.0 -> 2.5 % retune was fitted to a
# broken measurement and encoded the tool's own bug as the spec.

schema_version = 1


# ---------------------------------------------------------------------------
# The sitting
#
# Not a gate on the firmware - a gate on whether the two numbers are
# comparable at all. The run-to-run spread on this bench is comparable to
# the effect being measured, so a number recorded today against one recorded
# last week measures the room and the desk, not the firmware. `docs/testing.md`
# states A/B/A in one sitting as a hard rule; this is where it is enforced
# rather than remembered.
# ---------------------------------------------------------------------------
[sitting]

# Both baselines must carry the same `meta.recorded` date, compared by date
# part only: one sitting can straddle an hour, not a night.
require_same_recorded_date = true

# `rig` must match object-for-object - same transmitter, receiver, link, RF
# channel and attenuation. A changed cable is a changed measurement.
require_same_rig = true

# A baseline from an arbitrated build must carry `rig.second_stack` (naming
# what else was on the chip's radio: "none", "ble", "thread_sed",
# "thread_med"). There is no separate `require_same_second_stack` switch -
# `require_same_rig` above already compares the whole `rig` object, so
# recording the field there is the entire mechanism. It prevents comparing a
# BLE-on run against a Thread-on run as if either produced a coexistence
# figure alone. Baselines recorded before the arbitrated build existed carry
# no such field and will correctly refuse to compare against one that does.

# A/B/A: pass three baselines and the first and last must be the same
# backend and agree to within this many percentage points of exact loss, or
# the sitting is void and the B number means nothing.
#
# 0.35 pp is this bench's characterised spread: four identical 300 s runs
# landed between 0.26 % and 0.60 %, and 0.60 - 0.26 = 0.34, rounded up rather
# than padded.
repeat_a_max_delta_pp = 0.35


# ---------------------------------------------------------------------------
# Tier 1 - frame conformance
# ---------------------------------------------------------------------------
[gates.conformance]
enabled = true
required = true

# Byte-identical is the pass. `tools/ant_conformance.py` suppresses
# timestamps precisely so this is reachable.
require_byte_identical = true

# Cases allowed to differ, each a decision reviewed and defended individually.
# Empty by default and should stay that way as long as possible. The one
# entry that will legitimately be needed is "4d-request-version-0/valid":
# MESG_VERSION returns the backend's own name, so sdk-ant and radiant cannot
# answer it identically. Add it only when the first real A/B run needs it -
# an allowance added speculatively excuses a difference nobody has looked at.
allowed_differing_cases = []


# ---------------------------------------------------------------------------
# Tier 2 - radio behaviour
# ---------------------------------------------------------------------------

[gates.loss_exact]
enabled = true
required = true

# <= sdk-ant + 0.2 pp. Percentage points, not a ratio: at a floor of 0.4 % a
# ratio gate would either permit doubling or forbid ordinary noise.
max_delta_pp = 0.2

# Shorter runs do not wrap the slow accumulators and their loss resolution
# is coarse.
min_seconds = 300

# The acceptance ceiling, applied to the candidate on its own - a backend can
# be within 0.2 pp of an sdk-ant run that was itself having a bad afternoon.
absolute_ceiling_pct = 1.5

# Informational only, deliberately not a failure. This bench's characterised
# floor is 0.26-0.60 %; a figure below 0.26 % is suspicious rather than
# excellent - the last time a number looked too good, the measuring tool was
# broken. `ant_ab.py` prints a warning and does not fail.
suspicious_below_pct = 0.26

[gates.unexplained_loss]
enabled = true
required = true

# A hole with no RX_FAIL to account for it. The radio raises RX_FAIL for a
# packet lost on the air and says nothing about one lost after the radio
# already had it, so a nonzero value here is a host or dongle bug, not a
# link property. This is the check that caught a 250 ms libusb read timeout
# racing a 249.7 ms channel period - about 0.4 pp of entirely imaginary loss
# that looked exactly like the real kind. Zero, and it invalidates the
# sitting rather than failing one gate.
max = 0

[gates.accumulator_violations]
enabled = true
required = true

# ANT+ profiles survive packet loss because values are cumulative sums
# rather than instantaneous readings, so a lost packet is recovered by the
# next one. A continuity violation means that property broke - a decoding or
# wrap-handling bug, not a link problem.
max = 0

[gates.sched_missed]
enabled = true

# Not required: this counter comes from `tools/ant_health.py`
# (MESG_RADIANT_HEALTH, 0xF6, needs CONFIG_ANT_DONGLE_HEALTH_COUNTERS=y), and
# no baseline recorded before this gate existed carries it - `libant.a` has
# no such counter at all, so requiring it would fail every sdk-ant reference
# by construction. A sitting without it reports SKIP rather than failing.
required = false

# Receive windows the scheduler declared DONE_MISSED - it could not arm them
# in time, so the radio never listened. This is the one loss-shaped number
# the room cannot move: every other loss figure here mixes the air in with
# the firmware, which is why the bench's 5-8 % ambient loss (see the header)
# cannot currently carry them. Zero, because a missed window is not a link
# property - at one channel it is structurally impossible, which is why it
# stayed at zero and unexamined for so long, and why multi-channel runs are
# the ones to read it on.
max = 0

[gates.timing]
enabled = true
required = true

# <= sdk-ant x 1.25, read off `timing`, never `jitter` (see the header).
# Expect ~2.6 ms on the host clock; the radio's own clock reads ~0.009 ms,
# which is what says the host clock is the instrument and the link is fine.
max_ratio = 1.25

# A ratio against an already-tiny number goes unstable, so a small absolute
# allowance underwrites it: anything within this many ms passes regardless
# of the ratio.
floor_ms = 0.5

[gates.acquisition]
enabled = true

# 2026-08-16: flipped to false. No baseline in archive/benchmarks/ yet
# carries time_to_first_packet_s or reacquire_s - the producers
# (tools/ant_verify.py's T1 stamping and T2 --expect-dropout mode) landed in
# this commit but no S2 sitting has run against them, so required=true would
# be a guaranteed fail by construction. Flip back to true in the same commit
# that archives S2's baselines, and no later.
required = false

# Time to first packet and time to re-acquire after a deliberate dropout.
# <= sdk-ant x 1.5 AND <= 5 s absolute - both, not either. The absolute
# limit is what a rider notices; the ratio stops a slow baseline excusing a
# slower rebuild.
max_ratio = 1.5
max_absolute_s = 5.0

[gates.sensitivity]
enabled = true
required = true

# Attenuation (or distance) at 5 % exact loss, within 1 dB-equivalent of
# sdk-ant on the same rig, receivers swapped. Required on purpose:
# sensitivity is a stated core value of this project - the nRF52840's
# ~10 dB over an nRF24AP2 is in README.md's first paragraph - and it is also
# the slot most likely to be skipped because it takes longest.
max_delta_db = 1.0

# Every method here measures the same knee but carries its own systematic
# offset (connector loss, room reflections, or the part's own power
# accuracy), so `ant_ab.py` refuses to compare across methods rather than
# convert between them; `rig.link.sensitivity_method` is part of
# `require_same_rig` for the same reason. `tx_ladder` (`tools/ant_sens.py`)
# steps the master's transmit power down until the receiver misses 5 %,
# standing in for the inline attenuator and open-air rig this bench lacks -
# it measures the receiver, not the transmitter power sweep documented
# elsewhere.
methods = ["inline_attenuator", "fixed_open_air", "tx_ladder"]

# Phase 0's gate on the instrument rather than the firmware.
# `tools/ant_sens.py --repeat 2` runs the whole ladder twice untouched, and
# the two 5 %-loss points must land within this many dB - any disagreement
# is the instrument's own noise, and an instrument noisier than the 1 dB
# above cannot grade a 1 dB claim. Same value as max_delta_db, not a
# coincidence: a gate cannot be tighter than the instrument reading it.
repeat_max_delta_db = 1.0

[gates.scale]
enabled = true

# Not required, and not a loophole: `libant.a` allocates 8 channels and
# advertises scan mode off without implementing it, so no sdk-ant baseline
# exists to compare against and none should be invented. `ant_ab.py` reports
# the absence as SKIP, never as a pass.
required = false

# Absolute, not relative: worst per-channel exact loss no worse than the
# single-channel figure from the same rig plus this many percentage points.
max_delta_pp = 0.5

# 32 is the serial protocol's natural ceiling - the burst header uses the
# low 5 bits for the channel number.
expect_channels = 32

[gates.ack_data]
enabled = true

# Not required, same reason as `scale`: needs a responding sensor or `sim/`
# acting as one, which not every sitting has. Absent reads as SKIP.
required = false

# >= 99 % AND >= sdk-ant - 1 pp. Acknowledged data is ERG mode - how Zwift
# sets trainer resistance - so this is the gate closest to the Tier 3 ride.
min_success_pct = 99.0
max_delta_pp = 1.0

[gates.coexistence]
# LIVE: `ant_ab.py` has a `coexistence` case and this block is what it reads.
# The schema (`archive/benchmarks/baseline.schema.json`) now defines both a
# top-level `coexistence` block and `rig.second_stack`; before that a genuine
# P4 baseline was rejected before any gate ran.
enabled = true

# Not required, same reason as `scale` and `ack_data`: a build with no
# second stack legitimately has no coexistence block, and the absence must
# read as SKIP rather than a pass.
required = false

# A different comparison from `loss_exact`, not a looser standard:
# `loss_exact` compares two BACKENDS on the same rig with nothing else on
# the radio, and 0.2 pp is what the bench's own spread allows. This compares
# the SAME backend with the second stack on vs off, so it measures what
# coexistence costs - 0.5 pp is the figure `docs/backends.md` has stated
# since before the arbiter existed. Both gates must pass on a combined
# build; a build can be 0.15 pp from sdk-ant with BLE off and 2 pp worse
# with BLE on, and only this gate sees it.
max_delta_pp = 0.5

# Applied to the candidate with the second stack ON, on its own terms - same
# argument as loss_exact's ceiling: being within 0.5 pp of a bad afternoon
# is not a pass.
absolute_ceiling_pct = 1.5

# The arbiter's OWN cost - CONFIG_MPSL=y with nothing else on the radio,
# against the direct build - isolating the timeslot machinery's cost from
# the second stack's. This is the exit criterion for the whole combined
# build: past this, the combined USB + Thread dongle is abandoned in favour
# of the two-box handoff in docs/radiant-bridge.md section 7.3, and no
# amount of tuning the second stack's demand recovers it.
arbiter_only_max_delta_pp = 1.5

# min_sweep_rate_ratio was RETIRED with the SWEEP_DEBUG instrument that fed
# it. It bounded how far the sweep - the elastic consumer, ADR 0013 - could
# slow under contention, separating "gave way" from "stopped", using sets/s
# only that instrument emitted. P3/P4 concluded, the instrument went, and
# nothing produces sweep_sets_per_s_off/_on now. Restoring the bound means
# restoring the instrument first; its 0.5 ratio is in git history.

[gates.usb_latency]
enabled = true
required = true

# <= sdk-ant x 1.1 - equality is the expectation, not a stretch, since the
# radio is not on this path at all. A regression here is a USB-stack or
# bridge change that arrived with the backend swap.
max_ratio = 1.1

# Same floor argument as `timing`: p50 is a few hundred microseconds, and a
# 10 % gate on 0.36 ms is 36 us of host scheduler noise.
floor_ms = 0.1
