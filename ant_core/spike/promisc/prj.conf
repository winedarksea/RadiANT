# SPDX-License-Identifier: Apache-2.0
#
# Provenance: clean-room. Zephyr Kconfig only; nothing here derives from
# sdk-ant.
#
# Spike B owns the RADIO outright, on whichever core the RADIO lives on. On the
# nRF5340 that core is the network core, which normally runs a Bluetooth
# controller or the 802.15.4 driver - both of which would reprogram the
# registers underneath this program. src/main.c asserts they are absent rather
# than trusting this file.
#
# The console is the entire output. It goes out the board's default UART:
# uart20 on the nRF54L15 DK (COM7 on this bench) and uart0 on the nRF5340 DK
# network core, whose pins P1.00/P1.01 are wired to a DK VCOM (COM10 here). RTT
# is deliberately not the default - the VCOM needs no SEGGER DLL on the host,
# and a result that can only be read through vendor tooling is hard to archive.
# net_rtt.conf is the fallback and says when to reach for it.
#
# On the nRF5340 those two pins belong to the *application* core until it hands
# them over, so this image needs appcore/ programmed alongside it or it runs
# perfectly and prints nowhere. That is not a limitation of the part; it is one
# SYS_INIT hook, and part 1 of this spike lost a day to believing otherwise.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# printk is synchronous. A burst arrives faster than the console can drain, so
# the RADIO interrupt writes into a ring and main() prints from it; deferred
# logging would add a second buffer with its own overflow rule and no benefit.
CONFIG_LOG=n

# clock_control_on(CLOCK_CONTROL_NRF_SUBSYS_HF) starts the HFXO. The RADIO will
# not hold bit sync on the internal oscillator.
CONFIG_CLOCK_CONTROL=y

# Nothing else may claim the RADIO.
CONFIG_BT=n
CONFIG_MPSL=n
CONFIG_NRF_802154_RADIO_DRIVER=n
CONFIG_IEEE802154=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=n
