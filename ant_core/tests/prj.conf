#
# Configuration for the ant_core unit-test application.
#
# ant_core is pure logic sitting on top of ant_radio_hal.h, and the tests
# drive it against ant_core/tests/fake_radio.c rather than a radio. So there
# is deliberately nothing here about clocks, USB or the ANT stack: anything
# that needs hardware belongs on the bench, not in this application.
#
# Keep this file minimal. Zephyr aborts the build on an assignment to an
# undefined Kconfig symbol, so every line added here is a way for one agent's
# convenience setting to break every other agent's tests.

CONFIG_ZTEST=y

# The suites build tables of frames and channel state on the stack, and on
# native_sim an overrun surfaces as a wrong answer rather than as a fault -
# which is the worst possible failure mode for a test harness.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
