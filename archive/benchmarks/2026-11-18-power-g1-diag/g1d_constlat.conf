# G1 diag split: B (HFXO released every slot) with CONSTLAT held for the
# whole uptime. On nRF54L this takes an nrfx CONSTLAT reference at boot
# (zephyr/soc/nordic/common/nrf_sys_event.c), so the LP backend's own
# request/free never brings the count to zero.
CONFIG_SOC_NRF_FORCE_CONSTLAT=y
CONFIG_NRF_SYS_EVENT=y
# Only the CONSTLAT reference: no GRTC channel or RRAMC wake-up feature.
CONFIG_NRF_SYS_EVENT_IRQ_LATENCY=n
