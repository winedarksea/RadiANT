#
# The software power proxy with no console at all: read it over SWD.
#
#   west build ... -- -DEXTRA_CONF_FILE=power_diag_quiet.conf
#
# Then, with the target running, look up radiant_power_diag in
# build/<app>/zephyr/zephyr.elf and read its 0x58 bytes twice, some seconds
# apart (scripts/jlink_peek.ps1 -ElfPath ... -Symbol radiant_power_diag).
# The layout and the seq protocol are in
# radiant/include/radiant/radiant_power_diag.h.
#
# Logging, the serial driver and the console are off so the UART does not
# hold the high-frequency clock and inflate what is being estimated. printk
# stays (the boot banner selects it) but has nowhere to go.

CONFIG_RADIANT_POWER_DIAG=y
CONFIG_RADIANT_POWER_DIAG_LOG_S=0

CONFIG_TRACING=y
CONFIG_TRACING_USER=y

CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
