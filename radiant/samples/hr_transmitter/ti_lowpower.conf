#
# LAUNCHXL-CC26X2R1 battery build: the 48 MHz crystal stops between radio
# slots, and no log, console or UART driver. Apply on top of prj.conf:
#
#   west build -b cc26x2r1_launchxl hr_transmitter -- \
#       -DEXTRA_ZEPHYR_MODULES=C:/ncs/v3.4.0/modules/hal/ti \
#       -DEXTRA_CONF_FILE=ti_lowpower.conf
#
# Bench variant, with the power-diag log line (rfon_pm, pudur_us, cold, txl):
#
#       -DEXTRA_CONF_FILE="ti_lowpower.conf;power_diag.conf;console_on.conf"
#
# console_on.conf must come last: it turns the log and the console back on,
# which power_diag.conf alone does not.
#
# CONFIG_RADIANT_CC26XX_XOSC_HF_RELEASE: the RF driver requests XOSC_HF only
# while the RF core is powered; in between, the system clock is the RC
# oscillator (RCOSC_HF), recalibrated against the crystal at every switch.
# See radiant/src/radiant_ti_rf_hwattrs.c for what that does and does not
# change, and for the power-up lead it costs. cc26xx backend only; never in
# apps/dongle_ti, which refuses it.
#
# The console is off for its own current, not for the crystal: the UART does
# not hold XOSC_HF on this part, and a console on the calibrated RC oscillator
# still keeps time (the bench variant above depends on that). An enabled UART
# module (the datasheet's Iperi UART row, 167.5 uA) and the deferred log thread
# cost current and CPU time of their own.

CONFIG_RADIANT_CC26XX_XOSC_HF_RELEASE=y

CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
