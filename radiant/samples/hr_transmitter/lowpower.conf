#
# Battery build: no log, no console, no UART driver. Apply on top of prj.conf:
#
#   west build -b <board> hr_transmitter -- -DEXTRA_CONF_FILE=lowpower.conf
#
# On the DKs the console UART is otherwise on, and an enabled UARTE can keep the
# high-frequency clock running. With CONFIG_SERIAL=n no UART driver is linked,
# so no UARTE is ever enabled and the board overlays need no change. See the
# README's "Low power" section.

CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Release the HFXO and stop the radio TIMER between distant transmits
# (CONFIG_RADIANT_NRF_LOW_POWER, power plan Track B). Through an `imply`, so
# the nRF52840 rows, which that option does not support yet (pass B5), still
# build - without it. EXPERIMENTAL until Gate G1.
CONFIG_HR_TX_RELEASE_HFXO=y
