#
# LAUNCHXL-CC26X2R1. Needs the hal_ti module, which NCS's west manifest leaves
# out (scripts/fetch_hal_ti.ps1 fetches it), and radiant picks its cc26xx
# backend for this SoC on its own:
#
#   west build -b cc26x2r1_launchxl hr_transmitter -- \
#       -DEXTRA_ZEPHYR_MODULES=C:/ncs/v3.4.0/modules/hal/ti
#
# The console stays on the board's default uart0, the XDS110 backchannel, at
# 115200. This sample speaks no ANT serial protocol, so nothing else shares it.
#
# No CONFIG_PM: radiant's cc26xx backend refuses PM, PM_DEVICE and POWEROFF
# outside 802.15.4/BLE coexistence (see radiant/CMakeLists.txt).

# Deferred logging, as apps/dongle_ti does. Immediate mode formats every line
# from the caller's context, radiant logs from the radio path, and on this
# board that stalled the radio (apps/dongle_ti/boards/cc26x2r1_launchxl.conf).
CONFIG_LOG_MODE_DEFERRED=y

# A fault dump that names the thread, as in apps/dongle_ti.
CONFIG_THREAD_NAME=y
