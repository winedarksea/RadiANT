#
# Transmit only: open the channel as MASTER_TX_ONLY, so no receive window
# follows a transmit. Usually combined with lowpower.conf:
#
#   west build ... -- -DEXTRA_CONF_FILE="lowpower.conf;one_way.conf"
#
# Kept out of lowpower.conf on purpose: the ANT+ heart-rate profile asks for a
# bidirectional master. See HR_TX_ONE_WAY in Kconfig.

CONFIG_HR_TX_ONE_WAY=y
