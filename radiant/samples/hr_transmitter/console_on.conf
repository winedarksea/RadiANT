#
# Turns the log and the console back on after a fragment that turned them off,
# for a bench variant that needs a log line. Put it last:
#
#   west build -b cc26x2r1_launchxl hr_transmitter -- \
#       -DEXTRA_ZEPHYR_MODULES=C:/ncs/v3.4.0/modules/hal/ti \
#       -DEXTRA_CONF_FILE="ti_lowpower.conf;power_diag.conf;console_on.conf"
#
# (the TI XOSC_HF-release bench image: the power-diag line with rfon_pm,
# pudur_us, cold and txl). Only for boards whose console is a UART chosen in
# devicetree, as on the LaunchXL and the DKs. power_diag.conf does not set
# these itself: on the Pro Micro the board leaves SERIAL off, and turning it on
# there would change that board's power-diag image.

CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
