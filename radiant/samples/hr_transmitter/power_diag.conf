#
# The software power proxy with its log line. Add on top of prj.conf:
#
#   west build ... -- -DEXTRA_CONF_FILE=power_diag.conf
#
# Every 10 s the log prints one "power dt_ms=... hfxo_pm=... tx_us=..." line
# with the deltas since the previous one. The same counters are in the
# radiant_power_diag struct for a debugger; see
# radiant/include/radiant/radiant_power_diag.h. Every number is a proxy, not
# a current measurement - and the console UART this needs costs current of
# its own, so use power_diag_quiet.conf for a number you mean to keep.

CONFIG_RADIANT_POWER_DIAG=y
CONFIG_RADIANT_POWER_DIAG_LOG_S=10

# Idle entries (the wake rate) come through Zephyr's user tracing hook. A
# Kconfig choice member cannot be selected, so it is set here.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
