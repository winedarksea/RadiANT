#
# The Pro Micro's console over USB CDC ACM, back on after a fragment that
# turned it off, for a bench variant that needs a log line. Put it last, with
# console_cdc_promicro.overlay:
#
#   west build -b promicro_nrf52840/nrf52840/uf2 hr_transmitter -- \
#       -DEXTRA_CONF_FILE="lowpower.conf;power_diag.conf;console_cdc_promicro.conf" \
#       "-DEXTRA_DTC_OVERLAY_FILE=dcdc_promicro.overlay;console_cdc_promicro.overlay"
#
# (the nRF52840 HFXO-release bench image, power plan pass B5: build_all.ps1's
# hrtx_promicro_lp_pd row). The USB device
# controller holds the HFXO for as long as USB is up, so on this image the
# crystal never actually stops: what the power-diag line's hfxo_pm and
# radiant_nrf_lp_stats report is the radio stack's OWN request duty and its
# sleep/wake behaviour, not the board's current. console_on.conf is the UART
# boards' version of this.

CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
