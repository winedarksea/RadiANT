#
# The contended half of every measurement in this spike. Built as
# -DEXTRA_CONF_FILE=ble.conf, into a SEPARATE build directory, and compared
# against the baseline image.
#
# WHAT THIS IS ACTUALLY FOR. Finding 1 of the plan is that we cannot outrank the
# other stack: the two application-visible timeslot priorities rank us against
# ourselves, and the SoftDevice Controller holds levels above anything an
# application may request. So the numbers that matter are not "what priority did
# we ask for" but "what did the other stack's demand do to our grants", and that
# is a difference between two images rather than a property of one.
#
# The advertising interval below is the lever, and it is the same lever the
# in-tree nrf/samples/esb/esb_ptx_ble sample pulls when it runs BLE beside a
# timeslot user - that sample sets a 1 s CONNECTION interval for exactly this
# reason. A slow advertiser is a stack that asks for the radio rarely; a fast
# one is the adversarial case. Both are wanted, which is why the interval is a
# Kconfig here rather than a constant in the source.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="radiant-arb-spike"
CONFIG_BT_MAX_CONN=1

# The SoftDevice Controller, named rather than inherited.
#
# It is the default link-layer choice on a Nordic board, so this line changes
# nothing today - and it is here anyway, because it is the ONE fact that makes
# finding 1 of the plan true. The SoftDevice Controller is another MPSL user
# with priority levels above anything an application timeslot request may ask
# for; a build that had silently fallen back to the Zephyr controller would be
# measuring a different arbitration and every number would be optimistic.
#
# CONFIG_BT_CTLR IS NOT A SYMBOL TO SET. It is selected by the controller
# choice, and assigning it in v3.4.0 is a Kconfig warning that fails the build
# - which is how this line came to be written the right way round.
CONFIG_BT_LL_SOFTDEVICE=y

# The advertising interval is set in the source rather than here, because
# BT_LE_ADV_PARAM takes it per-advertiser and the adversarial sweep varies it
# between runs. 1.0-1.2 s is the intended production setting; see main.c.
