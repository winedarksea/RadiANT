#
# Provenance: clean-room. Zephyr Kconfig only.
#
# Two settings carry the whole purpose of this image and neither is left to a
# default:
#
#   CONFIG_SOC_NRF53_CPUNET_ENABLE=y clears RESET.NETWORK.FORCEOFF, without
#   which the network core never leaves reset and the capture program never
#   runs. It happens to default to y on this board today; stating it means a
#   future default cannot silently turn the capture rig off.
#
#   The console stays on the application core's own VCOM. src/main.c grants only
#   P1.00/P1.01 to the network core, so P0.20/P0.22 remain ours and the
#   heartbeat has somewhere to go. That second opinion is the difference between
#   "the network core is silent" and "the board is dead".

CONFIG_SOC_NRF53_CPUNET_ENABLE=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n

# This core must not touch the radio, the network core owns it.
CONFIG_BT=n
CONFIG_MPSL=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=n
