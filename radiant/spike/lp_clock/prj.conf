#
# Pass B1 LP-clock spike. printk only (synchronous); no logging subsystem so
# nothing else wakes the HF domain behind the measurement's back.

CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_CBPRINTF_FULL_INTEGRAL=y
CONFIG_SHELL=n

CONFIG_CLOCK_CONTROL=y
CONFIG_NRFX_GPPI=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=n

# Nothing else may claim the RADIO in the plain build.
CONFIG_BT=n
CONFIG_MPSL=n
