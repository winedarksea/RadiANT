# SPDX-License-Identifier: Apache-2.0
#
# USB holds the HFXO on nRF52840 while the device is enabled, so the board's
# CDC ACM console is initialised at boot but NOT enabled: main.c runs the
# HFXO-sensitive experiments (S1, S4, S3 sleep variant) first with USB off,
# buffers the text, then calls usbd_enable() and waits for DTR.
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Two RTC1 compare channels for the application, as Track B plans.
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=2

# Reboot into the UF2 bootloader on a 1200-baud touch or a "B" (Pro Micro has no reset button wired).
CONFIG_REBOOT=y
