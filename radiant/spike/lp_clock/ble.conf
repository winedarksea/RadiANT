# SPDX-License-Identifier: Apache-2.0
#
# S2 under BT/MPSL, the apps/hrm_ble shape: SoftDevice Controller, one
# peripheral link, advertising. Built with -DEXTRA_CONF_FILE=ble.conf into its
# own build dir. The spike then only reports GRTC channel / GPPI availability
# and runs a short held-HFXO S3 to prove the GRTC->TIMER20 route works with
# MPSL present. It never touches the RADIO registers in this build.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="RadiANT LP spike"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_MPSL=y
