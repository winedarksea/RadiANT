#
# Provenance: clean-room. Zephyr Kconfig and radiant's own Kconfig only;
# nothing here derives from sdk-ant.
#
# This spike owns the RADIO outright, through radiant's nrf backend rather
# than by writing registers itself. Anything else that would claim the
# peripheral has to be absent, and src/main.c BUILD_ASSERTs it rather than
# trusting this file.
#
# The console is the entire output of this program. It goes out the board's
# default UART - uart20 on the nRF54L15 DK, which is COM7 on this bench. RTT is
# deliberately not used, on the same terms as spike/rx_raw: the VCOM needs no
# SEGGER DLL on the host, and a result that can only be read through vendor
# tooling is a result that is hard to archive.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# No logging subsystem. printk is synchronous, this program prints one line a
# second, and deferred logging would only add a way to lose the last lines of a
# run when the buffer wraps.
#
# radiant's own LOG_INF/LOG_ERR calls fold away with this off, which is
# what is wanted here: the counters this spike prints are its result, and the
# backend narrating underneath them would bury them.
CONFIG_LOG=n

# ── The module under test ───────────────────────────────────────────────────
#
# CONFIG_RADIANT_BACKEND_NRF is the whole experiment. The frame formats in
# src/main.c are local static consts handed to radiant_radio_tx(); everything
# that turns them into bits on the air is the shipping backend, unmodified.
#
# THIS ASSIGNMENT CAN BE SILENTLY IGNORED, which is why src/main.c asserts on
# the result rather than on this line. RADIANT_BACKEND_NRF depends on
# SOC_COMPATIBLE_NRF52X || SOC_COMPATIBLE_NRF54LX; on any other part the
# dependency is unmet, Kconfig falls back to the choice default
# (RADIANT_BACKEND_NULL), no error is printed, and the image runs the
# scheduler and transmits nothing. See radiant/Kconfig's note on the same
# trap.
CONFIG_RADIANT=y
CONFIG_RADIANT_BACKEND_NRF=y

# The antr_* adapter (src/ant_radio_radiant.c) is application-side now
# (src/Kconfig.antr_api), not part of the radiant module, so it is
# unreachable from this spike's Kconfig tree with no line needed here to say
# so - the same way the unit-test application leaves it out.

# Nothing else may claim the RADIO. The backend BUILD_ASSERTs !CONFIG_BT for
# itself; MPSL is listed for the same reason spike/rx_raw lists it.
CONFIG_BT=n
CONFIG_MPSL=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=n
