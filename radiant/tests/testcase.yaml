# SPDX-License-Identifier: Apache-2.0
#
# One twister test application covering all of radiant. The suites inside it
# are separate ZTEST_SUITE()s in src/*.c rather than separate applications:
# they share fake_radio.c and one prj.conf, and a per-module application would
# multiply build time by the number of core agents for no isolation gain -
# ztest already isolates suites from each other. Adding a suite therefore
# means adding a file to src/, and this file does not change.

# ── The timeout, and why it is not twister's 60 s default ───────────────────
#
# docs/radiant-security.md section 11.3 publishes a cost table for epoch
# recovery - 50, 1 000 and 65 536 CMAC operations for a receiver that many boots
# out of date - and radiant/tests/src/test_sec_compat_attest.c asserts it by
# performing those operations rather than by describing them. On a host with a
# software AES that is tens of seconds, and it is the only part of this
# application that is not effectively instant.
#
# Lowering it would mean asserting the cost table with a smaller number than the
# document states, which is the one change that would make the assertion
# meaningless. So the timeout moves instead, once, with the reason next to it.
tests:
  radiant.unit:
    timeout: 300
    tags:
      - radiant
    # native_sim only, and 32-bit on purpose. These tests contain no hardware
    # access at all, so a real board would prove nothing extra, while the
    # 32-bit host build shares pointer and long widths with the nRF52/nRF54
    # target and therefore catches the struct-packing and size assumptions
    # that a 64-bit host would quietly hide.
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim

  # The same suites against a MODE-LEVEL crypto backend.
  #
  # radiant_sec.h claims a two-level seam - policy calls modes, modes call
  # blocks - so that CRACEN on nRF54L, which is reachable only as a whole-mode
  # PSA call, can be attached later without touching radiant_sec.c. A seam
  # whose only implementation is the portable one is indistinguishable from a
  # direct implementation with extra prototypes, and stays that way until
  # somebody tries to attach hardware and finds the path was never live.
  #
  # So this scenario suppresses the portable AES-CTR/AES-CMAC layer and lets
  # src/sec_modes_backend.c supply the modes instead, advertising has_ctr and
  # has_cmac exactly as a real accelerator would. The same published vectors
  # run against it.
  radiant.unit.sec_modes:
    timeout: 300
    tags:
      - radiant
      - radiant_sec
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RADIANT_SEC_BACKEND_MODES=y

  # The same suites with X25519 and pairing COMPILED OUT.
  #
  # prj.conf turns pairing on for every other scenario (it must:
  # scripts/run_ztest_hw.ps1 builds prj.conf only), so the scenario that used
  # to be here - radiant.unit.pairing, adding =y on top of a prj.conf that
  # already said =y - was a no-op duplicate, and the default-n configuration
  # every shipping dongle uses was built by no ztest scenario at all (review
  # 2026-10-31, E3-2). This is that build. The X25519 suites (sec_x25519,
  # sec_pair, profile_enrol, node_ident's pairing block) compile out here by
  # their own #if; min_cases.radiant.unit.no_pairing in
  # tests/expected_counts.yaml says how many cases that leaves, so a suite that
  # vanishes elsewhere is still caught.
  #
  # The fake entropy backend goes off here too, for the same reason: a dongle
  # has no RNG and no node identity of its own, and this is the build of what
  # a dongle ships. With it off, CONFIG_RADIANT_NODE_IDENT_SELF_PROVISION is
  # off by dependency, so node_ident's "unprovisioned node cannot boot" and
  # "the RNG seam compiles out" cases run here and the first-boot provisioning
  # cases (ADR 0020) compile out by their own #if. Folded into this scenario
  # rather than given its own because a scenario is a whole-suite run.
  radiant.unit.no_pairing:
    timeout: 300
    tags:
      - radiant
      - radiant_sec
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RADIANT_SEC_PAIRING_X25519=n
      - CONFIG_RADIANT_TEST_FAKE_RNG=n

  # The same suites with the ACK fault instrument COMPILED IN
  # (CONFIG_RADIANT_ACK_FAULTS, apps/trainer's lever on the acknowledger).
  # Two halves of one claim: test_transfer.c's reply_plan cases exist only
  # here, and every OTHER transfer case runs here too with no op installed,
  # which is what "a NULL op is exactly the unhooked path" means as a test.
  # The default-off build is radiant.unit above.
  radiant.unit.ack_faults:
    timeout: 300
    tags:
      - radiant
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RADIANT_ACK_FAULTS=y

  # The same suites with the 0xF7 diagnostic counters COMPILED IN
  # (CONFIG_RADIANT_DIAG_COUNTERS, ADR 0023). Page 7's scheduler counters
  # (ADR 0022 gate 3) are counted inside radiant_sched.c, which only this
  # application's test_sched.c drives directly; their cases exist only here.
  # Every other case runs here too, which is what "the counters change no
  # behaviour" means as a test. radiant.api.diag covers the pages themselves.
  radiant.unit.diag:
    timeout: 300
    tags:
      - radiant
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RADIANT_DIAG_COUNTERS=y
