#
# The nRF backend completion path, compiled against fake registers. native_sim
# only: the fakes shadow nrfx.h, which a real nRF board SoC layer includes.
tests:
  radiant.backend:
    tags:
      - radiant
      - mpsl
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  radiant.backend.d2:
    # The same suite with CONFIG_RADIANT_GATE_MPSL_D2 (ADR 0018, default y on
    # every MPSL gate): the arm's staged branches pay an owed release in
    # d2_settle_now(), so test_arm_handback.c's staged-successor case runs
    # through it. The gate stays stubbed; booking is reported off.
    tags:
      - radiant
      - mpsl
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RADIANT_GATE_MPSL_D2=y
  radiant.backend.lp:
    # CONFIG_RADIANT_NRF_LOW_POWER (power plan pass B3): the backend's HFXO
    # release and two-edge wake against a simulated GRTC, HFXO and TIMER.
    tags:
      - radiant
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_LP=1
  radiant.backend.lp_rtc:
    # The same backend on the nRF52840's LF counter (power plan pass B5):
    # every radiant.backend.lp case against a simulated RTC1 (32768 Hz,
    # 24-bit, Zephyr's nrf_rtc_timer rules), PPI and the nRF52 TIMER's
    # SHUTDOWN, plus RTC1's own cases (src_lp_rtc/).
    tags:
      - radiant
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_LP=1
      - BACKEND_LP_RTC=1
  radiant.backend.lp_mpsl:
    # CONFIG_RADIANT_NRF_LOW_POWER on the MPSL gate's build (power plan pass
    # B6): the TIMER stopped between timeslots and started from the GRTC at
    # each SIGNAL_START, against a simulated GRTC, HFXO and TIMER. The gate's
    # half (which signal reaches which hook) is radiant.gate.lp.
    tags:
      - radiant
      - mpsl
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_LP_MPSL=1
