#
# The nRF backend completion path, compiled against fake registers. native_sim
# only: the fakes shadow nrfx.h, which a real nRF board SoC layer includes.
tests:
  radiant.backend:
    tags:
      - radiant
      - mpsl
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  radiant.backend.lp:
    # CONFIG_RADIANT_NRF_LOW_POWER (power plan pass B3): the backend's HFXO
    # release and two-edge wake against a simulated GRTC, HFXO and TIMER.
    tags:
      - radiant
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_LP=1
  radiant.backend.lp_rtc:
    # The same backend on the nRF52840's LF counter (power plan pass B5):
    # every radiant.backend.lp case against a simulated RTC1 (32768 Hz,
    # 24-bit, Zephyr's nrf_rtc_timer rules), PPI and the nRF52 TIMER's
    # SHUTDOWN, plus RTC1's own cases (src_lp_rtc/).
    tags:
      - radiant
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_LP=1
      - BACKEND_LP_RTC=1
