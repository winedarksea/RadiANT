# SPDX-License-Identifier: Apache-2.0
#
# The TI CC26xx backend against a fake RF driver and hal_ti's real driverlib
# command headers. native_sim only: the fakes shadow <ti/drivers/rf/RF.h>,
# which a real TI board's SoC layer provides.
tests:
  radiant.backend_cc26xx:
    tags:
      - radiant
      - cc26xx
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  radiant.backend_cc26xx.coex:
    # CONFIG_RADIANT_BACKEND_CC26XX_COEX: every arm through RF_scheduleCmd,
    # and radiant_radio_cc26xx_arb.c's submit/execute hooks (src_coex/).
    # Also CONFIG_RADIANT_DIAG_COUNTERS, so the backend's 0xF7 counters
    # (cc_diag) compile and test_terminal.c can read status_err; the plain
    # scenario keeps them off, as a production build does.
    tags:
      - radiant
      - cc26xx
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_COEX=1
    extra_configs:
      - CONFIG_RADIANT_DIAG_COUNTERS=y
  radiant.backend_cc26xx.short_match:
    # CONFIG_RADIANT_SEARCH_SHORT_MATCH, the shipping default (ADR 0022):
    # only the caps parity test (src_caps/), which checks the 2-byte sync
    # word and the wildcard against radiant/tests/common/caps_presets.h.
    tags:
      - radiant
      - cc26xx
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_SHORT_MATCH=1
