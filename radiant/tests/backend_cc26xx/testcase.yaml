# SPDX-License-Identifier: Apache-2.0
#
# The TI CC26xx backend against a fake RF driver and hal_ti's real driverlib
# command headers. native_sim only: the fakes shadow <ti/drivers/rf/RF.h>,
# which a real TI board's SoC layer provides.
tests:
  radiant.backend_cc26xx:
    tags:
      - radiant
      - cc26xx
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  radiant.backend_cc26xx.coex:
    # CONFIG_RADIANT_BACKEND_CC26XX_COEX: every arm through RF_scheduleCmd,
    # and radiant_radio_cc26xx_arb.c's submit/execute hooks (src_coex/).
    tags:
      - radiant
      - cc26xx
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - BACKEND_COEX=1
