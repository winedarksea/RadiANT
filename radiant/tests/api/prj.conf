#
# Configuration for the radiant_api composition test application.
#
# The difference from ../prj.conf is CMakeLists.txt here always adding
# ../../../apps/common/ant_radio_radiant.c, which is the reason this is a
# separate application - see the CMakeLists here for why it cannot simply be
# added to the parent's suite.

CONFIG_ZTEST=y

CONFIG_RADIANT=y
# fake_radio.c is the HAL implementation for this image; a second one would be a
# duplicate-symbol link error.
CONFIG_RADIANT_BACKEND_NONE=y
# Declared by this application's own Kconfig (rsource of src/Kconfig.antr_api)
# rather than by radiant's. CMakeLists.txt here does not read it to decide
# whether to compile ant_radio_radiant.c - it always does - but
# CONFIG_RADIANT_SEC_HOST_MESSAGES `depends on` this symbol, and the
# radiant.api.sec_host testcase.yaml scenario needs to be able to turn
# that on.
CONFIG_RADIANT_ANTR_API=y

# radiant_api.c runs a real Zephyr thread and a real mutex, so this application
# needs both to exist. The suite drives the radio from the ztest thread and
# leans on the event thread only where it is the subject - the housekeeping
# watchdog - so nothing here waits on it otherwise.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# LOG_DBG in radiant_api.c is what a bring-up session is read on. Off by
# default here: a suite that runs eight periods per test would emit a line per
# window, and ztest's own output is the thing being parsed.
CONFIG_LOG=y
CONFIG_RADIANT_LOG_LEVEL_WRN=y
