#
# Configuration for the radiant unit-test application.
#
# radiant is pure logic sitting on top of radiant_radio_hal.h, and the
# tests drive it against radiant/tests/fake_radio.c rather than a radio.
# So there is deliberately nothing here about clocks, USB or the ANT stack:
# anything that needs hardware belongs on the bench, not in this application.
#
# Keep this file minimal. Zephyr aborts the build on an assignment to an
# undefined Kconfig symbol, so every line added here is a way for one agent's
# convenience setting to break every other agent's tests.

CONFIG_ZTEST=y

# The module under test, consumed as a module. BACKEND_NONE because
# fake_radio.c in this directory is the HAL implementation for this image, and
# a second one would be a duplicate-symbol link error. The antr_* adapter
# (src/ant_radio_radiant.c, application-side since it moved out of the module)
# is never part of this build at all now - there is no CONFIG_RADIANT_ANTR_API
# to turn off here any more, because there is no application Kconfig tree in
# this application to declare it in the first place, matching the reasoning
# the old =n line gave: the suites test the modules, not the forwarding onto
# src/ant_radio.h.
CONFIG_RADIANT=y
CONFIG_RADIANT_BACKEND_NONE=y

# The crypto primitives. On here and off in every product build: the feature's
# governing constraint is that it costs nothing to the overwhelming majority
# who never enable it, so src/radiant_sec_aes.c is Kconfig-gated rather than
# compiled unconditionally the way radiant_crc_repair.c is. This is the door a
# real application uses, and the suite goes through it rather than around it.
#
# No CONFIG_RADIANT_SEC_HOST_MESSAGES line: like RADIANT_ANTR_API above,
# that symbol now lives in src/Kconfig.antr_api, an application-side fragment
# this module-only application never sources - so src/ant_sec_host.c, the host
# adapter that is the one security file reaching an application header, is
# never reachable from here at all, the same way it was meant to stay off.
CONFIG_RADIANT_SEC=y

# Energy detect and the channel-quality map (RF-4). Through the same door a
# bench build uses, and for the same reason CONFIG_RADIANT_SEC is on here:
# without it src/test_ed.c compiles against the header's disabled inlines,
# every map read returns false, and the suite reports a pass for having
# asserted nothing. The scheduler's SLOT_ED branches fold away against a
# compile-time zero, so this is also the only configuration in which the
# phase's own gate - the tracked schedule being identical with ED on - is a
# comparison rather than a tautology.
CONFIG_RADIANT_ED_SCAN=y

# The compat attestation primitives, for the same reason and through the same
# door. Nothing in radiant calls them yet - src/test_sec_compat.c is their
# only caller anywhere - so without this line the suite would link against the
# header's disabled inlines and assert ENOTSUP at every call site while
# reporting a pass.
CONFIG_RADIANT_SEC_COMPAT=y

# Four compat contexts rather than the default two, because compat-C8's gate is
# a NODE PLUS THREE KEYED RECEIVERS: the one that sent the switch command and
# two that did not. Three is the smallest number that can catch the failure the
# private-mode switch is most likely to ship with - a handover that is clean for
# the receiver which asked and a dropout for every other one - and a bench with
# one head unit cannot see it at all.
#
# 672 bytes each, and nothing else changes: the default of two is sized for a
# node, and this image is a room.
CONFIG_RADIANT_SEC_COMPAT_MAX_CHANNELS=4

# X25519 and the pairing state machine (compat-C7).
#
# It WAS a twister-only scenario (testcase.yaml's radiant.unit.pairing),
# and that meant every pairing assertion in this repository - test_sec_pair.c,
# test_sec_x25519.c, node_ident.c's window and now the whole of Layer D -
# compiled to nothing in the run the hardware gate actually performs
# (scripts/run_ztest_hw.ps1 builds this prj.conf and nothing else). A suite that
# is empty on the gate that must pass is a suite that reports a pass for having
# said nothing, which is the exact failure mode ANTR_API=n's comment above
# exists to prevent.
#
# The cost is the software ladder, and it is bounded: test_sec_x25519.c pins one
# X25519 at under 250 ms and the whole of pairing across this application is
# tens of ladders, against the gate's 240-second ceiling.
CONFIG_RADIANT_SEC_PAIRING_X25519=y

# The suites build tables of frames and channel state on the stack, and on
# native_sim an overrun surfaces as a wrong answer rather than as a fault -
# which is the worst possible failure mode for a test harness.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
