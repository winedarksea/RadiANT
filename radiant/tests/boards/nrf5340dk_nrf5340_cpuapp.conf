#
# nRF5340 DK only (scripts/run_ztest_hw.ps1). At the default
# CONFIG_ZTEST_ASSERT_VERBOSE=1 this image overflows the 1 MB app-core flash
# (5648 B over on 591174b, 2026-11-19): about 590 KB of it is stringified assert
# text, not code. Level 0 prints file:line on a failure instead (image ~51 %).
# twister on native_sim does not read this file and keeps level 1. Owner-approved
# fallback (2026-11-13) for when the assert-text trim fills again.
CONFIG_ZTEST_ASSERT_VERBOSE=0
