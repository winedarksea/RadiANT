# nRF54LM20A DK - the first nRF54 part this can actually be a dongle on.
#
# The LM20A is the one member of the nRF54L family with a USB device
# controller. It is not the Nordic USBD block from the nRF52840: it is a
# licensed DesignWare DWC2, exposed as `usbhs@5a000` with
# compatible = "nordic,nrf-usbhs-nrf54l", "snps,dwc2", and the DK wires it up
# as zephyr_udc0. Zephyr's only DWC2 driver is drivers/usb/udc/udc_dwc2.c,
# which belongs to the new USB device stack - there is no usb_dc_dwc2.c, so
# the legacy stack is not available here at any price. That, rather than any
# judgement about which stack is nicer, is why this build uses the new one.
#
# Two consequences worth knowing before trusting this against a host:
#
#   - It is a high-speed controller, so the device enumerates at 480 Mbit/s
#     with 512-byte bulk endpoints, where a retail ANT stick is full speed with
#     64. The frames are identical and libusb hides the packet size, but this
#     is the one respect in which the impersonation is no longer exact.
#   - ANT support comes from lib/nrf54l/libant.a. SOC_NRF54LM20A selects
#     SOC_SERIES_NRF54LX, which is what sdk-ant's ANT_LIB_DIR keys on, so the
#     prebuilt library does apply to this part.
#
# Build only so far - no hardware here to enumerate against. The USB path this
# shares with the Feather's new-stack build is what has been exercised; what
# remains untested is DWC2 itself.
#
#   west ... -b nrf54lm20dk/nrf54lm20a/cpuapp

CONFIG_ANT_DONGLE_TRANSPORT_USB_NEXT=y

# Console on uart20 (VCOM0), as on the other DKs. Left on because this is a
# development board and the DWC2 path has never run here - the first failure
# will want a log, and unlike the Feather this board has somewhere to put one.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
