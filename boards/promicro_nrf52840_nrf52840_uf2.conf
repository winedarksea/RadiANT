# Pro Micro nRF52840 ("nice!nano" clones, SuperMini, and the many unbranded
# AliExpress boards using this footprint).
#
# The board's own /uf2 defconfig already sets CONFIG_BUILD_OUTPUT_UF2 and
# CONFIG_USE_DT_CODE_PARTITION, and its devicetree pulls in
# nrf52840_partition_uf2_sdv6.dtsi, so the application lands at 0x26000 without
# help from us. What is left is the console and the clock.

# Suppress the board's CDC-ACM serial backend. Its Kconfig.defconfig sources
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig, which turns on
# USB_DEVICE_STACK_NEXT and brings up CDC ACM at boot - both of which fight our
# legacy-stack vendor class for the one USB device. Same fix as the Feather.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# The low-frequency clock source is deliberately left at the board default,
# which is the 32.768 kHz crystal (LFXO).
#
# ANT needs that clock inside +/-50 ppm. A crystal delivers it with the lowest
# jitter available, and the boards in this footprint do appear to fit one - so
# when it is there, use it. Nothing to set here; Zephyr's default choice is
# already XTAL.
#
# If a particular board turns out not to have one, build with synth.conf
# instead. Do not switch the default on suspicion: LFSYNTH costs jitter and
# holds HFCLK on permanently, and both are pure loss on a board that has the
# part.
#
# The two failure modes are easy to tell apart, because ant_init() gates
# usb_enable() in main.c:
#
#   never enumerates at all      -> LFXO never started; no crystal. Use synth.conf.
#   enumerates, drops channels   -> clock running but out of tolerance.
#
# A board that enumerates and holds a session under tools/ant_session.py has
# the crystal and is on the right build.

# 1 ms between VBUS detection and USB attach, letting the USB regulator settle
# after the bootloader hands over. Same reasoning as the Feather.
CONFIG_USB_NRFX_ATTACHED_EVENT_DELAY=1
