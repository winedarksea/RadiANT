# LAUNCHXL-CC26X2R1 - the ANT+ dongle on a second vendor's silicon.
#
# Not a Nordic part and not a dongle: there is no USB device peripheral on a
# CC2652R at all, so this board can never enumerate. What it is for is proving
# that everything above radiant_radio_hal.h - the frame codec, the schedule,
# the channel state machines, the search policy, the event queue, the transfer
# engine and the whole serial bridge - is genuinely vendor-neutral, by running
# unchanged on a radio from a different company. The ANT serial protocol goes
# out a UART, which is what it was to begin with; a USB ANT stick is a
# UART-to-USB bridge in a plastic shell, and the CP2102N-based module this
# board is standing in for is exactly that.
#
#   . .\scripts\fetch_hal_ti.ps1       (once - NCS filters hal_ti out)
#   west ... -b cc26x2r1_launchxl -- -DANT_RADIO=core -DRADIANT_BACKEND=null \
#            -DEXTRA_ZEPHYR_MODULES=C:/ncs/v3.4.0/modules/hal/ti
#
# Then talk to the XDS110 backchannel UART - COM14 on this bench - AT 57600,
# not at 115200. See the overlay for which UART is which and why the rate
# differs from every other board here.

CONFIG_ANT_DONGLE_TRANSPORT_UART=y

# ── Two UARTs, kept apart from the first build ──────────────────────────────
#
# uart0 carries ANT and uart1 carries the log. They are never the same UART
# and never will be: a host tool reading the ANT stream would parse a log line
# as a frame, and the resulting checksum failures look like a radio problem.
# That is an afternoon, and it is an afternoon nobody has to spend because the
# decision is made here rather than after the symptom.
#
# The cost is that the log leaves on BoosterPack pins DIO22/DIO24 with nothing
# attached, so this image is silent unless a 3V3 USB-serial adapter is clipped
# to them. That is the right trade: the ANT stream is the thing under test and
# tools/ant_probe.py is the instrument, so a build whose ANT port is clean and
# whose log port is dark is more useful than one where both are muddled.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# RTT off, and this is not a preference. prj.conf turns it on because the
# Feather has no debugger and no console, so a RAM buffer nobody drains is the
# least bad option there. Here the debugger is an XDS110 and SEGGER's RTT
# needs a J-Link; leaving it on would allocate the buffer and the backend for
# output that has no possible reader on this board.
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# The build must reach the link, and the log must survive a fault.
#
# Deferred logging is prj.conf's default and it is what turns a stack overflow
# into a board that "goes quiet" - the fault message needs a log thread that no
# longer exists. That failure mode has already cost this project a session on
# the MPSL gate, and this is the first bring-up on unfamiliar silicon, which is
# precisely where an unexplained silence is most expensive.
CONFIG_LOG_MODE_IMMEDIATE=y

# ── Name the threads, because the first bring-up bug needed it ──────────────
#
# On the first window this backend ever ran, the board reset inside the
# completion path. The dump said
#
#   >>> ZEPHYR FATAL ERROR 2: Stack overflow on CPU 0
#   Current thread: 0x200025e8 (unknown)
#
# and "(unknown)" cost an hour: three stacks - ISR, system work queue, main -
# were raised first on plausible reasoning about where a deep RF driver call
# would land, and NONE OF THEM WAS THE ONE. The answer came from looking the
# pointer up in the ELF with `arm-zephyr-eabi-nm -n -S`, which named
# api_event_thread_data - radiant_core's own event thread, whose stack is sized
# in radiant_core/src/radiant_api.c and now has a cc26xx arm.
#
# radiant_api.c's own comment had already recorded this exact failure and this
# exact wrong turn, on the nRF, and had already said that CONFIG_THREAD_NAME
# plus CONFIG_LOG_MODE_IMMEDIATE is what makes the dump say the answer out
# loud. The advice was there and was not taken. It is taken here.
CONFIG_THREAD_NAME=y
