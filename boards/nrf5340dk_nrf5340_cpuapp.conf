# nRF5340 DK - the board to debug USB on.
#
# The Feather has no debugger, so a failure inside usb_enable() is invisible
# there. This DK has an onboard J-Link *and* a separate "nRF USB" connector
# wired to the SoC's own USB device peripheral, so the same class code can be
# exercised with RTT logs and a real host enumeration at the same time, with no
# wiring. Build it with stub.conf: sdk-ant on an nRF5340 is the dual-core
# ANT_NP path, which is not what the Feather uses and not what is being
# debugged here.
#
#   west ... -b nrf5340dk/nrf5340/cpuapp -- "-DEXTRA_CONF_FILE=stub.conf"
#   scripts\flash_dk.ps1       # copies the hex to the JLINK drive
#
# No UF2 and no code-partition offset: this one is flashed at 0 by the onboard
# debugger rather than loaded by a bootloader.

# Logs go out the J-Link OB's VCOM port, not RTT. RTT would need SEGGER's
# JLinkARM DLL installed; the VCOM is just a COM port on the host, and the
# same USB cable that programs the board carries it.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# Deferred logging discards whatever is still queued when execution stops,
# which is exactly the interesting case. Immediate mode formats in the caller's
# context, so the last line before a hang has already been emitted.
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y

# The whole point of building for this board: the USB stack's own account of
# what it did, which is what the Feather cannot tell us.
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
CONFIG_USB_DRIVER_LOG_LEVEL_DBG=y

# Immediate mode formats each message on the stack of the thread that logged
# it, and main() drives USB bring-up. 2 KB is not enough for that at DBG level,
# and the overflow would look like the hang being chased.
CONFIG_MAIN_STACK_SIZE=4096
