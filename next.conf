# Build an nRF52840 target on the new USB device stack (USBD/UDC).
#
# The nRF54 dongle targets have no choice about this - their DWC2 controller
# has no legacy driver - so the new-stack class in src/usb_ant_class_next.c is
# code that has to work, on hardware that does not exist here yet. This
# fragment runs that same file on a Feather, which is a board a host has
# already accepted the legacy build from. If the two enumerate identically and
# tools/ant_probe.py passes against both, the class is exonerated and anything
# that later fails on an nRF54 is DWC2 or the port, not the class.
#
# It is a test configuration, not a shipping one. Releases stay on the legacy
# stack for nRF52840, because that is the build with hours on it against Zwift.
#
# Usage:
#   west build ... -b adafruit_feather_nrf52840/nrf52840/uf2 -- "-DEXTRA_CONF_FILE=next.conf"

CONFIG_ANT_DONGLE_TRANSPORT_USB_NEXT=y

# Expect one Kconfig warning on this build, from the board .conf:
#
#   USB_NRFX_ATTACHED_EVENT_DELAY was assigned the value '1' but got the value ''
#
# It and USB_DEVICE_REMOTE_WAKEUP both live inside `if USB_DEVICE_DRIVER` and so
# do not exist here. Only the first one warns, because assigning n to a symbol
# that is already n changes nothing. Neither needs a replacement: UDC does not
# expose an attach delay, and remote wakeup is off unless the configuration asks
# for it, which ours does not - USBD_CONFIGURATION_DEFINE is given attributes
# of 0.
