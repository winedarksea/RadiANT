#
# The P4 gate's OTHER BOARD: a Thread leader for the DUT to attach to.
#
# This is NOT a fragment for this application. It overlays NCS's OpenThread CLI
# sample, which is built and flashed onto the nRF5340 DK:
#
#   west -z C:\ncs\v3.4.0\zephyr build `
#        -s C:\ncs\v3.4.0\nrf\samples\openthread\cli `
#        -d build\p4peer -b nrf5340dk/nrf5340/cpuapp `
#        -- "-DEXTRA_CONF_FILE=C:\Users\Colin\ant_dongle\p4_peer.conf"
#
# It lives in this repository anyway, beside thread.conf and thread_sed.conf,
# because the one thing that must be true of all three files is that their
# credentials MATCH - and credentials that match are the kind of thing that stops
# being true the moment the two halves live in different trees. A DUT that never
# attaches produces `sent=0`, and `sent=0` with a beautiful ANT+ loss figure is
# the exact false pass src/thread_coex_load.c exists to prevent.
#
# ---------------------------------------------------------------------------
# WHY THE 5340 AND NOT THE FEATHER OR THE DONGLE
# ---------------------------------------------------------------------------
#
# The peer has to be a full Thread device (FTD) so it can be the leader and
# parent the DUT's MTD. It also has to be observable - "did the DUT attach" is
# the first question every failed run asks, and answering it from the peer's
# console is far cheaper than inferring it from the DUT's. The nRF5340 DK has a
# console; the Feather in its current build has none at all, and the nRF52840
# Dongle is busy being an ANT+ stick.
#
# ITS CONSOLE VCOM NEEDS DTR ASSERTED (COM9 on this bench). Without it the port
# reads as completely silent, which is indistinguishable from a board that did
# not boot - and that misreading cost a whole investigation once already.
#
# ---------------------------------------------------------------------------
# THE CREDENTIALS
# ---------------------------------------------------------------------------
#
# Identical to thread.conf's, byte for byte. Bench values, not secrets. Channel
# 26 is the top of the 802.15.4 band and the one channel clear of the common
# 2.4 GHz Wi-Fi channels - which does not buy a better ANT+ loss floor (that
# floor is band-flat and the Wi-Fi attribution was measured and refuted) but does
# remove one variable from any argument about the gate's result.

CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MANUAL_START=n
CONFIG_OPENTHREAD_NETWORK_NAME="radiant-p4"
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_CHANNEL=26
CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"

# The peer is a passive parent by design: it forms the network, parents the DUT,
# and absorbs the DUT's multicast datagrams. It deliberately generates NO traffic
# of its own. All contention in this gate must originate on the DUT's radio, or
# the number stops being a property of the DUT and becomes a property of the
# room - and a two-board gate whose second board is also a load is not separable
# afterwards.
